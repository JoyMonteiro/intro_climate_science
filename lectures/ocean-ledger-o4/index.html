,"y":42750,"w":6625,"h":2125,"rotation":0,"z":965,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">It keeps turning until it is \u003cspan style=\"font-weight:700;color:#00809A\">running along the hill\u003c/span>.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_120","enterEffect":"fade","onExit":"leave","exitAt":"fr_120","exitEffect":"fade"}},{"id":"img_125","type":"svg","x":60025,"y":38625,"w":12500,"h":10750,"rotation":0,"z":524,"content":"assets/geo_bal.svg","lifecycle":{"enterAt":"fr_124","enterEffect":"fade","onExit":"leave","exitAt":"fr_129","exitEffect":"fade"}},{"id":"txt_126","type":"text","x":72900,"y":39125,"w":6625,"h":1125,"rotation":0,"z":966,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">At right angles\u003c/div>","textStyle":{"fontSize":600,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_124","enterEffect":"fade","onExit":"leave","exitAt":"fr_129","exitEffect":"fade"}},{"id":"txt_127","type":"text","x":72900,"y":40500,"w":6625,"h":2750,"rotation":0,"z":967,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">The water flows \u003cspan style=\"font-weight:700;color:#C9531A\">perpendicular to the force pushing it\u003c/span>. Pressure pushes out, Coriolis pushes in.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_124","enterEffect":"fade","onExit":"leave","exitAt":"fr_129","exitEffect":"fade"}},{"id":"txt_128","type":"text","x":72900,"y":43375,"w":6625,"h":1500,"rotation":0,"z":968,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">Nothing runs downhill, so \u003cspan style=\"font-weight:700;color:#C9531A\">the hill stays up\u003c/span>.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_124","enterEffect":"fade","onExit":"leave","exitAt":"fr_129","exitEffect":"fade"}},{"id":"txt_130","type":"text","x":72900,"y":45125,"w":6625,"h":1375,"rotation":0,"z":969,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">\u003cspan style=\"font-weight:700;color:#4A55A2\">Same form as Ekman:\u003c/span> motion at 90° to the push.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_129","enterEffect":"fade","onExit":"leave","exitAt":"fr_129","exitEffect":"fade"}},{"id":"txt_131","type":"text","x":72900,"y":46750,"w":6625,"h":1625,"rotation":0,"z":970,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">1 m over 1,500 km: \u003cspan style=\"font-weight:700;color:#00809A\">≈ 7 cm/s\u003c/span>.\u003cbr>1 m over 100 km: \u003cspan style=\"font-weight:700;color:#C9531A\">≈ 1 m/s\u003c/span>.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_129","enterEffect":"fade","onExit":"leave","exitAt":"fr_129","exitEffect":"fade"}},{"id":"img_133","type":"svg","x":0,"y":0,"w":36000,"h":16000,"rotation":0,"z":304,"content":"assets/f_ssh.svg","lifecycle":{"enterAt":"fr_132","enterEffect":"fade","onExit":"leave","exitAt":"fr_145","exitEffect":"fade"}},{"id":"img_134","type":"svg","x":0,"y":16600,"w":13587.75,"h":2200,"rotation":0,"z":525,"content":"assets/k_ssh.svg","lifecycle":{"enterAt":"fr_132","enterEffect":"fade","onExit":"leave","exitAt":"fr_132","exitEffect":"fade"}},{"id":"txt_135","type":"text","x":0,"y":-2850,"w":36000,"h":2600,"rotation":0,"z":971,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">The hills are real: about \u003cspan style=\"font-weight:700;color:#C9531A\">1 m\u003c/span> high, thousands of km across\u003c/div>","textStyle":{"fontSize":1050,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_132","enterEffect":"fade","onExit":"leave","exitAt":"fr_139","exitEffect":"fade"}},{"id":"txt_136","type":"text","x":0,"y":-1500,"w":36000,"h":1400,"rotatio m .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">Gulf Stream\u003c/span>\u003c/div>","textStyle":{"fontSize":480,"fontWeight":700,"color":"#4A55A2","align":"left"},"lifecycle":{"enterAt":"fr_139","enterEffect":"fade","onExit":"leave","exitAt":"fr_139","exitEffect":"fade"}},{"id":"txt_143","type":"text","x":12600,"y":3800,"w":6000,"h":800,"rotation":0,"z":976,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">Kuroshio\u003c/span>\u003c/div>","textStyle":{"fontSize":480,"fontWeight":700,"color":"#4A55A2","align":"left"},"lifecycle":{"enterAt":"fr_139","enterEffect":"fade","onExit":"leave","exitAt":"fr_139","exitEffect":"fade"}},{"id":"txt_144","type":"text","x":1400,"y":12000,"w":6000,"h":800,"rotation":0,"z":977,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">Agulhas\u003c/span>\u003c/div>","textStyle":{"fontSize":480,"fontWeight":700,"color":"#4A55A2","align":"left"},"lifecycle":{"enterAt":"fr_139","enterEffect":"fade","onExit":"leave","exitAt":"fr_139","exitEffect":"fade"}},{"id":"txt_146","type":"text","x":13000,"y":15100,"w":22000,"h":1000,"rotation":0,"z":978,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">Antarctic Circumpolar Current: ~125 million m³/s, with no coast in the way\u003c/span>\u003c/div>","textStyle":{"fontSize":600,"fontWeight":700,"color":"#4A55A2","align":"left"},"lifecycle":{"enterAt":"fr_145","enterEffect":"fade","onExit":"leave","exitAt":"fr_145","exitEffect":"fade"}},{"id":"txt_147","type":"text","x":0,"y":-2850,"w":36000,"h":2600,"rotation":0,"z":979,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Where does the wind’s momentum \u003cspan style=\"font-weight:700;color:#4A55A2\">finally go?\u003c/span>\u003c/div>","textStyle":{"fontSize":1050,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_145","enterEffect":"fade","onExit":"leave","exitAt":"fr_145","exitEffect":"fade"}},{"id":"txt_148","type":"text","x":0,"y":-1500,"w":36000,"h":1400,"rotation":0,"z":980,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Into coasts and the sea floor. And under the current with no coast, \u003cspan style=\"font-weight:700;color:#00809A\">deep water comes up\u003c/span>. Why was it down there? \u003cspan style=\"font-weight:700;color:#4A55A2\">Next: salt.\u003c/span>\u003c/div>","textStyle":{"fontSize":620,"fontWeight":400,"color":"#5A6670","align":"left"},"lifecycle":{"enterAt":"fr_145","enterEffect":"fade","onExit":"leave","exitAt":"fr_145","exitEffect":"fade"}},{"id":"txt_150","type":"text","x":1890,"y":5777.5,"w":2025,"h":202.5,"rotation":0,"z":981,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">\u003cspan style=\"font-weight:700;color:#4A55A2\">To take home\u003c/span>\u003c/span>\u003c/div>","textStyle":{"fontSize":99,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_149","enterEffect":"fade","onExit":"leave","exitAt":"fr_153","exitEffect":"fade"}},{"id":"txt_151","type":"text","x":1890,"y":5980,"w":1845,"h":450,"rotation":0,"z":982,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">Why does the Arabian Sea \u003cspan style=\"font-weight:700;color:#00809A\">cool down\u003c/span> in the middle of summer?\u003c/span>\u003c/div>","textStyle":{"fontSize":103.5,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_149","enterEffect":"fade","onExit":"leave","exitAt":"fr_153","exitEffect":"fade"}},{"id":"txt_152","type":"text","x":1890,"y":6430,"w":1845,"h":180,"rotation":0,"z":983,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">29.9 °C in May → \u003cspan style=\"font-weight:700;color:#00809A\">26.7 °C in August\u003c/span>\u003c/span>\u003c/div>","textStyle":{"fontSize":81,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_149","enterEffect":"fade","onExit":"leave","exitAt":"fr_153","exitEffect":"fade"}},{"id":"txt_154","type":"text","x":1890,"y":6677.5,"w":1845,"h":450,"rotation":0,"z":984,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">The pieces: \u003cspan style=\"font-weight:700;color:#4A55A2\">monsoon winds\u003c/span> · a \u003cspan style=\"font-weight:700;color:#4A55A2\">deeper mixed layer\u003c/span> · \u003cspan style=\"font-weight:700;color:#00809A\">upwelling\u003c/span> off Somalia and Oman · \u003cspan style=\"font-weight:700;color:#5A6670\">clouds\u003c/span>\u003c/span>\u003c/div>","textStyle":{"fontSize":76.5,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_153","enterEffect":"fade","onExit":"leave","exitAt":"fr_153","exitEffect":"fade"}}],"frames":[{"id":"fr_3","title":"Why we are here","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"O4 · NANSEN'S ANSWER: WHAT THE WIND DOES TO A ROTATING OCEAN (Wed 11 Nov, 50 min). Opening (≈1 min, Smooth). Where we left the heat budget. The net heat flux into the ocean, 2011 (ocean reanalysis): the map from last week. The accountant and the data scientist have done their jobs: the ocean gains heat where it is cold (the cold tongue, Somalia and Oman)."},{"id":"fr_9","title":"Three hats, twice","x":-4000,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈1 min, Smooth.) O1's three hats. For the heat budget we have worn the accountant's (which budget?) and the data scientist's (what does it look like?). Today is the physicist's: why does it gain heat where it is cold? Because cold water keeps arriving from below."},{"id":"fr_12","title":"A new budget","x":-4000,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: but water can only arrive if it moves, and what moves it is a momentum budget. So the physicist's question about heat opens a new ledger, with its own three hats. Accountant: the wind's stress goes in; where does it go? Data scientist: maps of the stress, the sea height, the currents. Physicist: Coriolis and geostrophy. Labels in the corner of later slides say which hat we have on."},{"id":"fr_14","title":"Week 3: Nansen's question","x":-4000,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"cut","notes":"Beat 1 (≈2 min, Cut). Not a recap: this is where last lecture stopped.\n- Nansen, on the Fram (1893-96), saw the Arctic ice drift 20-40° to the right of the wind (Stewart §9.2). He asked Bjerknes to set a student on it; Ekman's answer came in 1905.\n- Last lecture: the wind's push alone would take ~60 days to bring a 50 m layer to wind speed. It never gets there: rotation stops it first. Today: how."},{"id":"fr_20","title":"A free-body diagram?","x":17300,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈1 min, Smooth.) The natural first move, and Nansen's own: three forces on the ice, wind W, friction F opposite its motion, Coriolis C at right angles to it, and W + F + C = 0 for steady motion (Stewart §9.2, Fig 9.2; this drawing is ours, to scale for 30°). It even gets the side right."},{"id":"fr_26","title":"Why the analogy breaks","x":17300,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: why this picture misleads (our argument). The friction on the ice comes from the water under it, and what that water is doing is the thing we don't know, so the diagram hands the problem on to the water. And the object is the wrong size: a floe is a few metres thick, on tens of metres of stirred water spread over thousands of kilometres. Most of the mass that feels Coriolis is water."},{"id":"fr_31","title":"A passive tracer","x":17300,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: so go to larger scales: a budget for the whole layer, over a region far bigger than any floe. Treat the ice as a passive tracer: a marker on the water that shows us what the top of the layer is doing.\n- Caveat if asked: ice isn't strictly passive. The wind pushes on it directly, and Nansen's diagram has that force in it; sea-ice models keep a force balance for the ice. \"Passive tracer\" is the right first picture because the turning comes from the water beneath it, not because the other forces vanish."},{"id":"fr_33","title":"Add up the whole layer","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 2 (≈12 min, Smooth). Can be done on the board instead; the slide then is a summary.\n- Start from Suhas's rotating-frame momentum equations. Steady (no acceleration), no pressure gradient (the sea surface is flat for now). What's left: Coriolis against friction. Friction here is the vertical change of the horizontal stress τ that turbulence carries down from the wind.\n- x: −f v = (1/ρ) ∂τˣ/∂z. y: f u = (1/ρ) ∂τʸ/∂z. Each thin slab of water: Coriolis on it balances the difference between the stress on its top and on its bottom.\n- Sign check: u east, v north, z up; f > 0 in the north.\n- The accountant's hat: this is a momentum budget for a box. And the box is the mixed layer from the last two lectures: the same wind that stirs it passes the stress down, and the stress dies out where the stratification stops the stirring (O3 §2). The Ekman depth of the theory and the observed mixed-layer depth are different numbers; what matters here is only that the stress is gone below the stirred water."},{"id":"fr_40","title":"Integrate over the layer","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: integrate both from below the stirred layer, where τ = 0, to the surface, where τ is the wind's stress. ∫ ∂τ/∂z dz = τ(top) − τ(bottom) = wind stress − 0.\n- M = ∫ u dz is the transport: cubic metres per second through a strip one metre wide, from the surface to below the layer (Stewart §9.3 uses the mass transport, ρ × this; same thing).\n- Only the two ends of the integral are left, and we know both."},{"id":"fr_42","title":"90 degrees to the right","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the answer. M_y = −τˣ/(ρf), M_x = τʸ/(ρf) (Stewart eq. 9.26; Hartmann §7.5.1).\n- Wind to the east (τˣ > 0): transport to the south, M_y \u003c 0. 90° to the right of the wind in the north.\n- South of the equator f \u003c 0, so it's 90° to the left."},{"id":"fr_44","title":"Only the top counts","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the punchline. We never said how turbulence carries the stress down: eddy viscosity, breaking waves, convection. The answer doesn't care. Only the stress at the top and the fact that it dies out below. That's why Ekman transport is robust while the details of the current inside the layer are not (Stewart §9.3: transports are \"much more robust\" than velocities in the layer)."},{"id":"fr_46","title":"How much water?","x":38600,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 3 (≈3 min, Smooth). The same answer as a force balance on the whole layer: two forces on it, the wind's stress along the wind and Coriolis at 90° to its motion. They can only cancel if it moves 90° to the right of the wind. Note the object: the layer, not a floe. This diagram is the budget redrawn, so it is safe where the ice's wasn't.\n- Size: τ = 0.1 N/m², ρ = 1025 kg/m³, f = 10⁻⁴ s⁻¹ (about 43°): M = 0.98 m²/s (✓). Over a 50 m layer that's ~2 cm/s."},{"id":"fr_51","title":"Measured","x":38600,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: does the ocean agree? Chereskin & Roemmich (1991), across 11°N in the Atlantic: 12.0 ± 5.5 Sv northward measured with a ship's current profiler, against 8.8 ± 1.9 Sv from the winds measured at the time using τ/(ρf), and 13.5 ± 0.3 Sv from long-term mean winds (Stewart §9.3, p. 144). Agreement within the errors."},{"id":"fr_53","title":"Ekman's spiral","x":-4000,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 4 (≈7 min, Smooth). What happens inside the layer depends on how the turbulence works. Ekman (1905) assumed the simplest thing: a constant eddy viscosity. Then the surface current is 45° to the right of the wind, and below it the current weakens exponentially and turns further right: a spiral (Stewart §9.2, Fig 9.3). Drawn from his solution; the form is in the notes, no algebra on screen.\n- Ekman depth (where the current has reversed): typically 45-300 m, more for strong winds and low latitudes (Stewart Table 9.3, from his eq. 9.16; ✓ 45-299 m). There the speed is e^−π ≈ 4% of the surface's.\n- Back to the mixed layer: the Arabian Sea's went from 20 m in April to 62 m in July (O3). The spiral's depth is set by an assumed viscosity and takes no notice of stratification, which is one more reason to trust the total and not the spiral."},{"id":"fr_58","title":"Add up the arrows","x":-4000,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: add up the arrows (the area under the spiral, as vectors): exactly 90° to the right, the same as the integral, whatever the viscosity. The spiral depends on the turbulence; the total doesn't."},{"id":"fr_61","title":"Why 20 to 40 degrees?","x":-4000,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: so why did Nansen see 20-40° and not 90°? The ice is a tracer of the very top of the layer, so it shows the surface angle, not the 90° of the whole layer. Why not exactly 45°? Real turbulence isn't a constant viscosity, and the ice isn't quite passive: the wind pushes on it directly as well (Stewart §9.2). Clean spirals are hard to see in measurements; the transport is easy to see (Stewart §9.2-9.3)."},{"id":"fr_63","title":"Spreading apart, piling up","x":17300,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 5 (≈10 min, Smooth). If the wind is the same everywhere, the transport is the same everywhere: water arrives as fast as it leaves. But the wind changes from place to place. Where more leaves than arrives, water has to come up from below; where more arrives than leaves, it has to go down. Mass conservation: Ekman pumping."},{"id":"fr_68","title":"How fast?","x":17300,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: how fast, as an order of magnitude (our sum). The stress changes by 0.1 N/m² over 1,500 km (trades to westerlies): the transport changes by 0.1/(ρf) ≈ 1 m²/s over that distance, so w ≈ 0.1/(1025 × 10⁻⁴ × 1.5 × 10⁶) ≈ 6.5 × 10⁻⁷ m/s ≈ 21 m a year (✓). In general w = curl(τ/ρf) (Stewart eq. 9.29; Hartmann eq. 7.11).\n- Tiny as a speed, but it goes on all year, every year, over whole ocean basins."},{"id":"fr_71","title":"The wind's push","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"Back to the map (Smooth). Last lecture's wind stress, 2011 mean (ocean reanalysis). Look where it changes: trades to westerlies, across the Southern Ocean's belt."},{"id":"fr_77","title":"Ekman pumping map","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: w = curl(τ/ρf) from that stress (2011 annual mean, 3.5° box smoothing; blank within 5° of the equator, where f → 0, and next to coasts).\n- Subtropical gyres: pushed down ~35 m/yr (N Pacific), ~30 (N Atlantic), ~25 (S Pacific). Subpolar N Pacific: pulled up ~15. Southern Ocean 50-62°S: pulled up ~25 (box means, ✓).\n- Not on this map: upwelling right at a coast (a wall, not a curl; Hartmann p. 219) and at the equator (masked). Next."},{"id":"fr_86","title":"At a coast","x":3060,"y":6865,"w":480,"h":270,"rotation":0,"duration":"auto","easing":"snappy","notes":"Three places, a picture each (students have read these in O3's notes; ~1 min each). Coast (Snappy into the section): the monsoon blows along the Somali coast; transport is to its right, offshore; the water is replaced from below. Same recipe off Oman, Peru (SH: to the left, still offshore) and California. The world's great fisheries."},{"id":"fr_90","title":"At the equator","x":22760,"y":7865,"w":480,"h":270,"rotation":0,"duration":"auto","easing":"snappy","notes":"Equator (Snappy): f changes sign. Under the trades the transport is to the right just north of the equator and to the left just south: away from the equator on both sides. Cold water rises: the cold tongue, which gains heat because cold water keeps arriving (O3's puzzle). This year's El Niño: weaker trades, weaker upwelling (CPC; check the November discussion, due ~12 Nov)."},{"id":"fr_94","title":"The slab gets a new term","x":38600,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈1 min, Smooth.) Back to the mixed-layer slab of the last two lectures, C dT/dt = what crosses the surface. It only stored heat; no water went anywhere. At a coast or the equator that fails: cold water from below the mixed layer keeps entering it, and the surface has to warm that water. So the slab's heat budget needs a term for water moving through it."},{"id":"fr_100","title":"The puzzle, answered","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈1 min, Smooth.) The same map we opened with. The ocean gains heat where it is cold because cold water keeps arriving: wind stress → Ekman transport → water from below the mixed layer. The physicist's answer to the heat budget's question, and it took a momentum budget to get there."},{"id":"fr_108","title":"In the subtropics","x":38600,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Subtropics (Smooth): poleward transport under the trades, equatorward under the westerlies. They meet near 30°: the water piles up and is pushed down (the orange on the pumping map). A hill of water, about a metre high."},{"id":"fr_113","title":"Water on a hill","x":59900,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈1 min, Smooth.) The physicist's hat. A hill in the sea surface means higher pressure under it than beside it, so there is a horizontal force pushing the water downhill. Ask the class what the water should do. Everything we know from pouring water says: run down, and the hill flattens."},{"id":"fr_120","title":"It turns","x":59900,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: as soon as the water moves, Coriolis acts to the right of its motion. It keeps turning until the Coriolis force exactly opposes the pressure force, which can only happen when it runs along the contours. Suhas's wind around a high, in water. (The drawing is a schematic: real adjustment overshoots and oscillates about the balance.)"},{"id":"fr_124","title":"At right angles to the push","x":59900,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the counterintuitive part, stated plainly. The water flows perpendicular to the pressure gradient that is pushing on it, with the high side on its right in the north. Pressure pushes out, Coriolis pushes in, they cancel, and the water keeps going round. Nothing flows downhill, so the hill doesn't flatten. This holds to about one part in a thousand for flows larger than about 50 km and longer than a few days (Stewart p. 152). Geostrophic: u = −(1/fρ) ∂p/∂y, v = (1/fρ) ∂p/∂x (Stewart eq. 10.7a)."},{"id":"fr_129","title":"Same form as Ekman","x":59900,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the same form as the layer's budget earlier. Ekman: Coriolis against the stress, motion at 90° to the wind. Geostrophy: Coriolis against the pressure slope, motion at 90° to the push. Surface speed = (g/f) × slope (Stewart eq. 10.10). A 1 m hill over 1,500 km: 9.8/10⁻⁴ × 1/(1.5 × 10⁶) ≈ 7 cm/s (our sum, ✓). Stewart's 1 m per 100 km, \"typical of strong currents\": ≈ 1 m/s (Fig 10.2, ✓). Steep slopes mean fast currents, which is why the fast flow is narrow."},{"id":"fr_132","title":"The hills are real","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 6 (≈4 min, Smooth; if short of time, one sentence: \"read the gyres in O3's notes\"). Sea-surface height, ocean reanalysis 2011, global mean removed. Subtropical hills ~0.9 m above the subpolar ocean (N Pacific 0.93, N Atlantic 0.94, S Pacific 1.05 m, box means, ✓). Satellite altimetry sees them (Stewart §10.3)."},{"id":"fr_139","title":"Around the hills","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: surface currents, 2011 mean, 3° box means. Around the hills, at right angles to the pressure push: clockwise in the north, anticlockwise in the south (geostrophic, as we just saw). The fast flow is on the west side: Gulf Stream, Kuroshio, Agulhas. Why the west: the change of f with latitude (Stommel 1948), one sentence only; in O3's notes."},{"id":"fr_145","title":"No coast in the way","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: where does the wind's momentum finally go? Into coasts and the sea floor. In the Southern Ocean no continent blocks the way round at Drake Passage's latitudes, so the Antarctic Circumpolar Current runs all the way round: ~125 Sv through Drake Passage (Hartmann p. 225), the strongest current there is. Its momentum reaches the sea floor over undersea ridges. That closes the momentum ledger.\n- Hook for the next lectures: the Southern Ocean was teal on the pumping map. Under the ACC, deep water comes up. Why was it down there? Salt."},{"id":"fr_149","title":"To take home: the Arabian Sea","x":1800,"y":5687.5,"w":3600,"h":2025,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 7 (≈1 min, Smooth; changed 11 Nov to pay for the geostrophy and the opening). Put the question up and leave it with them. Stop here unless there is time: the next step shows the pieces. The answer goes in the notes.\n- The question as fixed in week 2: the Arabian Sea is not coolest in summer (coldest Jan-Feb, 25.8 °C), but it cools in the middle of it. 10-20°N, 60-70°E, CERES surface temperature from upwelling LW: 29.9 °C in May, 26.7 °C in August, 28.3 °C in October (✓).\n- It is the mixed-layer slab's budget again: a deeper layer, and cold water coming in from below it."},{"id":"fr_153","title":"The pieces","x":1800,"y":5687.5,"w":3600,"h":2025,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the pieces, once the class has worked on it. Monsoon winds, the strongest of the year (O3). A mixed layer stirred deeper: 20 m in April to 62 m in July (O3). Ekman transport off Somalia and Oman: coastal upwelling (today), and offshore of the jet's axis, Ekman pumping (today; Hartmann Fig 7.9). Monsoon clouds cut the sunlight. Then in autumn the winds drop and it warms again, before winter cools it."}],"settings":{"defaultEasing":"smooth","defaultDuration":"auto"}};</script>
<script>
(function(){
  var DATA = window.__PRES__;
  var frames = DATA.frames, elements = DATA.elements.slice().sort(function(a,b){return a.z-b.z;});
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var world = document.getElementById('world');
  var progress = document.getElementById('progress');
  var index = 0, overview = false, raf = null;

  // ---- build element DOM ----
  var nodes = {};
  elements.forEach(function(el){
    var d = document.createElement('div');
    d.style.position='absolute'; d.style.left=el.x+'px'; d.style.top=el.y+'px';
    d.style.width=el.w+'px'; d.style.height=el.h+'px';
    var inner = document.createElement('div');
    inner.style.width='100%'; inner.style.height='100%';
    inner.style.transform='rotate('+el.rotation+'deg)';
    if(el.type==='text'){
      inner.innerHTML = el.content;
      var ts = el.textStyle||{};
      inner.style.fontSize=(ts.fontSize||32)+'px'; inner.style.fontWeight=(ts.fontWeight||400);
      inner.style.color=ts.color||'#000'; inner.style.textAlign=ts.align||'left';
      inner.style.display='flex'; inner.style.flexDirection='column'; inner.style.justifyContent='center';
    } else {
      var img=document.createElement('img'); img.src=el.content;
      img.style.width='100%'; img.style.height='100%'; img.style.display='block'; img.draggable=false;
      inner.appendChild(img);
    }
    d.appendChild(inner); world.appendChild(d); nodes[el.id]=d; d.style.display='none';
  });

  function vp(){ return {width: window.innerWidth, height: window.innerHeight}; }
  function frameToCam(f, v){ return {cx:f.x+f.w/2, cy:f.y+f.h/2, scale:Math.min(v.width/f.w, v.height/f.h), rotation:f.rotation}; }
  function applyCam(c){
    var v=vp();
    world.style.transform='translate('+(v.width/2)+'px,'+(v.height/2)+'px) rotate('+(-c.rotation)+'deg) scale('+c.scale+') translate('+(-c.cx)+'px,'+(-c.cy)+'px)';
  }

  // ---- van Wijk smooth zoom/pan ----
  function path(from,to,v,rho){
    rho=rho||1.4; var w0=v.width/from.scale, w1=v.width/to.scale;
    var dx=to.cx-from.cx, dy=to.cy-from.cy, u1=Math.hypot(dx,dy), rho2=rho*rho;
    var dRot=((to.rotation-from.rotation+540)%360)-180;
    if(u1<1e-6){ var S=Math.abs(Math.log(w1/w0))/rho||1e-6; return {S:S, at:function(t){var w=w0*Math.pow(w1/w0,t);return{cx:from.cx,cy:from.cy,scale:v.width/w,rotation:from.rotation+dRot*t};}};}
    var b0=(w1*w1-w0*w0+rho2*rho2*u1*u1)/(2*w0*rho2*u1);
    var b1=(w1*w1-w0*w0-rho2*rho2*u1*u1)/(2*w1*rho2*u1);
    var r0=Math.log(-b0+Math.sqrt(b0*b0+1)), r1=Math.log(-b1+Math.sqrt(b1*b1+1));
    var S=(r1-r0)/rho, ch0=Math.cosh(r0);
    return {S:Math.abs(S)||1e-6, at:function(t){var r=r0+rho*t*S; var u=(w0/(rho2*u1))*(ch0*Math.tanh(r)-Math.sinh(r0)); var w=w0*ch0/Math.cosh(r); return{cx:from.cx+dx*u,cy:from.cy+dy*u,scale:v.width/w,rotation:from.rotation+dRot*t};}};
  }
  // Proper CSS cubic-bezier easing: solve x(t)=time via Newton, then return y(t).
  // (Matches the editor's Motion easing so playback feels identical to the app.)
  function cubicBezier(x1,y1,x2,y2){
    var A=function(a,b){return 1-3*b+3*a;}, B=function(a,b){return 3*b-6*a;}, C=function(a){return 3*a;};
    var calc=function(t,a,b){return ((A(a,b)*t+B(a,b))*t+C(a))*t;};
    var slope=function(t,a,b){return 3*A(a,b)*t*t+2*B(a,b)*t+C(a);};
    return function(x){ if(x<=0)return 0; if(x>=1)return 1; var t=x;
      for(var i=0;i<6;i++){ var s=slope(t,x1,x2); if(s===0) break; t-=(calc(t,x1,x2)-x)/s; }
      return calc(t,y1,y2); };
  }
  var EASE={smooth:{e:cubicBezier(.4,0,.2,1),k:1},snappy:{e:cubicBezier(.2,.8,.2,1),k:.6},slowDrift:{e:cubicBezier(.33,0,.2,1),k:1.6},cut:{e:null,k:0}};

  var curCam = frames[0]?frameToCam(frames[0],vp()):{cx:0,cy:0,scale:1,rotation:0};
  function animateTo(target, easing, duration){
    if(raf) cancelAnimationFrame(raf);
    var v=vp(), p=path(curCam,target,v);
    var prof=EASE[easing]||EASE.smooth;
    var durMs = duration==='auto' ? Math.max(350,Math.min(2600,700*(0.4+p.S))) : duration;
    durMs *= prof.k||1;
    // will-change only while moving: left on, Chrome keeps the first raster scale and deep zooms blur.
    if(reduced||easing==='cut'||durMs<=0){ curCam=target; applyCam(target); world.style.willChange='auto'; return; }
    world.style.willChange='transform';
    var t0=performance.now();
    (function step(now){
      var t=Math.min(1,(now-t0)/durMs); var et=prof.e?prof.e(t):t;
      var c=p.at(et); applyCam(c);
      if(t<1){ raf=requestAnimationFrame(step); } else { curCam=target; world.style.willChange='auto'; }
    })(t0);
  }

  // ---- visibility (mirrors visibility.ts) ----
  function idxOf(id){ for(var i=0;i<frames.length;i++) if(frames[i].id===id) return i; return -1; }
  function visAt(el,i){
    var lc=el.lifecycle||{}; var enter = lc.enterAt? idxOf(lc.enterAt):0;
    if(i<enter) return false;
    var leave=Infinity;
    if(lc.onExit==='leave'){ var ref=lc.exitAt||lc.enterAt; var li=ref?idxOf(ref):enter; leave=li>=0?li:enter; }
    return i<=leave;
  }
  function render(i){
    elements.forEach(function(el){
      var on=visAt(el,i), node=nodes[el.id], wasOn=node.style.display!=='none';
      if(on&&!wasOn){ node.style.display=''; entrance(el,node); }
      else if(!on&&wasOn){ exit(el,node); }
    });
  }
  function entrance(el,node){
    if(reduced) return; var lc=el.lifecycle||{}; if(idxOf(lc.enterAt)!==index) return;
    var eff=lc.enterEffect;
    if(eff==='fade'){ node.animate([{opacity:0},{opacity:1}],{duration:500,easing:'ease-out'}); }
    else if(eff==='slide'){ var o=offset(lc.enterDirection); node.animate([{opacity:0,transform:'translate('+o.x+'px,'+o.y+'px)'},{opacity:1,transform:'none'}],{duration:500,easing:'ease-out'}); }
    else if(eff==='pulse'){ node.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:600}); }
  }
  function exit(el,node){
    var lc=el.lifecycle||{};
    if(reduced||lc.onExit!=='leave'||lc.exitEffect==='none'){ node.style.display='none'; return; }
    var o=lc.exitEffect==='slide'?offset(lc.enterDirection):{x:0,y:0};
    var a=node.animate([{opacity:1},{opacity:0,transform:'translate('+o.x+'px,'+o.y+'px)'}],{duration:400,easing:'ease-in'});
    a.onfinish=function(){ node.style.display='none'; };
  }
  function offset(dir){ var d=80; return dir==='right'?{x:d,y:0}:dir==='up'?{x:0,y:-d}:dir==='down'?{x:0,y:d}:{x:-d,y:0}; }

  // ---- deep links (mirrors deepLink.ts): #title-slug or #number ----
  function slugOf(t){ return String(t||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  var taken={}, hashes=frames.map(function(f,i){ var s=slugOf(f.title); if(!s||/^\d+$/.test(s)||taken[s]) return String(i+1); taken[s]=1; return s; });
  function frameFromHash(hash){
    var h=hash.replace(/^#/,''); try{ h=decodeURIComponent(h); }catch(e){ return -1; } h=h.toLowerCase();
    if(/^\d+$/.test(h)){ var n=Number(h); return n>=1&&n<=hashes.length?n-1:-1; }
    return h?hashes.indexOf(h):-1;
  }
  function setHash(i){ try{ history.replaceState(null,'','#'+hashes[i]); }catch(e){} }

  function go(i){
    i=Math.max(0,Math.min(frames.length-1,i)); var f=frames[i]; if(!f) return;
    overview=false; index=i; render(i); setHash(i);
    animateTo(frameToCam(f,vp()), f.easing, f.duration);
    if(progress) progress.style.width=((i+1)/frames.length*100)+'%';
  }
  function bounds(){
    if(!elements.length) return {x:-640,y:-360,w:1280,h:720,rotation:0};
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    elements.forEach(function(e){x0=Math.min(x0,e.x);y0=Math.min(y0,e.y);x1=Math.max(x1,e.x+e.w);y1=Math.max(y1,e.y+e.h);});
    var px=(x1-x0)*0.1, py=(y1-y0)*0.1; return {x:x0-px,y:y0-py,w:(x1-x0)+2*px,h:(y1-y0)+2*py,rotation:0};
  }
  function toggleOverview(){ if(overview){ go(index); } else { overview=true; animateTo(frameToCam(bounds(),vp()),'smooth','auto'); } }

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); overview?go(index):go(index+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); overview?go(index):go(index-1); }
    else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(frames.length-1); }
    else if(e.key==='o'||e.key==='O'){ toggleOverview(); }
  });
  stage.addEventListener('click',function(){ overview?go(index):go(index+1); });
  window.addEventListener('resize',function(){ applyCam(curCam); });
  window.addEventListener('hashchange',function(){ var i=frameFromHash(location.hash); if(i>=0&&(i!==index||overview)) go(i); });

  if(frames.length){
    index=Math.max(0,frameFromHash(location.hash)); curCam=frameToCam(frames[index],vp());
    render(index); applyCam(curCam); if(progress) progress.style.width=((index+1)/frames.length*100)+'%';
  }
})();</script>
</body>
</html>
