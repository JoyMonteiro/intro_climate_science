in over warm tropical sea releases its latent heat: \u003cspan style=\"font-weight:700;color:#C9531A\">5 m of rain a year ≈ 400 W/m²\u003c/span>, more than the sunlight the surface absorbs. The tropical ocean is \u003cspan style=\"font-weight:700;color:#C9531A\">the engine of the atmosphere’s circulation\u003c/span>.\u003c/div>","textStyle":{"fontSize":475,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_38","enterEffect":"fade","onExit":"leave","exitAt":"fr_38","exitEffect":"fade"}},{"id":"txt_41","type":"text","x":60650,"y":30625,"w":18500,"h":2750,"rotation":0,"z":926,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">And the tropical ocean is a \u003cspan style=\"font-weight:700;color:#00809A\">thin warm layer over cold water\u003c/span>. Where the trades pull water up (O4), cold water is \u003cspan style=\"font-weight:700;color:#00809A\">close to the surface\u003c/span>: a small change in the wind is a big change in sea temperature.\u003c/div>","textStyle":{"fontSize":475,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_38","enterEffect":"fade","onExit":"leave","exitAt":"fr_38","exitEffect":"fade"}},{"id":"txt_42","type":"text","x":60650,"y":34500,"w":18500,"h":1375,"rotation":0,"z":927,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Equatorial processes “dominate the interannual fluctuations in global weather patterns.” Stewart (2008), pp. 235–236\u003c/div>","textStyle":{"fontSize":350,"fontWeight":400,"color":"#5A6670","align":"left"},"lifecycle":{"enterAt":"fr_38","enterEffect":"fade","onExit":"leave","exitAt":"fr_38","exitEffect":"fade"}},{"id":"img_44","type":"svg","x":-3875,"y":38625,"w":12500,"h":5125,"rotation":0,"z":506,"content":"assets/xsec_normal.svg","lifecycle":{"enterAt":"fr_43","enterEffect":"fade","onExit":"leave","exitAt":"fr_47","exitEffect":"fade"}},{"id":"txt_45","type":"text","x":9000,"y":39125,"w":6625,"h":1125,"rotation":0,"z":928,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">How \u003cspan style=\"font-weight:700;color:#C9531A\">El Niño\u003c/span> works\u003c/div>","textStyle":{"fontSize":600,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_43","enterEffect":"fade","onExit":"leave","exitAt":"fr_53","exitEffect":"fade"}},{"id":"txt_46","type":"text","x":9000,"y":40500,"w":6625,"h":2500,"rotation":0,"z":929,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">Normal: the trades \u003cspan style=\"font-weight:700;color:#C9531A\">pile warm water west\u003c/span> and pull \u003cspan style=\"font-weight:700;color:#00809A\">cold water up\u003c/span> in the east.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_43","enterEffect":"fade","onExit":"leave","exitAt":"fr_47","exitEffect":"fade"}},{"id":"img_48","type":"svg","x":-3875,"y":44000,"w":12500,"h":5125,"rotation":0,"z":507,"content":"assets/xsec_nino.svg","lifecycle":{"enterAt":"fr_47","enterEffect":"fade","onExit":"leave","exitAt":"fr_47","exitEffect":"fade"}},{"id":"txt_49","type":"text","x":9000,"y":43375,"w":6625,"h":2500,"rotation":0,"z":930,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">El Niño: the trades \u003cspan style=\"font-weight:700;color:#4A55A2\">weaken\u003c/span>, warm water \u003cspan style=\"font-weight:700;color:#C9531A\">spreads east\u003c/span>, the rain follows it.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_47","enterEffect":"fade","onExit":"leave","exitAt":"fr_47","exitEffect":"fade"}},{"id":"img_51","type":"svg","x":-3875,"y":38625,"w":12500,"h":10750,"rotation":0,"z":508,"content":"assets/bj_loop.svg","lifecycle":{"enterAt":"fr_50","enterEffect":"fade","onExit":"leave","exitAt":"fr_53","exitEffect":"fade"}},{"id":"txt_52","type":"text","x":9000,"y":40500,"w":6625,"h":3125,"rotation":0,"z":931,"content":"\u003cdiv style=\"flex:1 1 e-height:1.32;\">The wind change sends a \u003cspan style=\"font-weight:700;color:#C9531A\">Kelvin wave east\u003c/span>. The east warms.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_55","enterEffect":"fade","onExit":"leave","exitAt":"fr_63","exitEffect":"fade"}},{"id":"img_61","type":"svg","x":38725,"y":38625,"w":12500,"h":10750,"rotation":0,"z":511,"content":"assets/do_2.svg","lifecycle":{"enterAt":"fr_60","enterEffect":"fade","onExit":"leave","exitAt":"fr_63","exitEffect":"fade"}},{"id":"txt_62","type":"text","x":51600,"y":42875,"w":6625,"h":2125,"rotation":0,"z":935,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">It also sends \u003cspan style=\"font-weight:700;color:#00809A\">Rossby waves west\u003c/span>. They make the warm layer \u003cspan style=\"font-weight:700;color:#00809A\">thinner\u003c/span>.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_60","enterEffect":"fade","onExit":"leave","exitAt":"fr_63","exitEffect":"fade"}},{"id":"img_64","type":"svg","x":38725,"y":38625,"w":12500,"h":10750,"rotation":0,"z":512,"content":"assets/do_3.svg","lifecycle":{"enterAt":"fr_63","enterEffect":"fade","onExit":"leave","exitAt":"fr_63","exitEffect":"fade"}},{"id":"txt_65","type":"text","x":51600,"y":45000,"w":6625,"h":2500,"rotation":0,"z":936,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">They \u003cspan style=\"font-weight:700;color:#1C252D\">bounce off Asia\u003c/span> and come back east, and \u003cspan style=\"font-weight:700;color:#00809A\">cool\u003c/span> it again: about \u003cspan style=\"font-weight:700;color:#1C252D\">six months later\u003c/span>.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_63","enterEffect":"fade","onExit":"leave","exitAt":"fr_63","exitEffect":"fade"}},{"id":"img_67","type":"svg","x":38725,"y":38625,"w":12500,"h":10750,"rotation":0,"z":513,"content":"assets/bj_loop.svg","lifecycle":{"enterAt":"fr_66","enterEffect":"fade","onExit":"leave","exitAt":"fr_66","exitEffect":"fade"}},{"id":"txt_68","type":"text","x":51600,"y":40500,"w":6625,"h":3750,"rotation":0,"z":937,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">A \u003cspan style=\"font-weight:700;color:#C9531A\">fast loop\u003c/span> that feeds itself, plus a \u003cspan style=\"font-weight:700;color:#00809A\">slow loop\u003c/span> that undoes it: \u003cspan style=\"font-weight:700;color:#1C252D\">a swing of its own\u003c/span>. Stommel’s boxes (O6): two loops, \u003cspan style=\"font-weight:700;color:#1C252D\">a switch\u003c/span>.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_66","enterEffect":"fade","onExit":"leave","exitAt":"fr_66","exitEffect":"fade"}},{"id":"txt_70","type":"text","x":60650,"y":38750,"w":18500,"h":1000,"rotation":0,"z":938,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">A swing, but \u003cspan style=\"font-weight:700;color:#C9531A\">not a clock\u003c/span>: every \u003cspan style=\"font-weight:700;color:#C9531A\">2 to 7 years\u003c/span>\u003c/div>","textStyle":{"fontSize":575,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_69","enterEffect":"fade","onExit":"leave","exitAt":"fr_73","exitEffect":"fade"}},{"id":"img_71","type":"svg","x":60650,"y":40875,"w":18500,"h":8125,"rotation":0,"z":514,"content":"assets/oni.svg","lifecycle":{"enterAt":"fr_69","enterEffect":"fade","onExit":"leave","exitAt":"fr_73","exitEffect":"fade"}},{"id":"txt_72","type":"text","x":60650,"y":39725,"w":18500,"h":1250,"rotation":0,"z":939,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">“El Niño comes back at intervals from 2–7 years, with an average near four years.” (Stewart p. 246)\u003c/div>","textStyle":{"fontSize":350,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_69","enterEffect":"fade","onExit":"leave","exitAt":"fr_69","exitEffect":"fade"}},{"id":"txt_74","type":"text","x":60650,"y":39725,"w":18500,"h":1250,"rotation":0,"z":940,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"font-weight:700;color:#C9531A\">Now:\u003c/span> the dot on the right. The ocean’s memory lets NOAA forecast it, from November, to \u003cspan style=\"font-weight:700;color:#4A55A2\">last into March 2027\u003c/span>.\u003c/div>","textStyle":{"fontSize":375,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_73","enterEffect":"fade","onExit":"leave","exitAt":"fr_73","exitEffect":"fade"}},{"id":"txt_76","type":"text","x":2500,"y":4700,"w":7200,"h":1100,"rotation":0,"z":941,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">Close to home: El Niño years tend to be \u003cspan style=\"font-weight:700;color:#C9531A\">dry in India\u003c/span>, but \u003cspan style=\"font-weight:700;color:#1C252D\">not always\u003c/span>.\u003c/span>\u003c/div>","textStyle":{"fontSize":260,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_75","enterEffect":"fade","onExit":"leave","exitAt":"fr_75","exitEffect":"fade"}},{"id":"txt_77","type":"text","x":2500,"y":7900,"w":7200,"h":900,"rotation":0,"z":942,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">The Indian Ocean has a see-saw of its own: the \u003cspan style=\"font-weight:700;color:#00809A\">Indian Ocean Dipole\u003c/span>.\u003c/span>\u003c/div>","textStyle":{"fontSize":210,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_75","enterEffect":"fade","onExit":"leave","exitAt":"fr_75","exitEffect":"fade"}},{"id":"txt_79","type":"text","x":18050,"y":38750,"w":18500,"h":1000,"rotation":0,"z":943,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Part 2 · The ocean \u003cspan style=\"font-weight:700;color:#00809A\">remembers carbon\u003c/span>\u003c/div>","textStyle":{"fontSize":575,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_78","enterEffect":"fade","onExit":"leave","exitAt":"fr_81","exitEffect":"fade"}},{"id":"img_80","type":"svg","x":18050,"y":40250,"w":18500,"h":8125,"rotation":0,"z":515,"content":"assets/c_budget.svg","lifecycle":{"enterAt":"fr_78","enterEffect":"fade","onExit":"leave","exitAt":"fr_81","exitEffect":"fade"}},{"id":"txt_82","type":"text","x":18050,"y":46375,"w":18500,"h":1750,"rotation":0,"z":944,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">The ocean holds \u003cspan style=\"font-weight:700;color:#00809A\">about 50 times\u003c/span> the air’s carbon. Why has it taken \u003cspan style=\"font-weight:700;color:#C9531A\">only a quarter\u003c/span> of ours? And if we stopped today, \u003cspan style=\"font-weight:700;color:#1C252D\">would CO₂ go back to 280 ppm?\u003c/span> How long would it take?\u003c/div>","textStyle":{"fontSize":425,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_81","enterEffect":"fade","onExit":"leave","exitAt":"fr_81","exitEffect":"fade"}},{"id":"txt_84","type":"text","x":39350,"y":51750,"w":18500,"h":1000,"rotation":0,"z":945,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">The smallest model: \u003cspan style=\"font-weight:700;color:#00809A\">three boxes\u003c/span>\u003c/div>","textStyle":{"fontSize":575,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_83","enterEffect":"fade","onExit":"leave","exitAt":"fr_86","exitEffect":"fade"}},{"id":"img_85","type":"svg","x":39350,"y":53000,"w":18500,"h":8125,"rotation":0,"z":516,"content":"assets/c_boxes.svg","lifecycle":{"enterAt":"fr_83","enterEffect":"fade","onExit":"leave","exitAt":"fr_86","exitEffect":"fade"}},{"id":"txt_87","type":"text","x":39350,"y":55125,"w":5000,"h":6000,"rotation":0,"z":946,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.4;\">\u003cspan style=\"font-weight:700;color:#C9531A\">The catch: chemistry\u003c/span>\u003cbr>\u003cspan style=\"font-weight:700;color:#1C252D\">CO₂ + H₂O ⇌ HCO₃⁻ + H⁺\u003c/span>\u003cbr>\u003cspan style=\"font-weight:700;color:#1C252D\">⇌ CO₃²⁻ + 2H⁺\u003c/span>\u003cbr>Most of the ocean’s carbon is \u003cspan style=\"font-weight:700;color:#00809A\">ions\u003c/span>, not gas: that’s why it holds so much. But CO₂ is an acid. \u003cspan style=\"font-weight:700;color:#C9531A\">The more the ocean takes, the less it can take.\u003c/span>\u003c/div>","textStyle":{"fontSize":337.5,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_86","enterEffect":"fade","onExit":"leave","exitAt":"fr_86","exitEffect":"fade"}},{"id":"txt_89","type":"text","x":60650,"y":51750,"w":18500,"h":1000,"rotation":0,"z":947,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Test it on the past: \u003cspan style=\"font-weight:700;color:#C9531A\">it fails\u003c/span>, then \u003cspan style=\"font-weight:700;color:#4A55A2\">revise\u003c/span>\u003c/div>","textStyle":{"fontSize":575,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_88","enterEffect":"fade","onExit":"leave","exitAt":"fr_91","exitEffect":"fade"}},{"id":"img_90","type":"svg","x":60650,"y":53250,"w":18500,"h":8125,"rotation":0,"z":517,"content":"assets/c_hist.svg","lifecycle":{"enterAt":"fr_88","enterEffect":"fade","onExit":"leave","exitAt":"fr_91","exitEffect":"fade"}},{"id":"txt_92","type":"text","x":60650,"y":61375,"w":18500,"h":1125,"rotation":0,"z":948,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">One deep box must be both the \u003cspan style=\"font-weight:700;color:#00809A\">thermocline\u003c/span> (decades, O4) and the \u003cspan style=\"font-weight:700;color:#4A55A2\">abyss\u003c/span> (1,000 years, O6). It can’t be both.\u003c/div>","textStyle":{"fontSize":375,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_91","enterEffect":"fade","onExit":"leave","exitAt":"fr_91","exitEffect":"fade"}},{"id":"txt_94","type":"text","x":-3250,"y":64750,"w":18500,"h":1000,"rotation":0,"z":949,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">If we stopped today: CO₂ falls, but \u003cspan style=\"font-weight:700;color:#4A55A2\">settles at 334 ppm\u003c/span>, not 280\u003c/div>","textStyle":{"fontSize":575,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_93","enterEffect":"fade","onExit":"leave","exitAt":"fr_93","exitEffect":"fade"}},{"id":"img_95","type":"svg","x":-3250,"y":66250,"w":18500,"h":8125,"rotation":0,"z":518,"content":"assets/c_stop.svg","lifecycle":{"enterAt":"fr_93","enterEffect":"fade","onExit":"leave","exitAt":"fr_93","exitEffect":"fade"}},{"id":"txt_96","type":"text","x":-3250,"y":65625,"w":18500,"h":750,"rotation":0,"z":950,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"font-weight:700;color:#4A55A2\">22%\u003c/span> of the carbon we have added stays in the air once the whole ocean has caught up: \u003cspan style=\"font-weight:700;color:#00809A\">centuries\u003c/span>.\u003c/div>","textStyle":{"fontSize":375,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_93","enterEffect":"fade","onExit":"leave","exitAt":"fr_93","exitEffect":"fade"}},{"id":"txt_98","type":"text","x":18050,"y":64750,"w":18500,"h":1000,"rotation":0,"z":951,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">The bigger the pulse, \u003cspan style=\"font-weight:700;color:#C9531A\">the bigger the share that stays\u003c/span>\u003c/div>","textStyle":{"fontSize":575,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_97","enterEffect":"fade","onExit":"leave","exitAt":"fr_97","exitEffect":"fade"}},{"id":"img_99","type":"svg","x":18050,"y":66250,"w":18500,"h":8125,"rotation":0,"z":519,"content":"assets/c_pulse.svg","lifecycle":{"enterAt":"fr_97","enterEffect":"fade","onExit":"leave","exitAt":"fr_97","exitEffect":"fade"}},{"id":"txt_100","type":"text","x":18050,"y":65625,"w":18500,"h":750,"rotation":0,"z":952,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Share of a pulse still in the air. \u003cspan style=\"font-weight:700;color:#5A6670\">If the ocean never turned more acidic\u003c/span> (dashed), it would take almost all of it.\u003c/div>","textStyle":{"fontSize":375,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_97","enterEffect":"fade","onExit":"leave","exitAt":"fr_97","exitEffect":"fade"}},{"id":"txt_102","type":"text","x":39350,"y":64750,"w":18500,"h":1000,"rotation":0,"z":953,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">After the ocean: \u003cspan style=\"font-weight:700;color:#1C252D\">the sea floor, then the rocks\u003c/span>\u003c/div>","textStyle":{"fontSize":575,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_101","enterEffect":"fade","onExit":"leave","exitAt":"fr_101","exitEffect":"fade"}},{"id":"txt_103","type":"text","x":39350,"y":66250,"w":18500,"h":4500,"rotation":0,"z":954,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.5;\">\u003cspan style=\"font-weight:700;color:#00809A\">2 to 20 centuries:\u003c/span> the ocean takes most of it; \u003cspan style=\"font-weight:700;color:#C9531A\">20–35%\u003c/span> stays in the air.\u003cbr>\u003cspan style=\"font-weight:700;color:#4A55A2\">3,000 to 7,000 years:\u003c/span> acid water dissolves carbonate on the sea floor, and the ocean can take more.\u003cbr>\u003cspan style=\"font-weight:700;color:#1C252D\">Hundreds of thousands of years:\u003c/span> the weathering of rocks takes the rest.\u003c/div>","textStyle":{"fontSize":475,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_101","enterEffect":"fade","onExit":"leave","exitAt":"fr_101","exitEffect":"fade"}},{"id":"txt_104","type":"text","x":39350,"y":70875,"w":18500,"h":625,"rotation":0,"z":955,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Archer et al. (2009)\u003c/div>","textStyle":{"fontSize":325,"fontWeight":400,"color":"#5A6670","align":"left"},"lifecycle":{"enterAt":"fr_101","enterEffect":"fade","onExit":"leave","exitAt":"fr_101","exitEffect":"fade"}},{"id":"txt_105","type":"text","x":39350,"y":72375,"w":18500,"h":2000,"rotation":0,"z":956,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"font-weight:700;color:#00809A\">Try it:\u003c/span> the three-box model is on the course site, under Tutorials: \u003cspan style=\"font-weight:700;color:#00809A\">Three Boxes of Carbon\u003c/span>.\u003cbr>\u003cspan style=\"color:#5A6670\">joymonteiro.github.io/intro_climate_science/tutorials/carbon-boxes\u003c/span>\u003c/div>","textStyle":{"fontSize":450,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_101","enterEffect":"fade","onExit":"leave","exitAt":"fr_101","exitEffect":"fade"}},{"id":"txt_107","type":"text","x":18300,"y":52000,"w":18000,"h":2000,"rotation":0,"z":957,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">The same slowness, \u003cspan style=\"font-weight:700;color:#C9531A\">the other way round\u003c/span>\u003c/div>","textStyle":{"fontSize":650,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_106","enterEffect":"fade","onExit":"leave","exitAt":"fr_106","exitEffect":"fade"}},{"id":"img_108","type":"svg","x":18050,"y":53875,"w":18500,"h":6529.41,"rotation":0,"z":520,"content":"assets/ruler_axis.svg","lifecycle":{"enterAt":"fr_106","enterEffect":"fade","onExit":"leave","exitAt":"fr_106","exitEffect":"fade"}},{"id":"img_109","type":"svg","x":18050,"y":53875,"w":18500,"h":6529.41,"rotation":0,"z":521,"content":"assets/ruler_tau_w2.svg","lifecycle":{"enterAt":"fr_106","enterEffect":"fade","onExit":"leave","exitAt":"fr_106","exitEffect":"fade"}},{"id":"img_110","type":"svg","x":18050,"y":53875,"w":18500,"h":6529.41,"rotation":0,"z":522,"content":"assets/ruler_turn.svg","lifecycle":{"enterAt":"fr_106","enterEffect":"fade","onExit":"leave","exitAt":"fr_106","exitEffect":"fade"}},{"id":"txt_111","type":"text","x":18300,"y":60750,"w":18000,"h":1625,"rotation":0,"z":958,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">The memory that makes El Niño forecastable also keeps our carbon in the air for \u003cspan style=\"font-weight:700;color:#C9531A\">millennia\u003c/span>, and \u003cspan style=\"font-weight:700;color:#C9531A\">warming and sea-level rise going for centuries\u003c/span> after emissions stop.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_106","enterEffect":"fade","onExit":"leave","exitAt":"fr_106","exitEffect":"fade"}},{"id":"img_113","type":"svg","x":13300,"y":4400,"w":8400,"h":2467.13,"rotation":0,"z":523,"content":"assets/card.svg","lifecycle":{"enterAt":"fr_112","enterEffect":"fade","onExit":"leave","exitAt":"fr_112","exitEffect":"fade"}},{"id":"img_114","type":"svg","x":13300,"y":4400,"w":8400,"h":2467.13,"rotation":0,"z":524,"content":"assets/card_o7.svg","lifecycle":{"enterAt":"fr_112","enterEffect":"fade","onExit":"leave","exitAt":"fr_112","exitEffect":"fade"}},{"id":"img_116","type":"svg","x":-1767483.87,"y":-1213280,"w":5200000,"h":2700000,"rotation":0,"z":1,"content":"assets/space_backdrop.svg","lifecycle":{"enterAt":"fr_115","enterEffect":"fade","onExit":"persist"}},{"id":"img_117","type":"svg","x":10500,"y":500,"w":15000,"h":15000,"rotation":0,"z":151,"content":"assets/globe.svg","lifecycle":{"enterAt":"fr_115","enterEffect":"fade","onExit":"persist"}},{"id":"img_119","type":"svg","x":-567483.87,"y":-313280,"w":1600000,"h":900000,"rotation":0,"z":101,"content":"assets/space.svg","lifecycle":{"enterAt":"fr_118","enterEffect":"fade","onExit":"persist"}},{"id":"out_120","type":"svg","x":-417483.87,"y":-261280,"w":559000,"h":83000,"rotation":0,"z":959,"content":"assets/t_2b3a18b91aec.svg","lifecycle":{"enterAt":"fr_118","enterEffect":"fade","onExit":"persist"}},{"id":"out_121","type":"svg","x":-415483.87,"y":-163280,"w":1250000,"h":34000,"rotation":0,"z":960,"content":"assets/t_7c78b86a62eb.svg","lifecycle":{"enterAt":"fr_118","enterEffect":"fade","onExit":"persist"}}],"frames":[{"id":"fr_3","title":"Is there an El Niño?","x":-4000,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"cut","notes":"O7 · SLOW SWINGS, AND THE OCEAN'S MEMORY FOR CARBON (Wed 18 Nov, 50 min, the module's last lecture; plan v3). Part 1 (≈22 min): where slow climate swings come from, with the tropical Pacific as the case. Part 2 (≈22 min): how long our CO₂ stays, with a three-box model. Beat 1 (≈3 min, Cut). Ask: is there an El Niño right now, and how would we know? Take two answers; leave the \"how\" open. The next frame is this week's sea-surface temperature anomaly map (no need to open Climate Reanalyzer live; it shows the same thing if you want today's)."},{"id":"fr_7","title":"Yes, a strong one","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"(Smooth.) Yes. The map: NOAA OISST v2.1, the week of 8-14 Nov 2026 (preliminary data), against the 1991-2020 average for the same week (CPC's base), via NOAA CoastWatch ERDDAP, downloaded 17 Nov. Box means from the map: Niño-3.4 +3.1 °C, Niño-3 +4.2, Niño-1+2 (off Ecuador and Peru) +5.4; CPC's weekly table for the same week: +3.2, +4.3, +5.4 (✓ within 0.1). The whole globe, so they see the Pacific in context: point at the warm tongue along the equator, warmest at the South American coast, and the cooler water in the far west Pacific; then note that much of the rest of the tropical ocean is warm too (20°S-20°N mean +1.3 °C), which is why CPC now uses a relative index (below).\n- NOAA CPC's ENSO discussion of 12 Nov 2026: El Niño Advisory; subsurface anomalies above +10 °C at depth in the east; westerly wind anomalies; rain shifted to the central and east Pacific, suppressed over Indonesia; both Southern Oscillation indices negative. \"Strong-to-very strong El Niño likely through January-March 2027 (remaining greater than a 79% chance)\"; ~60% chance of a record event by their relative index (✓ against the discussion, 17 Nov). Next discussion 10 Dec.\n- If asked why CPC's discussion says Niño-3.4 +2.5 °C and the map says +3.1: CPC now quotes *relative* indices, the box's anomaly minus the anomaly of the whole tropics, so that a warming ocean doesn't look like a permanent El Niño. The +2.5 is October's relative value (plain October anomaly: +3.25). The whole tropics (20°S-20°N) this week: +1.3 °C. The RONI slide later uses the relative index.\n- The question for part 1: how can anyone say in November what the Pacific will do in March? Where do slow swings like this come from?"},{"id":"fr_17","title":"The whole planet feels it","x":-4000,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈1-2 min, Smooth.) Why a strong El Niño matters beyond the Pacific. The figure is Fig. 2 of Monteiro (2024), \"The year 2023 may afford us a peek at a warmer world\", Communications Earth & Environment 5, 280 (CC BY 4.0), unchanged. Its caption: monthly anomalies of (a) total atmospheric thermal energy (enthalpy, J/m²) and (b) 2 m temperature, against 1980-2023, ERA5; the dashed red line is the 5-year running mean; shading is the Oceanic Niño Index, red El Niño-like, blue La Niña-like.\n- Point at the spikes after the big El Niños: 1997-98, 2009-10, 2015-16 and 2023. The whole atmosphere gains heat from the tropical Pacific, then loses it again. The caption: \"A new, higher level appears to have been reached after the 2015 El Niño.\"\n- 2023: the El Niño came on top of the warming trend, and the year was exceptional in warmth (the paper's Fig. 3: by season it fell within the envelope of earlier strong El Niños in spring, exceeded them in summer and autumn, and came back in winter).\n- The shading uses the plain ONI, as CPC did until its 2025 change; the opener map's +3.1 °C is also a plain anomaly.\n- Bridge: swings on top of a trend. Part 1: where the swings come from. Part 2: why the trend stays."},{"id":"fr_26","title":"Where slow swings come from","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 2 (≈3 min, Smooth; hold Cut). Part 1's question: weather can't be forecast beyond about two weeks, yet climate swings from year to year and decade to decade, and some can be forecast months ahead. Where does that slowness come from? Stewart p. 212 (§13.2): \"The ocean may be the primary cause of variability over times ranging from years to decades\" (✓ verbatim). Two ways, both from this module: (1) a slow ocean adds up fast weather into slow swings (O3, Hasselmann's idea; the Daisyworld-with-an-ocean tutorial); (2) ocean and atmosphere drive each other in a loop, which can make an oscillation: today's case, the tropical Pacific. Don't re-teach Hasselmann."},{"id":"fr_31","title":"Two ways","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the second way, today's: a loop between ocean and atmosphere. Then the ruler."},{"id":"fr_33","title":"The ocean remembers","x":38600,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 3 (≈3 min, Smooth). Week 2's ruler: τ = C/λ. The air's thermal memory is about a month by this measure; weather itself can't be forecast beyond about two weeks. A 50 m mixed layer: ~1.7 years. So a warm anomaly in the sea lasts months: the ocean is where climate's memory lives, and memory is what makes a forecast beyond two weeks possible. Part 2 will use the same ruler for carbon."},{"id":"fr_38","title":"Why the tropics","x":59900,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 4 (≈3 min, Smooth). Stewart Ch. 14, p. 235: \"Equatorial processes are at the center of our understanding the influence of the ocean on the atmosphere, and they dominate the interannual fluctuations in global weather patterns.\" Rain over the warm tropical ocean releases so much heat that these areas are \"the primary engine driving the atmospheric circulation\"; \"five meters of rain per year releases on average 400 W/m² of heat to the atmosphere\" (✓ verbatim). O1's sum: 5 m/yr × 1,000 kg/m³ × 2.5 MJ/kg ÷ 3.15 × 10⁷ s ≈ 400 W/m², more than the sunlight absorbed at the surface. §14.1, p. 236: a thin, permanent warm layer over cold water; warmest in the west (the warm pool); the trades drive Ekman divergence and upwelling on the equator (O4); in the east the thermocline is so shallow that the upwelled water is cold: the cold tongue. The east-west contrast drives the Walker circulation, \"which, in turn, influences the gradient\" (p. 236): the loop."},{"id":"fr_43","title":"The normal state","x":-4000,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 5 (≈6 min, Smooth; holds Cut). Normal state (Hartmann pp. 246-247, Fig. 8.9-8.10; Stewart pp. 236, 240): strong trades pile warm water in the west (the warm pool, deep thermocline) and pull cold water up in the east (the cold tongue, shallow thermocline). Rain sits over the warm pool. Schematic, our drawing after Hartmann Fig. 8.10."},{"id":"fr_47","title":"El Niño","x":-4000,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: El Niño. The trades weaken (westerly bursts in the west), the warm water spreads east, the thermocline flattens and deepens in the east, rain moves to the central and east Pacific (Hartmann p. 249)."},{"id":"fr_50","title":"The Bjerknes feedback","x":-4000,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the loop (Hartmann p. 247: \"Bjerknes feedback\"; Stewart p. 236: the feedback \"can lead to an instability\"). Two ledgers they know: momentum (the trades, O3-O4) and energy (sea temperature, O2). Weaker trades → less upwelling, flatter thermocline → warmer east → smaller east-west contrast → weaker trades. A positive feedback: it feeds itself."},{"id":"fr_53","title":"The catch","x":-4000,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the catch (Zebiak et al. 2015 p. 18; Sarachik & Cane p. 237): a positive feedback explains how an event grows, not why it turns around."},{"id":"fr_55","title":"Why it turns around","x":38600,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 6 (≈4 min, Smooth; holds Cut). The delayed oscillator (Suarez & Schopf 1988; Battisti & Hirst 1989; Zebiak et al. 2015 p. 20; Stewart pp. 244-247 describe the Kelvin and Rossby waves). A westerly wind change in the central Pacific launches a Kelvin wave east, which deepens the thermocline and warms the east. Draw arrows only; the waves are named, not derived."},{"id":"fr_60","title":"Why it turns around: 2","x":38600,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: it also sends Rossby waves west, off the equator, which make the thermocline shallower."},{"id":"fr_63","title":"Why it turns around: 3","x":38600,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: they reflect off the western boundary and come back east as a Kelvin wave that shallows the eastern thermocline and reverses the warming, around six months after the initial warming in the east (Zebiak et al. p. 20). \"A sort of delayed negative feedback.\""},{"id":"fr_66","title":"Fast loop, slow loop","x":38600,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the answer to part 1's question. A fast positive loop (Bjerknes) plus a delayed negative loop (the waves, carrying the ocean's memory) gives an oscillation (Zebiak et al. p. 20: \"the positive (Bjerknes) feedback process, in conjunction with this delayed negative feedback process, can result in an ENSO oscillation like that observed\"). Compare O6: Stommel's two boxes had two loops and gave a switch."},{"id":"fr_69","title":"Every 2 to 7 years","x":59900,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 7 (≈3 min, Smooth). Data: NOAA CPC relative Oceanic Niño Index (RONI, 3-month means; CPC's index since its 2025 change), downloaded 17 Nov 2026. Peaks: 1982-83 +2.4, 1997-98 +2.3, 2015-16 +2.3 (✓ from the file). Stewart p. 246: \"El Niño comes back at intervals from 2-7 years, with an average near four years\" (✓). Not a clock: the weather's random pushes (way 1) keep it irregular. Because the ocean remembers (the waves take months), it can be forecast seasons ahead, but not perfectly: Stewart pp. 252-254, 1997-98: no model forecast the earliest onset; \"Models worked well for a few years, then failed. Failure was followed by improved models, and the cycle continued.\""},{"id":"fr_73","title":"And now","x":59900,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: and now, the dot on the right (ASO 2026, +2.0 on the relative index; CPC's relative Niño-3.4 for October was +2.5, and +2.2 in the week of 11 Nov; the opening map's plain anomaly is higher, +3.1, because it includes the warming of the whole tropics). CPC, 12 Nov: strong-to-very strong El Niño likely through January-March 2027, >79% chance. Back to the opening question: memory (the waves take months) is how they can say it in November."},{"id":"fr_75","title":"Close to home","x":1500,"y":4468.75,"w":9000,"h":5062.5,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 8 (≈2 min, Smooth). Stewart §14.3 (teleconnections, pp. 248-250): El Niño changes weather far from the Pacific. El Niño years tend to be dry in India, but not always: back to Argha's first slide (Gadgil & Gadgil 2006, monsoon deficits and food grain production). Name the Indian Ocean Dipole only; the notes carry it. Don't predict this year's impacts: CPC itself says impacts are \"higher, though not guaranteed\"."},{"id":"fr_78","title":"Where our carbon went","x":17300,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 9 (≈3 min, Smooth). Part 2: the ocean remembers carbon. Global Carbon Budget 2025 (Friedlingstein et al. 2025), historical budget, summed 1750-2024 (✓ from the file): emitted 752 GtC (fossil and cement 505, land-use change 248); air 312 (41%), ocean 210 (28%), land 190 (25%); the rest (40 GtC) is cement carbonation and the budget imbalance. Past decade (GCB 2025): ocean 29%, land 21%; ocean sink 3.4 ± 0.4 GtC/yr in 2024.\n- The puzzle: the ocean holds about 50 times the air's carbon (Stewart p. 212; O6 notes §7). So why has it taken only about a quarter? And if we stopped today, would CO₂ go back to 280 ppm, and how long would it take?"},{"id":"fr_81","title":"Two questions","x":17300,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the two questions. Take a guess from the room for each before the model."},{"id":"fr_83","title":"Three boxes","x":38600,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 10 (≈4 min, Smooth; hold Cut). The smallest model with the loop in it: \"BEAM\", Glotter et al. (2014), Climatic Change 126:319-335, App. A, from Bolin and Eriksson (1959). Three boxes (air, upper ocean = top 1/51 of the ocean ≈ 75 m, deep ocean = 50 × the volume); two exchanges (air-sea k_a = 0.2/yr, 5 years; upper-deep k_d = 0.05/yr, so the deep ocean's turnover time, the time to replace its water, is δ/k_d = 1,000 years, as in O6); and the chemistry. Equations: dM_AT/dt = E − k_a(M_AT − A·B·M_UP); dM_UP/dt = k_a(M_AT − A·B·M_UP) − k_d(M_UP − M_LO/δ); dM_LO/dt = k_d(M_UP − M_LO/δ). Each exchange wears away a difference, like Stommel's boxes. Coded in carbon_box/beam.py and in the web app."},{"id":"fr_86","title":"The catch: chemistry","x":38600,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the chemistry (Glotter et al. §4, Eq. 7-8; the Revelle factor). CO₂ + H₂O ⇌ HCO₃⁻ + H⁺ ⇌ CO₃²⁻ + 2H⁺. Only a small part of the ocean's carbon is dissolved CO₂ gas; the rest is bicarbonate and carbonate. In the model, before we started, the upper ocean held about 170 carbon atoms for each dissolved CO₂ molecule (1/B ≈ 171); by 2024 about 118. Adding CO₂ adds H⁺ (more acidic), which pushes the reactions back to the left: the more the ocean takes, the less it can take. Average versus marginal: before we started, the air held 0.83 GtC in balance for each GtC in the upper ocean, but each extra GtC there needed 12.7 GtC more in the air, about 15 times as much (the model's Revelle factor; the real ocean's is about 10). So the chemistry does two things: the ions are why the ocean holds so much, and the change in the chemistry is why it won't take all of ours. That's the answer to \"why only a quarter\", together with the slow deep ocean. Glotter et al. p. 320: \"about ten times as many CO₂ molecules are removed from the atmosphere as the corresponding increase in aqueous CO₂\" (✓)."},{"id":"fr_88","title":"Test it on the past","x":59900,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 11 (≈4 min, Smooth; hold Cut). Measure, test, revise. Drive the model with what actually went into the air and sea each year (GCB 2025: atmospheric growth + ocean sink; the model has no land) and compare with Mauna Loa. The paper's numbers (deep-ocean turnover time 1,000 years): 480 ppm in 2024 against 425 measured, and an ocean sink of 1.3 GtC/yr (2015-2024) against GCB's 3.2. (Glotter et al.'s own Table 4 shows the same: 380 ppm reached in 1994, not 2005.) Revised, turnover time 200 years: 313, 359, 422 ppm in 1959, 1994, 2024 against 316, 359, 425; sink 3.3 GtC/yr."},{"id":"fr_91","title":"Why it failed","x":59900,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: why. One deep box has to stand for both the thermocline, which takes up carbon within decades (subduction, O4's Ekman pumping into the gyres), and the abyss, which takes a thousand years (O6). A 200-year box matches today; it will be too fast for the long tail. Where the carbon finally settles doesn't depend on either exchange time: only on the chemistry and the size of the ocean."},{"id":"fr_93","title":"If we stopped today","x":-4000,"y":64375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 12 (≈3 min, Smooth). The revised model, emissions stop at the start of 2025 (total added to air and sea: 522 GtC). CO₂ falls from 424 ppm to about 359 by 2100 and settles at 334 ppm: 22% of what we added stays in the air, once the whole ocean has caught up. Not 280. In this model it is within 5 ppm of the end by about 2190; with a slower, more realistic abyss it takes longer (Archer et al. 2009: the ocean takes up most of it over 2 to 20 centuries). Where it settles doesn't depend on the exchange times. Land is left out: it would take some more at first."},{"id":"fr_97","title":"The bigger the pulse","x":17300,"y":64375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 13 (≈3 min, Smooth). Pulses into a pre-industrial world, share still in the air (log time axis). Model: 100 GtC → 20% at the end; 1,000 GtC → 24%; 5,000 GtC → 42% (after 100 years: 68, 80, 91%). Archer et al. 2009, ocean-only models: about 20% (1,000 GtC) and 35% (5,000 GtC) (✓ p. 15 of the preprint). The model is a little high at 5,000: no sea-floor carbonate, constant alkalinity. Dashed: the chemistry frozen at its pre-industrial state (the app's \"No buffer chemistry\" button): B is held fixed, so the ions still hold carbon at the pre-industrial ratio, but the ratio never falls as the ocean turns acidic. The model becomes linear and only 2% is left, at any pulse size. Say it this way, not \"without the chemistry\": with Henry's law alone (no ions, B = 1) the ocean would hold very little and take less of the pulse, not more. Pencil check (handout Run 6): once settled, the air's share = r/(r + 1 + δ), r = air carbon per GtC in the upper ocean, δ = 50. Frozen, r = 0.83: 0.83/(0.83 + 1 + 50) ≈ 1.6%. With the chemistry, for a small pulse use the marginal r = 12.7: ≈ 20%, as the model gives for 100 GtC; bigger pulses push r higher still. The chemistry is why the ocean can hold our carbon; the change in the chemistry is why it won't hold all of it. The bigger the pulse, the more acid the ocean, the bigger the share left in the air. Joos et al. 2013 (many models with land): of 100 GtC added to today's air, 25 ± 9% is still there after 1,000 years."},{"id":"fr_101","title":"After the ocean","x":38600,"y":64375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 14 (≈2 min, Smooth). Archer et al. 2009: 20-35% remains after equilibration with the ocean (2-20 centuries); \"Neutralization by CaCO3 draws the airborne fraction down further on time scales of 3-7 kyr\" (✓ abstract); the rest waits for the weathering of rocks, hundreds of thousands of years. The app is on the course site (tutorials/carbon-boxes): run it live if there's time, otherwise point to it."},{"id":"fr_106","title":"Commitment","x":17300,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 15 (≈2 min, Smooth). The same slowness, the other way round. The ocean's slowness delays warming now (τ), and the carbon stays in the air for millennia: so warming and sea-level rise go on for centuries after emissions stop (Hartmann §13.14, pp. 412-415; O6's thousand-year overturning)."},{"id":"fr_112","title":"Five ledgers","x":11250,"y":4384.38,"w":12500,"h":7031.25,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 16 (≈1 min, Smooth). O1's ledger card: this module opened energy, momentum, mass, salt and, today, carbon. All ticked. (The v2 \"ledgers under warming\" lines are in the O7 notes instead.)"},{"id":"fr_115","title":"An ocean planet","x":2666.67,"y":-625,"w":30666.67,"h":17250,"rotation":0,"duration":"auto","easing":"slowDrift","notes":"Beat 7 (≈3 min, Slow drift). Pull out: the map folds back into the globe O1 opened from. Earth as an ocean planet."},{"id":"fr_118","title":"Back where we started","x":-567483.87,"y":-313280,"w":1600000,"h":900000,"rotation":0,"duration":"auto","easing":"slowDrift","notes":"(Slow drift.) The frame O1 started from. The habitable-zone question a student asked in O2, answered with what they now know: liquid water needs the right energy budget (O1); then the ocean stores it (O2), moves it (O3-O6) and remembers it (today). End."}],"settings":{"defaultEasing":"smooth","defaultDuration":"auto"}};</script>
<script>
(function(){
  var DATA = window.__PRES__;
  var frames = DATA.frames, elements = DATA.elements.slice().sort(function(a,b){return a.z-b.z;});
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var world = document.getElementById('world');
  var progress = document.getElementById('progress');
  var index = 0, overview = false, raf = null;

  // ---- build element DOM ----
  var nodes = {};
  elements.forEach(function(el){
    var d = document.createElement('div');
    d.style.position='absolute'; d.style.left=el.x+'px'; d.style.top=el.y+'px';
    d.style.width=el.w+'px'; d.style.height=el.h+'px';
    var inner = document.createElement('div');
    inner.style.width='100%'; inner.style.height='100%';
    inner.style.transform='rotate('+el.rotation+'deg)';
    if(el.type==='text'){
      inner.innerHTML = el.content;
      var ts = el.textStyle||{};
      inner.style.fontSize=(ts.fontSize||32)+'px'; inner.style.fontWeight=(ts.fontWeight||400);
      inner.style.color=ts.color||'#000'; inner.style.textAlign=ts.align||'left';
      inner.style.display='flex'; inner.style.flexDirection='column'; inner.style.justifyContent='center';
    } else {
      var img=document.createElement('img'); img.src=el.content;
      img.style.width='100%'; img.style.height='100%'; img.style.display='block'; img.draggable=false;
      inner.appendChild(img);
    }
    d.appendChild(inner); world.appendChild(d); nodes[el.id]=d; d.style.display='none';
  });

  function vp(){ return {width: window.innerWidth, height: window.innerHeight}; }
  function frameToCam(f, v){ return {cx:f.x+f.w/2, cy:f.y+f.h/2, scale:Math.min(v.width/f.w, v.height/f.h), rotation:f.rotation}; }
  function applyCam(c){
    var v=vp();
    world.style.transform='translate('+(v.width/2)+'px,'+(v.height/2)+'px) rotate('+(-c.rotation)+'deg) scale('+c.scale+') translate('+(-c.cx)+'px,'+(-c.cy)+'px)';
  }

  // ---- van Wijk smooth zoom/pan ----
  function path(from,to,v,rho){
    rho=rho||1.4; var w0=v.width/from.scale, w1=v.width/to.scale;
    var dx=to.cx-from.cx, dy=to.cy-from.cy, u1=Math.hypot(dx,dy), rho2=rho*rho;
    var dRot=((to.rotation-from.rotation+540)%360)-180;
    if(u1<1e-6){ var S=Math.abs(Math.log(w1/w0))/rho||1e-6; return {S:S, at:function(t){var w=w0*Math.pow(w1/w0,t);return{cx:from.cx,cy:from.cy,scale:v.width/w,rotation:from.rotation+dRot*t};}};}
    var b0=(w1*w1-w0*w0+rho2*rho2*u1*u1)/(2*w0*rho2*u1);
    var b1=(w1*w1-w0*w0-rho2*rho2*u1*u1)/(2*w1*rho2*u1);
    var r0=Math.log(-b0+Math.sqrt(b0*b0+1)), r1=Math.log(-b1+Math.sqrt(b1*b1+1));
    var S=(r1-r0)/rho, ch0=Math.cosh(r0);
    return {S:Math.abs(S)||1e-6, at:function(t){var r=r0+rho*t*S; var u=(w0/(rho2*u1))*(ch0*Math.tanh(r)-Math.sinh(r0)); var w=w0*ch0/Math.cosh(r); return{cx:from.cx+dx*u,cy:from.cy+dy*u,scale:v.width/w,rotation:from.rotation+dRot*t};}};
  }
  // Proper CSS cubic-bezier easing: solve x(t)=time via Newton, then return y(t).
  // (Matches the editor's Motion easing so playback feels identical to the app.)
  function cubicBezier(x1,y1,x2,y2){
    var A=function(a,b){return 1-3*b+3*a;}, B=function(a,b){return 3*b-6*a;}, C=function(a){return 3*a;};
    var calc=function(t,a,b){return ((A(a,b)*t+B(a,b))*t+C(a))*t;};
    var slope=function(t,a,b){return 3*A(a,b)*t*t+2*B(a,b)*t+C(a);};
    return function(x){ if(x<=0)return 0; if(x>=1)return 1; var t=x;
      for(var i=0;i<6;i++){ var s=slope(t,x1,x2); if(s===0) break; t-=(calc(t,x1,x2)-x)/s; }
      return calc(t,y1,y2); };
  }
  var EASE={smooth:{e:cubicBezier(.4,0,.2,1),k:1},snappy:{e:cubicBezier(.2,.8,.2,1),k:.6},slowDrift:{e:cubicBezier(.33,0,.2,1),k:1.6},cut:{e:null,k:0}};

  var curCam = frames[0]?frameToCam(frames[0],vp()):{cx:0,cy:0,scale:1,rotation:0};
  function animateTo(target, easing, duration){
    if(raf) cancelAnimationFrame(raf);
    var v=vp(), p=path(curCam,target,v);
    var prof=EASE[easing]||EASE.smooth;
    var durMs = duration==='auto' ? Math.max(350,Math.min(2600,700*(0.4+p.S))) : duration;
    durMs *= prof.k||1;
    // will-change only while moving: left on, Chrome keeps the first raster scale and deep zooms blur.
    if(reduced||easing==='cut'||durMs<=0){ curCam=target; applyCam(target); world.style.willChange='auto'; return; }
    world.style.willChange='transform';
    var t0=performance.now();
    (function step(now){
      var t=Math.min(1,(now-t0)/durMs); var et=prof.e?prof.e(t):t;
      var c=p.at(et); applyCam(c);
      if(t<1){ raf=requestAnimationFrame(step); } else { curCam=target; world.style.willChange='auto'; }
    })(t0);
  }

  // ---- visibility (mirrors visibility.ts) ----
  function idxOf(id){ for(var i=0;i<frames.length;i++) if(frames[i].id===id) return i; return -1; }
  function visAt(el,i){
    var lc=el.lifecycle||{}; var enter = lc.enterAt? idxOf(lc.enterAt):0;
    if(i<enter) return false;
    var leave=Infinity;
    if(lc.onExit==='leave'){ var ref=lc.exitAt||lc.enterAt; var li=ref?idxOf(ref):enter; leave=li>=0?li:enter; }
    return i<=leave;
  }
  function render(i){
    elements.forEach(function(el){
      var on=visAt(el,i), node=nodes[el.id], wasOn=node.style.display!=='none';
      if(on&&!wasOn){ node.style.display=''; entrance(el,node); }
      else if(!on&&wasOn){ exit(el,node); }
    });
  }
  function entrance(el,node){
    if(reduced) return; var lc=el.lifecycle||{}; if(idxOf(lc.enterAt)!==index) return;
    var eff=lc.enterEffect;
    if(eff==='fade'){ node.animate([{opacity:0},{opacity:1}],{duration:500,easing:'ease-out'}); }
    else if(eff==='slide'){ var o=offset(lc.enterDirection); node.animate([{opacity:0,transform:'translate('+o.x+'px,'+o.y+'px)'},{opacity:1,transform:'none'}],{duration:500,easing:'ease-out'}); }
    else if(eff==='pulse'){ node.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:600}); }
  }
  function exit(el,node){
    var lc=el.lifecycle||{};
    if(reduced||lc.onExit!=='leave'||lc.exitEffect==='none'){ node.style.display='none'; return; }
    var o=lc.exitEffect==='slide'?offset(lc.enterDirection):{x:0,y:0};
    var a=node.animate([{opacity:1},{opacity:0,transform:'translate('+o.x+'px,'+o.y+'px)'}],{duration:400,easing:'ease-in'});
    a.onfinish=function(){ node.style.display='none'; };
  }
  function offset(dir){ var d=80; return dir==='right'?{x:d,y:0}:dir==='up'?{x:0,y:-d}:dir==='down'?{x:0,y:d}:{x:-d,y:0}; }

  // ---- deep links (mirrors deepLink.ts): #title-slug or #number ----
  function slugOf(t){ return String(t||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  var taken={}, hashes=frames.map(function(f,i){ var s=slugOf(f.title); if(!s||/^\d+$/.test(s)||taken[s]) return String(i+1); taken[s]=1; return s; });
  function frameFromHash(hash){
    var h=hash.replace(/^#/,''); try{ h=decodeURIComponent(h); }catch(e){ return -1; } h=h.toLowerCase();
    if(/^\d+$/.test(h)){ var n=Number(h); return n>=1&&n<=hashes.length?n-1:-1; }
    return h?hashes.indexOf(h):-1;
  }
  function setHash(i){ try{ history.replaceState(null,'','#'+hashes[i]); }catch(e){} }

  function go(i){
    i=Math.max(0,Math.min(frames.length-1,i)); var f=frames[i]; if(!f) return;
    overview=false; index=i; render(i); setHash(i);
    animateTo(frameToCam(f,vp()), f.easing, f.duration);
    if(progress) progress.style.width=((i+1)/frames.length*100)+'%';
  }
  function bounds(){
    if(!elements.length) return {x:-640,y:-360,w:1280,h:720,rotation:0};
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    elements.forEach(function(e){x0=Math.min(x0,e.x);y0=Math.min(y0,e.y);x1=Math.max(x1,e.x+e.w);y1=Math.max(y1,e.y+e.h);});
    var px=(x1-x0)*0.1, py=(y1-y0)*0.1; return {x:x0-px,y:y0-py,w:(x1-x0)+2*px,h:(y1-y0)+2*py,rotation:0};
  }
  function toggleOverview(){ if(overview){ go(index); } else { overview=true; animateTo(frameToCam(bounds(),vp()),'smooth','auto'); } }

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); overview?go(index):go(index+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); overview?go(index):go(index-1); }
    else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(frames.length-1); }
    else if(e.key==='o'||e.key==='O'){ toggleOverview(); }
  });
  stage.addEventListener('click',function(){ overview?go(index):go(index+1); });
  window.addEventListener('resize',function(){ applyCam(curCam); });
  window.addEventListener('hashchange',function(){ var i=frameFromHash(location.hash); if(i>=0&&(i!==index||overview)) go(i); });

  if(frames.length){
    index=Math.max(0,frameFromHash(location.hash)); curCam=frameToCam(frames[index],vp());
    render(index); applyCam(curCam); if(progress) progress.style.width=((index+1)/frames.length*100)+'%';
  }
})();</script>
</body>
