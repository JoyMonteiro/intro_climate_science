ecycle":{"enterAt":"fr_79","enterEffect":"fade","onExit":"persist"}},{"id":"img_83","type":"svg","x":43900,"y":0,"w":4900,"h":20400,"rotation":0,"z":506,"content":"assets/s_tr_axes.svg","lifecycle":{"enterAt":"fr_82","enterEffect":"fade","onExit":"persist"}},{"id":"img_84","type":"svg","x":43900,"y":0,"w":4900,"h":20400,"rotation":0,"z":507,"content":"assets/s_tr_total.svg","lifecycle":{"enterAt":"fr_82","enterEffect":"fade","onExit":"persist"}},{"id":"txt_85","type":"text","x":44200,"y":-1500,"w":4600,"h":1300,"rotation":0,"z":936,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Carried poleward\u003c/div>","textStyle":{"fontSize":560,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_82","enterEffect":"fade","onExit":"persist"}},{"id":"txt_86","type":"text","x":9800,"y":-2850,"w":27400,"h":2600,"rotation":0,"z":937,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Add it up: \u003cspan style=\"font-weight:700;color:#1C252D\">~5.8 PW\u003c/span> must cross 35°N\u003c/div>","textStyle":{"fontSize":1050,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_82","enterEffect":"fade","onExit":"leave","exitAt":"fr_82","exitEffect":"fade"}},{"id":"txt_87","type":"text","x":9800,"y":-1500,"w":27400,"h":1400,"rotation":0,"z":938,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">1 PW = 10¹⁵ W, about 50 times all the energy humanity uses\u003c/div>","textStyle":{"fontSize":620,"fontWeight":400,"color":"#5A6670","align":"left"},"lifecycle":{"enterAt":"fr_82","enterEffect":"fade","onExit":"leave","exitAt":"fr_82","exitEffect":"fade"}},{"id":"img_89","type":"svg","x":54043.33,"y":-3100,"w":26333.33,"h":23700,"rotation":0,"z":508,"content":"assets/sec_planet.svg","lifecycle":{"enterAt":"fr_88","enterEffect":"fade","onExit":"leave","exitAt":"fr_109","exitEffect":"fade"}},{"id":"img_90","type":"svg","x":54043.33,"y":-3100,"w":26333.33,"h":23700,"rotation":0,"z":509,"content":"assets/sec_energy.svg","lifecycle":{"enterAt":"fr_88","enterEffect":"fade","onExit":"leave","exitAt":"fr_96","exitEffect":"fade"}},{"id":"txt_91","type":"text","x":80903.33,"y":-1520,"w":13956.67,"h":4213.33,"rotation":0,"z":939,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Who carries it?\u003c/div>","textStyle":{"fontSize":1158.67,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_88","enterEffect":"fade","onExit":"leave","exitAt":"fr_96","exitEffect":"fade"}},{"id":"txt_92","type":"text","x":80903.33,"y":2166.67,"w":13956.67,"h":5266.67,"rotation":0,"z":940,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">For now, imagine Earth with \u003cspan style=\"font-weight:700;color:#1C252D\">no ocean\u003c/span>: only the air can carry energy. It carries it \u003cspan style=\"font-weight:700;color:#C9531A\">poleward\u003c/span>.\u003c/div>","textStyle":{"fontSize":763.67,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_88","enterEffect":"fade","onExit":"leave","exitAt":"fr_96","exitEffect":"fade"}},{"id":"img_94","type":"svg","x":54043.33,"y":-3100,"w":26333.33,"h":23700,"rotation":0,"z":510,"content":"assets/sec_mass.svg","lifecycle":{"enterAt":"fr_93","enterEffect":"fade","onExit":"leave","exitAt":"fr_93","exitEffect":"fade"}},{"id":"txt_95","type":"text","x":80903.33,"y":7433.33,"w":13956.67,"h":5266.67,"rotation":0,"z":941,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">But energy rides on \u003cspan style=\"font-weight:700;color:#4A55A2\">air\u003c/span>. Moving it poleward would empty the equator of air and pile it up at the poles.\u003c/div>","textStyle":{"fontSize":763.67,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_93","enterEffect":"fade","onExit":"leave","exitAt":"fr_96","exitEffect":"fade"}},{"id":"img_97","type":"svg","x":54043.33,"y":-3100,"w":26333.33,"h":23700,"rotation":0,"z":511,"content":"assets/sec_return.svg","lifecycle":{"enterAt":"fr_96","enterEffect":"fade","onExit":"leave","exitAt":"fr_96","exitEffect":"fade"}},{"id":"txt_98","type":"text","x":80903.33,"y":12700,"w":13956.67,"h":5266.67,"rotation":0,"z":942,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">So the air must come back, low down: a \u003cspan style=\"font-weight:700;color:#00809A\">return branch\u003c/span>. Energy balances, and so does \u003cspan style=\"font-weight:700;color:#4A55A2\">mass\u003c/span>.\u003c/div>","textStyle":{"fontSize":763.67,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_96","enterEffect":"fade","onExit":"leave","exitAt":"fr_96","exitEffect":"fade"}},{"id":"img_100","type":"svg","x":97650,"y":-3100,"w":27386.67,"h":23700,"rotation":0,"z":512,"content":"assets/sec_cyl.svg","lifecycle":{"enterAt":"fr_99","enterEffect":"fade","onExit":"leave","exitAt":"fr_103","exitEffect":"fade"}},{"id":"txt_101","type":"text","x":125036.67,"y":-1520,"w":13956.67,"h":4213.33,"rotation":0,"z":943,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Does it matter that Earth is round?\u003c/div>","textStyle":{"fontSize":1158.67,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_99","enterEffect":"fade","onExit":"leave","exitAt":"fr_103","exitEffect":"fade"}},{"id":"txt_102","type":"text","x":125036.67,"y":3483.33,"w":13956.67,"h":7900,"rotation":0,"z":944,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">Moving air keeps its \u003cspan style=\"font-weight:700;color:#4A55A2\">angular momentum\u003c/span>: its spin about Earth’s axis, which grows with its distance \u003cspan style=\"font-weight:700;color:#4A55A2\">r\u003c/span> from the axis. On a cylinder, going poleward keeps \u003cspan style=\"font-weight:700;color:#4A55A2\">r\u003c/span> the same: nothing changes.\u003c/div>","textStyle":{"fontSize":763.67,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_99","enterEffect":"fade","onExit":"leave","exitAt":"fr_103","exitEffect":"fade"}},{"id":"txt_104","type":"text","x":125036.67,"y":12173.33,"w":13956.67,"h":7900,"rotation":0,"z":945,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">On a sphere, going poleward brings the air \u003cspan style=\"font-weight:700;color:#4A55A2\">closer to the axis\u003c/span>. Like a skater pulling in their arms, it spins up: air at rest at the equator would blow east at \u003cspan style=\"font-weight:700;color:#1C252D\">~130 m/s\u003c/span> by 30°.\u003c/div>","textStyle":{"fontSize":763.67,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_103","enterEffect":"fade","onExit":"leave","exitAt":"fr_103","exitEffect":"fade"}},{"id":"img_106","type":"svg","x":54043.33,"y":-3100,"w":26333.33,"h":23700,"rotation":0,"z":513,"content":"assets/sec_cells.svg","lifecycle":{"enterAt":"fr_105","enterEffect":"fade","onExit":"leave","exitAt":"fr_109","exitEffect":"fade"}},{"id":"txt_107","type":"text","x":80903.33,"y":-1520,"w":13956.67,"h":4213.33,"rotation":0,"z":946,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">So one loop can’t reach the pole\u003c/div>","textStyle":{"fontSize":1158.67,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_105","enterEffect":"fade","onExit":"leave","exitAt":"fr_109","exitEffect":"fade"}},{"id":"txt_108","type":"text","x":80903.33,"y":3483.33,"w":13956.67,"h":5266.67,"rotation":0,"z":947,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">Winds that strong break up. The loop stops near 30°: the \u003cspan style=\"font-weight:700;color:#C9531A\">Hadley cell\u003c/span>. Poleward of it, swirling weather systems carry the energy on.\u003c/div>","textStyle":{"fontSize":763.67,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_105","enterEffect":"fade","onExit":"leave","exitAt":"fr_109","exitEffect":"fade"}},{"id":"txt_110","type":"text","x":80903.33,"y":10593.33,"w":13956.67,"h":8690,"rotation":0,"z":948,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">At the surface, \u003cspan style=\"font-weight:700;color:#00809A\">trade winds\u003c/span> blow from the east and \u003cspan style=\"font-weight:700;color:#4A55A2\">westerlies\u003c/span> from the west. The ground pushes back on both: momentum goes into the air in one and out in the other. \u003cspan style=\"font-weight:700;color:#4A55A2\">Momentum\u003c/span> balances too.\u003c/div>","textStyle":{"fontSize":763.67,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_109","enterEffect":"fade","onExit":"leave","exitAt":"fr_109","exitEffect":"fade"}},{"id":"out_112","type":"svg","x":1382516.13,"y":486720,"w":1300000,"h":60000,"rotation":0,"z":949,"content":"assets/t_8471bb1115de.svg","lifecycle":{"enterAt":"fr_111","enterEffect":"fade","onExit":"leave","exitAt":"fr_111","exitEffect":"fade"}},{"id":"out_114","type":"svg","x":1382516.13,"y":486720,"w":1300000,"h":39000,"rotation":0,"z":950,"content":"assets/t_ab85a9a74575.svg","lifecycle":{"enterAt":"fr_113","enterEffect":"fade","onExit":"leave","exitAt":"fr_113","exitEffect":"fade"}},{"id":"txt_116","type":"text","x":18300,"y":26000,"w":18000,"h":2000,"rotation":0,"z":951,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">So why do we need the \u003cspan style=\"font-weight:700;color:#00809A\">ocean\u003c/span>?\u003c/div>","textStyle":{"fontSize":650,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_115","enterEffect":"fade","onExit":"leave","exitAt":"fr_118","exitEffect":"fade"}},{"id":"txt_117","type":"text","x":18300,"y":28250,"w":16250,"h":2500,"rotation":0,"z":952,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Radiation in and out, a surface, air that moves: for the planet as a whole, over the long run, that closes the books.\u003c/div>","textStyle":{"fontSize":500,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_115","enterEffect":"fade","onExit":"leave","exitAt":"fr_118","exitEffect":"fade"}},{"id":"txt_119","type":"text","x":18300,"y":31250,"w":16250,"h":3750,"rotation":0,"z":953,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">But climate varies on \u003cspan style=\"font-weight:700;color:#C9531A\">every timescale\u003c/span>, from days to ice ages, and inside the planet its parts keep passing energy among themselves. To understand how climate varies, we need \u003cspan style=\"font-weight:700;color:#00809A\">the parts\u003c/span>.\u003c/div>","textStyle":{"fontSize":500,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_118","enterEffect":"fade","onExit":"leave","exitAt":"fr_118","exitEffect":"fade"}},{"id":"img_121","type":"svg","x":18050,"y":27875,"w":18500,"h":6529.41,"rotation":0,"z":514,"content":"assets/ruler_axis.svg","lifecycle":{"enterAt":"fr_120","enterEffect":"fade","onExit":"leave","exitAt":"fr_129","exitEffect":"fade"}},{"id":"txt_122","type":"text","x":18300,"y":26000,"w":18000,"h":2000,"rotation":0,"z":954,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"font-weight:700;color:#1C252D\">“It depends”:\u003c/span> each part responds on its own timescale\u003c/div>","textStyle":{"fontSize":650,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_120","enterEffect":"fade","onExit":"leave","exitAt":"fr_129","exitEffect":"fade"}},{"id":"img_124","type":"svg","x":18050,"y":27875,"w":18500,"h":6529.41,"rotation":0,"z":515,"content":"assets/ruler_atm.svg","lifecycle":{"enterAt":"fr_123","enterEffect":"fade","onExit":"leave","exitAt":"fr_129","exitEffect":"fade"}},{"id":"img_126","type":"svg","x":18050,"y":27875,"w":18500,"h":6529.41,"rotation":0,"z":516,"content":"assets/ruler_ocean.svg","lifecycle":{"enterAt":"fr_125","enterEffect":"fade","onExit":"leave","exitAt":"fr_129","exitEffect":"fade"}},{"id":"img_128","type":"svg","x":18050,"y":27875,"w":18500,"h":6529.41,"rotation":0,"z":517,"content":"assets/ruler_land.svg","lifecycle":{"enterAt":"fr_127","enterEffect":"fade","onExit":"leave","exitAt":"fr_129","exitEffect":"fade"}},{"id":"img_130","type":"svg","x":18050,"y":27875,"w":18500,"h":6529.41,"rotation":0,"z":518,"content":"assets/ruler_ice.svg","lifecycle":{"enterAt":"fr_129","enterEffect":"fade","onExit":"leave","exitAt":"fr_129","exitEffect":"fade"}},{"id":"img_132","type":"svg","x":13300,"y":4400,"w":8400,"h":2467.13,"rotation":0,"z":519,"content":"assets/card.svg","lifecycle":{"enterAt":"fr_131","enterEffect":"fade","onExit":"leave","exitAt":"fr_133","exitEffect":"fade"}},{"id":"img_134","type":"svg","x":13300,"y":7217.13,"w":8400,"h":2702.1,"rotation":0,"z":520,"content":"assets/hats.svg","lifecycle":{"enterAt":"fr_133","enterEffect":"fade","onExit":"leave","exitAt":"fr_133","exitEffect":"fade"}},{"id":"img_136","type":"svg","x":0,"y":0,"w":36000,"h":16000,"rotation":0,"z":303,"content":"assets/f_sfc_sw.svg","lifecycle":{"enterAt":"fr_135","enterEffect":"fade","onExit":"leave","exitAt":"fr_148","exitEffect":"fade"}},{"id":"img_137","type":"svg","x":0,"y":0,"w":36000,"h":16000,"rotation":0,"z":452,"content":"assets/land_grey.svg","lifecycle":{"enterAt":"fr_135","enterEffect":"fade","onExit":"leave","exitAt":"fr_148","exitEffect":"fade"}},{"id":"img_138","type":"svg","x":0,"y":16600,"w":11000,"h":2200,"rotation":0,"z":521,"content":"assets/k_sfc_sw.svg","lifecycle":{"enterAt":"fr_135","enterEffect":"fade","onExit":"leave","exitAt":"fr_148","exitEffect":"fade"}},{"id":"txt_139","type":"text","x":0,"y":-2850,"w":36000,"h":2600,"rotation":0,"z":955,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Who absorbs the sunlight?\u003c/div>","textStyle":{"fontSize":1050,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_135","enterEffect":"fade","onExit":"leave","exitAt":"fr_146","exitEffect":"fade"}},{"id":"txt_141","type":"text","x":500,"y":14250,"w":17400,"h":900,"rotation":0,"z":956,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">Earth absorbs \u003cspan style=\"font-weight:700;color:#1C252D\">242 W/m²\u003c/span> of sunlight\u003c/span>\u003c/div>","textStyle":{"fontSize":620,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_140","enterEffect":"fade","onExit":"leave","exitAt":"fr_148","exitEffect":"fade"}},{"id":"txt_143","type":"text","x":18500,"y":14250,"w":17400,"h":900,"rotation":0,"z":957,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">atmosphere \u003cspan style=\"font-weight:700;color:#1C252D\">77\u003c/span> · surface \u003cspan style=\"font-weight:700;color:#C9531A\">164\u003c/span>\u003c/span>\u003c/div>","textStyle":{"fontSize":620,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_142","enterEffect":"fade","onExit":"leave","exitAt":"fr_148","exitEffect":"fade"}},{"id":"txt_145","type":"text","x":500,"y":15100,"w":17400,"h":900,"rotation":0,"z":958,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">ocean: \u003cspan style=\"font-weight:700;color:#1C252D\">72%\u003c/span> of the area, \u003cspan style=\"font-weight:700;color:#C9531A\">76%\u003c/span> of the surface’s share\u003c/span>\u003c/div>","textStyle":{"fontSize":620,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_144","enterEffect":"fade","onExit":"leave","exitAt":"fr_148","exitEffect":"fade"}},{"id":"txt_147","type":"text","x":18500,"y":15100,"w":17400,"h":900,"rotation":0,"z":959,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">≈ \u003cspan style=\"font-weight:700;color:#C9531A\">half\u003c/span> of all the sunlight Earth absorbs\u003c/span>\u003c/div>","textStyle":{"fontSize":620,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_146","enterEffect":"fade","onExit":"leave","exitAt":"fr_148","exitEffect":"fade"}},{"id":"txt_149","type":"text","x":14000,"y":5800,"w":22000,"h":3000,"rotation":0,"z":960,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">Where does it go?\u003c/span>\u003c/div>","textStyle":{"fontSize":2000,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_148","enterEffect":"fade","onExit":"leave","exitAt":"fr_148","exitEffect":"fade"}}],"frames":[{"id":"fr_5","title":"O1: The ocean's ledger","x":-567483.87,"y":-313280,"w":1600000,"h":900000,"rotation":0,"duration":"auto","easing":"cut","notes":"O1 (50 min). STOP 1 · title, the widest view (Cut).\nThe whole module is one canvas that grows each week. Today it opens in space, on a plot: across, how much starlight each planet gets (relative to Earth); up, how hot its star is.\n- Ask: which of these planets could keep an ocean at its surface, and what does it take? Don't answer yet; the habitable zone comes at stop 5."},{"id":"fr_9","title":"Argha: energy balance","x":1232516.13,"y":-313280,"w":1600000,"h":900000,"rotation":0,"duration":"auto","easing":"smooth","notes":"STOP 2 · where we are (≈3 min with the next two steps, Smooth pan).\n- Argha did energy balance: sunlight absorbed = infrared emitted, S(1−α)/4 = σT⁴, which gives 255 K. Also the Planck feedback and snowball states."},{"id":"fr_16","title":"Suhas: circulation","x":1232516.13,"y":-313280,"w":1600000,"h":900000,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: Suhas did circulation. Recall the Hadley cell: air rises at the equator, moves poleward aloft, sinks near 30° and returns along the surface as the trade winds. Winds carry heat and momentum."},{"id":"fr_21","title":"Two lectures, one question","x":1232516.13,"y":-313280,"w":1600000,"h":900000,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: are these two independent? Take two or three answers and PARK them. We come back here once the energy has been moved (stop 12b)."},{"id":"fr_24","title":"A stable climate needs a stable budget","x":-197000,"y":-117000,"w":460000,"h":258750,"rotation":0,"duration":"auto","easing":"smooth","notes":"STOP 3 · a stable climate needs a stable budget (≈4 min with stop 4, Smooth).\n- Ask first: what would it mean for a planet not to be in balance? Let them think before the two holds.\n- Gain more than you lose and you heat without limit; lose more and you head for 0 K.\n- Old planets exist and aren't frozen solid or molten, so on average they balance."},{"id":"fr_28","title":"Gain more than you lose","x":-197000,"y":-117000,"w":460000,"h":258750,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: gain > loss."},{"id":"fr_29","title":"Lose more than you gain","x":-197000,"y":-117000,"w":460000,"h":258750,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: loss > gain."},{"id":"fr_30","title":"Old planets balance","x":-197000,"y":-117000,"w":460000,"h":258750,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: old planets exist, so they balance. Or do they? Next: two planets that don't."},{"id":"fr_34","title":"Jupiter has its own heat","x":311833.98,"y":-102000,"w":520000,"h":292500,"rotation":0,"duration":"auto","easing":"snappy","notes":"STOP 4 · planets out of balance (Snappy between the three).\n- Jupiter emits about twice what it absorbs (Argha: ~7 W/m² absorbed, ~14 emitted). Its interior is still cooling from its formation, 4.5 billion years ago.\n- Gas giants are massive enough to keep primordial heat for billions of years. So \"out of balance\" is possible, if the planet is cooling."},{"id":"fr_36","title":"A lava world","x":-497483.87,"y":-35280,"w":490000,"h":275625,"rotation":0,"duration":"auto","easing":"snappy","notes":"- Rocky planets are small: their heat of formation leaks out early (a magma-ocean phase lasts millions of years, not billions). To stay out of balance they need a source that keeps going.\n- 55 Cancri e: S ≈ 2,400 (S = starlight received relative to Earth's; a = 0.0154 AU, L = 0.58 L☉, check). Starlight alone can melt rock; its surface is likely a magma ocean.\n- Tidal friction: if its orbit is even slightly eccentric, tides can heat it from inside (as on Io). The measured eccentricity is small (e ≈ 0.05 ± 0.03, consistent with zero; e \u003c 0.015 from the eclipse depth, Bolmont et al. 2013), so how much tides add is debated (e.g. arXiv 2601.23235, 2601.07080). If they matter, it emits more than it absorbs, like Jupiter.\n- So a rocky planet out of balance is more likely a lava world than an ocean world."},{"id":"fr_38","title":"Earth's energy sources","x":-182000,"y":-67000,"w":460000,"h":258750,"rotation":0,"duration":"auto","easing":"snappy","notes":"- Every source Earth has, as a global mean (÷ 5.1 × 10¹⁴ m²):\n  sunlight absorbed ~242 W/m² (CERES EBAF);\n  heat from the interior (formation + radioactive decay) 47 TW ≈ 0.09 W/m² (Davies & Davies 2010, Solid Earth 1, 5-24);\n  human energy use ~19 TW ≈ 0.04 W/m² (~620 EJ/yr primary energy, Energy Institute Statistical Review 2024);\n  tidal friction (Moon and Sun) 3.7 TW ≈ 0.007 W/m² (Egbert & Ray 2003).\n- Hartmann §2.2."},{"id":"fr_42","title":"Earth's budget is radiative","x":-182000,"y":-67000,"w":460000,"h":258750,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: everything but sunlight adds up to less than 0.1% of it. On a rocky planet like ours the budget is radiative: sunlight in, infrared out. So whether it can keep an ocean depends on how much starlight it gets."},{"id":"fr_44","title":"The habitable zone","x":-567483.87,"y":-313280,"w":1600000,"h":900000,"rotation":0,"duration":"auto","easing":"slowDrift","notes":"STOP 5 · the habitable zone (≈4 min with stop 6, Slow drift).\n- The bridge: if starlight sets a rocky planet's budget, then how much starlight it gets decides whether it balances at a temperature where water is liquid."},{"id":"fr_46","title":"Habitable zone band","x":-567483.87,"y":-313280,"w":1600000,"h":900000,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the band fades in. Where a rocky planet can keep liquid water at its surface (Kopparapu et al. 2013). Darker band: conservative limits (runaway greenhouse to maximum greenhouse); lighter: optimistic (recent Venus to early Mars).\n- Venus is inside the inner edge, Earth inside, Mars near the outer edge. Earth's ocean is the evidence it's habitable.\n- Coefficients: Kopparapu et al. 2013, Table 3 as corrected in the erratum (check against the paper before class)."},{"id":"fr_49","title":"Earth is one pixel","x":-317483.87,"y":636720,"w":1100000,"h":618750,"rotation":0,"duration":"auto","easing":"smooth","notes":"STOP 6 · one pixel (Smooth).\n- Seen from another star, Earth is a single pixel. Over a day its brightness rises and falls as it turns: darker when the Pacific faces us (water reflects little), brighter when land and cloud bands do; clouds coming and going add the wiggles. The curve is schematic (Kelkar, Saxena, Kopparapu & Monteiro 2025).\n- Everything so far treats a planet like that pixel: one number for its whole budget."},{"id":"fr_54","title":"The 0-D trap","x":932516.13,"y":586720,"w":1100000,"h":618750,"rotation":0,"duration":"auto","easing":"smooth","notes":"STOP 7 · the 0-D trap (≈3 min, Smooth).\n- Habitable-zone planets around small, cool stars (M dwarfs: Proxima b, TRAPPIST-1 e, f, g; bottom rows of the diagram) are probably tidally locked: one side always lit.\n- The global mean can look fine while the day-night contrast is huge; then transport decides the climate. Kite et al. (2011) give ways such a planet in the zone can become uninhabitable.\n- With a dynamic ocean there is still no snowball jump (Checlair et al. 2019; callback to Argha's snowball).\n- Planet values (check): Proxima b S = 0.65, T★ 3050 K (Anglada-Escudé et al. 2016); TRAPPIST-1 e, f, g S = 0.646, 0.373, 0.252, T★ 2566 K (Agol et al. 2021)."},{"id":"fr_58","title":"Into the Earth dot","x":2666.67,"y":-625,"w":30666.67,"h":17250,"rotation":0,"duration":"auto","easing":"slowDrift","notes":"STOP 8 · the dive (Slow drift). Into the Earth dot: it's a globe; next it opens out flat, and we read Earth's budget place by place."},{"id":"fr_63","title":"Not one place is in balance","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"STOP 9 · Earth's map (≈2 min, Smooth).\n- CERES EBAF annual-mean net radiation at the top of the atmosphere, 2010-2020. Orange: net gain; teal: net loss.\n- Zonal means: about +72 W/m² in the tropics, -127 near the poles (✓ from the CERES files).\n- Not one latitude is in balance."},{"id":"fr_69","title":"20 years into 10 m of water","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"STOP 10 · where would 20 years of this lead? (≈5 min, Cut between holds).\n- The imbalance isn't a snapshot: CERES shows it every year for 20 years, and temperatures barely changed.\n- Ask the class to estimate first: 20 years of the tropical gain into 10 m of water. And the poles?"},{"id":"fr_71","title":"Runaway","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the map recolours to the warming 20 years of imbalance WOULD give 10 m of water (ρc = 1025 × 3990 J m⁻³ K⁻¹).\n- Equator: +1,100 K (✓), hot enough to melt rock. Solid line: where the water would pass 1,400 K (basalt melts at ~1,400 K).\n- Poles: the deficit takes all the heat out of 10 m of water in ~3 years (✓). Dashed line: poleward of it, the water would lose all its heat within the 20 years. Nothing can cool below the ~3 K of the cosmic microwave background (2.7 K), so \"toward 3 K\" is the limit. (In reality its emission would drop as it cooled; this is accounting, not a forecast.)\n- Framing: this is ACCOUNTING. The observed imbalance already includes every feedback at today's temperatures, and it persisted while temperatures stayed put. Don't ask \"what would the temperature be without transport?\" (that's the Planck counterfactual, in the lab: +17 K at the equator, −50 K at the poles in emission temperature)."},{"id":"fr_77","title":"So it was moved","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: it didn't happen. So the energy was moved. Why is Earth habitable? Because something carries the tropics' surplus to the poles."},{"id":"fr_79","title":"Ledger strip","x":8383.33,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":"auto","easing":"smooth","notes":"STOP 11 · implied transport (≈4 min, Smooth).\n- The strip shares the map's latitude axis: each zonal mean lines up with the latitudes it summarises.\n- Slot 1: the net TOA zonal mean. Adding it up from the south pole (after removing the global mean of 1.2 W/m² so the books close) gives the energy that must cross each latitude."},{"id":"fr_82","title":"Implied transport","x":8383.33,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the implied transport. ~5.8 PW must cross 35°N, 5.7 PW cross 35°S (✓). That's the circulation's job (Hartmann Fig 2.14 shows the same)."},{"id":"fr_88","title":"Who carries it?","x":53516.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":"auto","easing":"smooth","notes":"STOP 12 · moving energy moves mass and momentum (≈8 min, Smooth).\n- Start with a planet with NO ocean (that's next, and the rest of the module): only the air can carry the surplus.\n- The air carries energy poleward, from the tropics' surplus to the poles' deficit. The atmosphere's thickness is exaggerated."},{"id":"fr_93","title":"Moving energy moves air","x":53516.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: but the energy rides on air. Carry air poleward and keep going: the equator runs out of air, and it piles up at the poles. That can't go on."},{"id":"fr_96","title":"A return branch","x":53516.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: so the air must come back, low down: a return branch toward the equator. One big loop in each hemisphere, equator to pole. Energy balances, and so does mass."},{"id":"fr_99","title":"Does it matter that Earth is round?","x":97650,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":"auto","easing":"smooth","notes":"Then momentum (Smooth pan).\n- Moving air keeps its angular momentum about Earth's axis, M = (Ωr + u) r, with r the distance to the axis.\n- On a cylinder spinning about its axis, moving \"poleward\" (along the axis) keeps r the same: nothing changes.\n- On a sphere, r = a cos φ shrinks as you go poleward. Keeping M, air that starts at rest at the equator reaches u = Ωa sin²φ / cos φ: ~134 m/s eastward at 30° (Suhas; Hartmann §6.2). The profound consequence: one loop can't reach the pole."},{"id":"fr_103","title":"On a sphere","x":97650,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: on a sphere, going poleward brings the air closer to the axis. Like a skater pulling in their arms, it spins faster: ~130 m/s eastward by 30°."},{"id":"fr_105","title":"So one loop can't reach the pole","x":53516.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":"auto","easing":"smooth","notes":"Back to the planet (Smooth).\n- Winds that strong are unstable: the overturning stops near 30°, the Hadley cell. Poleward of it, swirling weather systems (eddies) carry the energy on. (A weak polar cell is left out of the sketch.)"},{"id":"fr_109","title":"Momentum balances too","x":53516.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: at the surface the trade winds blow from the east and the westerlies from the west. The ground pushes back on both: in the trades it gives the air eastward momentum, in the westerlies it takes it back. Over the globe the two must cancel, or Earth's spin would change. Momentum balances too."},{"id":"fr_111","title":"Related: one set of books","x":1232516.13,"y":-313280,"w":1600000,"h":900000,"rotation":0,"duration":"auto","easing":"slowDrift","notes":"Back out to the parked question (Slow drift out). Energy balance and circulation are not independent:\n- The planet balances as a whole, but no place does (stop 9). The circulation carries the difference (stop 11), and it has to balance mass and momentum while it does (stop 12)."},{"id":"fr_113","title":"Climate science is accounting","x":1232516.13,"y":-313280,"w":1600000,"h":900000,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: energy balance and circulation are one set of books. \"The best climate scientists are accountants.\""},{"id":"fr_115","title":"So why the ocean?","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"STOP 13 · why do we need the ocean at all? (≈5 min, Smooth).\n- With radiation in and out, a surface and a circulation, the whole-planet, long-run budget closes. Everything Argha and Suhas did, and we could stop.\n- But climate varies on every timescale. The long-run balance treats the planet as a whole, against space. Inside, as Argha said, energy is redistributed between the parts; to understand variability on each timescale we need the parts of the climate system."},{"id":"fr_118","title":"Climate varies on every timescale","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: climate varies on every timescale, and its parts pass energy among themselves."},{"id":"fr_120","title":"It depends","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"\"It depends\" (Snappy between parts). Every answer in climate science carries a time scale and a space scale (Argha's Stommel diagram, Sloyan et al. 2019).\n- Days: ignore the ocean and ice. Months to years: the upper ocean, land, forests. Millennia: the ice sheets."},{"id":"fr_123","title":"Atmosphere","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: atmosphere."},{"id":"fr_125","title":"Upper ocean","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: upper ocean."},{"id":"fr_127","title":"Land and forests","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: land and forests."},{"id":"fr_129","title":"Ice sheets","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: ice sheets."},{"id":"fr_131","title":"The ocean's ledgers","x":12500,"y":2837.5,"w":10000,"h":5625,"rotation":0,"duration":"auto","easing":"smooth","notes":"STOP 14 · the ocean's ledgers (≈3 min, Smooth).\n- Budgets we can keep for the ocean: energy, momentum, mass, salt, carbon, nitrogen, phosphorus, iron, calcium. Weeks 1-4 open energy, momentum, mass and salt, then carbon."},{"id":"fr_133","title":"Three hats","x":11455.56,"y":3700,"w":12088.89,"h":6800,"rotation":0,"duration":"auto","easing":"smooth","notes":"Three hats (Smooth). Accountant: which budgets? Data scientist: what do they look like? Physicist or biologist: why?"},{"id":"fr_135","title":"Who absorbs sunlight","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"STOP 15 · first entry: who absorbs sunlight? (≈5 min, Cut between holds).\n- Map: sunlight absorbed at the surface (CERES EBAF, 2010-2020), shown over the ocean; land greyed."},{"id":"fr_140","title":"242 absorbed","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: Earth absorbs 242 W/m² (global mean, ✓)."},{"id":"fr_142","title":"Atmosphere and surface","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the atmosphere takes ~77, the surface ~164 (✓, CERES EBAF: TOA absorbed minus surface net shortwave).\n- Why so much in the atmosphere? Water vapour absorbs strongly in the near-infrared bands of sunlight (the largest share), ozone takes the ultraviolet in the stratosphere, and clouds and aerosols absorb the rest. Independent budgets agree: 78 W/m² (Trenberth, Fasullo & Kiehl 2009), 79 W/m² (Wild et al. 2013; range ~74-91). About a third of absorbed sunlight never reaches the surface."},{"id":"fr_144","title":"The ocean's share","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the ocean is 72% of the area but takes 76% of what the surface absorbs (✓): it absorbs more per m² than land."},{"id":"fr_146","title":"Half of all sunlight","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: so the ocean absorbs about half (52%) of all sunlight Earth absorbs, ~126 W/m² as a global-mean equivalent (✓). Hartmann Fig 2.4; Stewart §5.6."},{"id":"fr_148","title":"Where does it go?","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"STOP 16 · cliffhanger (Slow drift). Then press O for the overview, and stop."}],"settings":{"defaultEasing":"smooth","defaultDuration":"auto"}};</script>
<script>
(function(){
  var DATA = window.__PRES__;
  var frames = DATA.frames, elements = DATA.elements.slice().sort(function(a,b){return a.z-b.z;});
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var world = document.getElementById('world');
  var progress = document.getElementById('progress');
  var index = 0, overview = false, raf = null;

  // ---- build element DOM ----
  var nodes = {};
  elements.forEach(function(el){
    var d = document.createElement('div');
    d.style.position='absolute'; d.style.left=el.x+'px'; d.style.top=el.y+'px';
    d.style.width=el.w+'px'; d.style.height=el.h+'px';
    var inner = document.createElement('div');
    inner.style.width='100%'; inner.style.height='100%';
    inner.style.transform='rotate('+el.rotation+'deg)';
    if(el.type==='text'){
      inner.innerHTML = el.content;
      var ts = el.textStyle||{};
      inner.style.fontSize=(ts.fontSize||32)+'px'; inner.style.fontWeight=(ts.fontWeight||400);
      inner.style.color=ts.color||'#000'; inner.style.textAlign=ts.align||'left';
      inner.style.display='flex'; inner.style.flexDirection='column'; inner.style.justifyContent='center';
    } else {
      var img=document.createElement('img'); img.src=el.content;
      img.style.width='100%'; img.style.height='100%'; img.style.display='block'; img.draggable=false;
      inner.appendChild(img);
    }
    d.appendChild(inner); world.appendChild(d); nodes[el.id]=d; d.style.display='none';
  });

  function vp(){ return {width: window.innerWidth, height: window.innerHeight}; }
  function frameToCam(f, v){ return {cx:f.x+f.w/2, cy:f.y+f.h/2, scale:Math.min(v.width/f.w, v.height/f.h), rotation:f.rotation}; }
  function applyCam(c){
    var v=vp();
    world.style.transform='translate('+(v.width/2)+'px,'+(v.height/2)+'px) rotate('+(-c.rotation)+'deg) scale('+c.scale+') translate('+(-c.cx)+'px,'+(-c.cy)+'px)';
  }

  // ---- van Wijk smooth zoom/pan ----
  function path(from,to,v,rho){
    rho=rho||1.4; var w0=v.width/from.scale, w1=v.width/to.scale;
    var dx=to.cx-from.cx, dy=to.cy-from.cy, u1=Math.hypot(dx,dy), rho2=rho*rho;
    var dRot=((to.rotation-from.rotation+540)%360)-180;
    if(u1<1e-6){ var S=Math.abs(Math.log(w1/w0))/rho||1e-6; return {S:S, at:function(t){var w=w0*Math.pow(w1/w0,t);return{cx:from.cx,cy:from.cy,scale:v.width/w,rotation:from.rotation+dRot*t};}};}
    var b0=(w1*w1-w0*w0+rho2*rho2*u1*u1)/(2*w0*rho2*u1);
    var b1=(w1*w1-w0*w0-rho2*rho2*u1*u1)/(2*w1*rho2*u1);
    var r0=Math.log(-b0+Math.sqrt(b0*b0+1)), r1=Math.log(-b1+Math.sqrt(b1*b1+1));
    var S=(r1-r0)/rho, ch0=Math.cosh(r0);
    return {S:Math.abs(S)||1e-6, at:function(t){var r=r0+rho*t*S; var u=(w0/(rho2*u1))*(ch0*Math.tanh(r)-Math.sinh(r0)); var w=w0*ch0/Math.cosh(r); return{cx:from.cx+dx*u,cy:from.cy+dy*u,scale:v.width/w,rotation:from.rotation+dRot*t};}};
  }
  // Proper CSS cubic-bezier easing: solve x(t)=time via Newton, then return y(t).
  // (Matches the editor's Motion easing so playback feels identical to the app.)
  function cubicBezier(x1,y1,x2,y2){
    var A=function(a,b){return 1-3*b+3*a;}, B=function(a,b){return 3*b-6*a;}, C=function(a){return 3*a;};
    var calc=function(t,a,b){return ((A(a,b)*t+B(a,b))*t+C(a))*t;};
    var slope=function(t,a,b){return 3*A(a,b)*t*t+2*B(a,b)*t+C(a);};
    return function(x){ if(x<=0)return 0; if(x>=1)return 1; var t=x;
      for(var i=0;i<6;i++){ var s=slope(t,x1,x2); if(s===0) break; t-=(calc(t,x1,x2)-x)/s; }
      return calc(t,y1,y2); };
  }
  var EASE={smooth:{e:cubicBezier(.4,0,.2,1),k:1},snappy:{e:cubicBezier(.2,.8,.2,1),k:.6},slowDrift:{e:cubicBezier(.33,0,.2,1),k:1.6},cut:{e:null,k:0}};

  var curCam = frames[0]?frameToCam(frames[0],vp()):{cx:0,cy:0,scale:1,rotation:0};
  function animateTo(target, easing, duration){
    if(raf) cancelAnimationFrame(raf);
    var v=vp(), p=path(curCam,target,v);
    var prof=EASE[easing]||EASE.smooth;
    var durMs = duration==='auto' ? Math.max(350,Math.min(2600,700*(0.4+p.S))) : duration;
    durMs *= prof.k||1;
    // will-change only while moving: left on, Chrome keeps the first raster scale and deep zooms blur.
    if(reduced||easing==='cut'||durMs<=0){ curCam=target; applyCam(target); world.style.willChange='auto'; return; }
    world.style.willChange='transform';
    var t0=performance.now();
    (function step(now){
      var t=Math.min(1,(now-t0)/durMs); var et=prof.e?prof.e(t):t;
      var c=p.at(et); applyCam(c);
      if(t<1){ raf=requestAnimationFrame(step); } else { curCam=target; world.style.willChange='auto'; }
    })(t0);
  }

  // ---- visibility (mirrors visibility.ts) ----
  function idxOf(id){ for(var i=0;i<frames.length;i++) if(frames[i].id===id) return i; return -1; }
  function visAt(el,i){
    var lc=el.lifecycle||{}; var enter = lc.enterAt? idxOf(lc.enterAt):0;
    if(i<enter) return false;
    var leave=Infinity;
    if(lc.onExit==='leave'){ var ref=lc.exitAt||lc.enterAt; var li=ref?idxOf(ref):enter; leave=li>=0?li:enter; }
    return i<=leave;
  }
  function render(i){
    elements.forEach(function(el){
      var on=visAt(el,i), node=nodes[el.id], wasOn=node.style.display!=='none';
      if(on&&!wasOn){ node.style.display=''; entrance(el,node); }
      else if(!on&&wasOn){ exit(el,node); }
    });
  }
  function entrance(el,node){
    if(reduced) return; var lc=el.lifecycle||{}; if(idxOf(lc.enterAt)!==index) return;
    var eff=lc.enterEffect;
    if(eff==='fade'){ node.animate([{opacity:0},{opacity:1}],{duration:500,easing:'ease-out'}); }
    else if(eff==='slide'){ var o=offset(lc.enterDirection); node.animate([{opacity:0,transform:'translate('+o.x+'px,'+o.y+'px)'},{opacity:1,transform:'none'}],{duration:500,easing:'ease-out'}); }
    else if(eff==='pulse'){ node.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:600}); }
  }
  function exit(el,node){
    var lc=el.lifecycle||{};
    if(reduced||lc.onExit!=='leave'||lc.exitEffect==='none'){ node.style.display='none'; return; }
    var o=lc.exitEffect==='slide'?offset(lc.enterDirection):{x:0,y:0};
    var a=node.animate([{opacity:1},{opacity:0,transform:'translate('+o.x+'px,'+o.y+'px)'}],{duration:400,easing:'ease-in'});
    a.onfinish=function(){ node.style.display='none'; };
  }
  function offset(dir){ var d=80; return dir==='right'?{x:d,y:0}:dir==='up'?{x:0,y:-d}:dir==='down'?{x:0,y:d}:{x:-d,y:0}; }

  // ---- deep links (mirrors deepLink.ts): #title-slug or #number ----
  function slugOf(t){ return String(t||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  var taken={}, hashes=frames.map(function(f,i){ var s=slugOf(f.title); if(!s||/^\d+$/.test(s)||taken[s]) return String(i+1); taken[s]=1; return s; });
  function frameFromHash(hash){
    var h=hash.replace(/^#/,''); try{ h=decodeURIComponent(h); }catch(e){ return -1; } h=h.toLowerCase();
    if(/^\d+$/.test(h)){ var n=Number(h); return n>=1&&n<=hashes.length?n-1:-1; }
    return h?hashes.indexOf(h):-1;
  }
  function setHash(i){ try{ history.replaceState(null,'','#'+hashes[i]); }catch(e){} }

  function go(i){
    i=Math.max(0,Math.min(frames.length-1,i)); var f=frames[i]; if(!f) return;
    overview=false; index=i; render(i); setHash(i);
    animateTo(frameToCam(f,vp()), f.easing, f.duration);
    if(progress) progress.style.width=((i+1)/frames.length*100)+'%';
  }
  function bounds(){
    if(!elements.length) return {x:-640,y:-360,w:1280,h:720,rotation:0};
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    elements.forEach(function(e){x0=Math.min(x0,e.x);y0=Math.min(y0,e.y);x1=Math.max(x1,e.x+e.w);y1=Math.max(y1,e.y+e.h);});
    var px=(x1-x0)*0.1, py=(y1-y0)*0.1; return {x:x0-px,y:y0-py,w:(x1-x0)+2*px,h:(y1-y0)+2*py,rotation:0};
  }
  function toggleOverview(){ if(overview){ go(index); } else { overview=true; animateTo(frameToCam(bounds(),vp()),'smooth','auto'); } }

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); overview?go(index):go(index+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); overview?go(index):go(index-1); }
    else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(frames.length-1); }
    else if(e.key==='o'||e.key==='O'){ toggleOverview(); }
  });
  stage.addEventListener('click',function(){ overview?go(index):go(index+1); });
  window.addEventListener('resize',function(){ applyCam(curCam); });
  window.addEventListener('hashchange',function(){ var i=frameFromHash(location.hash); if(i>=0&&(i!==index||overview)) go(i); });

  if(frames.length){
    index=Math.max(0,frameFromHash(location.hash)); curCam=frameToCam(frames[index],vp());
    render(index); applyCam(curCam); if(progress) progress.style.width=((index+1)/frames.length*100)+'%';
  }
})();</script>
</body>
</html>
