=\"font-weight:700;color:#4A55A2\">westerlies\u003c/span> trade momentum with the surface. Momentum has a ledger too.\u003c/div>","textStyle":{"fontSize":763.67,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_197","enterEffect":"fade","onExit":"leave","exitAt":"fr_197","exitEffect":"fade"}},{"id":"txt_202","type":"text","x":80903.33,"y":9540,"w":13956.67,"h":4476.67,"rotation":0,"z":988,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">We called that surface “the ground”. Over \u003cspan style=\"font-weight:700;color:#4A55A2\">70%\u003c/span> of it is water.\u003c/div>","textStyle":{"fontSize":763.67,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_197","enterEffect":"fade","onExit":"leave","exitAt":"fr_197","exitEffect":"fade"}},{"id":"img_204","type":"svg","x":0,"y":0,"w":36000,"h":16000,"rotation":0,"z":528,"content":"assets/f_tau.svg","lifecycle":{"enterAt":"fr_203","enterEffect":"fade","onExit":"leave","exitAt":"fr_208","exitEffect":"fade"}},{"id":"img_205","type":"svg","x":0,"y":16600,"w":15888.89,"h":2200,"rotation":0,"z":529,"content":"assets/k_tau.svg","lifecycle":{"enterAt":"fr_203","enterEffect":"fade","onExit":"leave","exitAt":"fr_203","exitEffect":"fade"}},{"id":"txt_206","type":"text","x":0,"y":-2850,"w":36000,"h":2600,"rotation":0,"z":989,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">The wind’s push on the ocean\u003c/div>","textStyle":{"fontSize":1050,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_203","enterEffect":"fade","onExit":"leave","exitAt":"fr_203","exitEffect":"fade"}},{"id":"txt_207","type":"text","x":0,"y":-1500,"w":36000,"h":1400,"rotation":0,"z":990,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">The momentum the air gives up goes into the water\u003c/div>","textStyle":{"fontSize":620,"fontWeight":400,"color":"#5A6670","align":"left"},"lifecycle":{"enterAt":"fr_203","enterEffect":"fade","onExit":"leave","exitAt":"fr_203","exitEffect":"fade"}},{"id":"img_209","type":"svg","x":37800,"y":0,"w":4900,"h":20400,"rotation":0,"z":530,"content":"assets/s_taux.svg","lifecycle":{"enterAt":"fr_208","enterEffect":"fade","onExit":"leave","exitAt":"fr_208","exitEffect":"fade"}},{"id":"txt_210","type":"text","x":39300,"y":-1500,"w":4600,"h":1300,"rotation":0,"z":991,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Wind stress\u003c/div>","textStyle":{"fontSize":560,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_208","enterEffect":"fade","onExit":"leave","exitAt":"fr_208","exitEffect":"fade"}},{"id":"txt_211","type":"text","x":2966.67,"y":-2850,"w":34233.33,"h":2600,"rotation":0,"z":992,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">The ocean’s side of the \u003cspan style=\"font-weight:700;color:#4A55A2\">momentum ledger\u003c/span>\u003c/div>","textStyle":{"fontSize":1050,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_208","enterEffect":"fade","onExit":"leave","exitAt":"fr_208","exitEffect":"fade"}},{"id":"txt_212","type":"text","x":2966.67,"y":-1500,"w":34233.33,"h":1400,"rotation":0,"z":993,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Pushed west in the trades, east in the westerlies, hardest in the Southern Ocean\u003c/div>","textStyle":{"fontSize":520,"fontWeight":400,"color":"#5A6670","align":"left"},"lifecycle":{"enterAt":"fr_208","enterEffect":"fade","onExit":"leave","exitAt":"fr_208","exitEffect":"fade"}},{"id":"txt_214","type":"text","x":18050,"y":38875,"w":18500,"h":1125,"rotation":0,"z":994,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">The ocean is \u003cspan style=\"font-weight:700;color:#00809A\">ponderous\u003c/span>\u003c/div>","textStyle":{"fontSize":675,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_213","enterEffect":"fade","onExit":"leave","exitAt":"fr_216","exitEffect":"fade"}},{"id":"img_215","type":"svg","x":18050,"y":40250,"w":18447.58,"h":7625,"rotation":0,"z":531,"content":"assets/speed.svg","lifecycle":{"enterAt":"fr_213","enterEffect":"fade","onExit":"leave","exitAt":"fr_213","exitEffect":"fade"}},{"id":"txt_217","type":"text","x":18050,"y":40625,"w":18500,"h":1000,"rotation":0,"z":995,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Take a typical push of 0.1 N/m² on a 50 m mixed layer:\u003c/div>","textStyle":{"fontSize":525,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_216","enterEffect":"fade","onExit":"leave","exitAt":"fr_216","exitEffect":"fade"}},{"id":"txt_218","type":"text","x":18050,"y":42000,"w":18500,"h":1125,"rotation":0,"z":996,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"font-weight:700;color:#00809A\">acceleration = τ / (ρH) ≈ 2 × 10⁻⁶ m/s²\u003c/span>\u003c/div>","textStyle":{"fontSize":750,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_216","enterEffect":"fade","onExit":"leave","exitAt":"fr_216","exitEffect":"fade"}},{"id":"txt_219","type":"text","x":18050,"y":43750,"w":18500,"h":3750,"rotation":0,"z":997,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Left alone, it would take about \u003cspan style=\"font-weight:700;color:#1C252D\">two months\u003c/span> to reach the speed of the wind. It never gets there.\u003cbr>\u003cbr>\u003cspan style=\"font-weight:700;color:#C9531A\">Why not?\u003c/span> Earth is turning.\u003c/div>","textStyle":{"fontSize":525,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_216","enterEffect":"fade","onExit":"leave","exitAt":"fr_216","exitEffect":"fade"}},{"id":"img_221","type":"svg","x":38725,"y":38625,"w":12500,"h":10750,"rotation":0,"z":532,"content":"assets/ekman_ice.svg","lifecycle":{"enterAt":"fr_220","enterEffect":"fade","onExit":"leave","exitAt":"fr_220","exitEffect":"fade"}},{"id":"txt_222","type":"text","x":51600,"y":39125,"w":6625,"h":1125,"rotation":0,"z":998,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Nansen’s ice\u003c/div>","textStyle":{"fontSize":600,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_220","enterEffect":"fade","onExit":"leave","exitAt":"fr_220","exitEffect":"fade"}},{"id":"txt_223","type":"text","x":51600,"y":40500,"w":6625,"h":2750,"rotation":0,"z":999,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">Sailing the Arctic, Nansen saw the ice drift \u003cspan style=\"font-weight:700;color:#00809A\">to the right\u003c/span> of the wind, by 20–40°.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_220","enterEffect":"fade","onExit":"leave","exitAt":"fr_220","exitEffect":"fade"}},{"id":"txt_224","type":"text","x":51600,"y":43500,"w":6625,"h":2750,"rotation":0,"z":1000,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">Remember Suhas: on a turning Earth, anything moving veers right in the north, left in the south.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_220","enterEffect":"fade","onExit":"leave","exitAt":"fr_220","exitEffect":"fade"}},{"id":"img_226","type":"svg","x":38725,"y":38625,"w":12500,"h":10750,"rotation":0,"z":533,"content":"assets/ekman_force.svg","lifecycle":{"enterAt":"fr_225","enterEffect":"fade","onExit":"leave","exitAt":"fr_230","exitEffect":"fade"}},{"id":"txt_227","type":"text","x":51600,"y":39125,"w":6625,"h":1125,"rotation":0,"z":1001,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Ekman transport\u003c/div>","textStyle":{"fontSize":600,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_225","enterEffect":"fade","onExit":"leave","exitAt":"fr_230","exitEffect":"fade"}},{"id":"txt_228","type":"text","x":51600,"y":40500,"w":6625,"h":3375,"rotation":0,"z":1002,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">Add up the whole stirred layer. Only two forces act, and they must cancel. So the water must move \u003cspan style=\"font-weight:700;color:#C9531A\">90° to the right of the wind\u003c/span>.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_225","enterEffect":"fade","onExit":"leave","exitAt":"fr_230","exitEffect":"fade"}},{"id":"txt_229","type":"text","x":51600,"y":43875,"w":6625,"h":1250,"rotation":0,"z":1003,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">In the southern hemisphere: to the left.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_225","enterEffect":"fade","onExit":"leave","exitAt":"fr_230","exitEffect":"fade"}},{"id":"txt_231","type":"text","x":51600,"y":45375,"w":6625,"h":3000,"rotation":0,"z":1004,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">\u003cspan style=\"font-weight:700;color:#C9531A\">τ / (ρf) ≈ 1 m²/s\u003c/span>: a metre-wide strip carries about a cubic metre each second. Over 50 m, that’s just 2 cm/s.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_230","enterEffect":"fade","onExit":"leave","exitAt":"fr_230","exitEffect":"fade"}},{"id":"img_233","type":"svg","x":0,"y":0,"w":36000,"h":16000,"rotation":0,"z":307,"content":"assets/f_heating.svg","lifecycle":{"enterAt":"fr_232","enterEffect":"fade","onExit":"leave","exitAt":"fr_241","exitEffect":"fade"}},{"id":"txt_234","type":"text","x":4005,"y":5822.5,"w":1305,"h":675,"rotation":0,"z":1005,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">Back to the coast that gains heat. \u003cspan style=\"font-weight:700;color:#4A55A2\">Put a wall beside that sideways transport.\u003c/span>\u003c/span>\u003c/div>","textStyle":{"fontSize":76.5,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_232","enterEffect":"fade","onExit":"leave","exitAt":"fr_232","exitEffect":"fade"}},{"id":"img_236","type":"svg","x":2940,"y":6790,"w":720,"h":420,"rotation":0,"z":709,"content":"assets/up_coast.svg","lifecycle":{"enterAt":"fr_235","enterEffect":"fade","onExit":"leave","exitAt":"fr_239","exitEffect":"fade"}},{"id":"txt_237","type":"text","x":3372,"y":6883,"w":159,"h":27,"rotation":0,"z":1006,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"font-weight:700;color:#00809A\">Coastal upwelling\u003c/span>\u003c/div>","textStyle":{"fontSize":14.4,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_235","enterEffect":"fade","onExit":"leave","exitAt":"fr_239","exitEffect":"fade"}},{"id":"txt_238","type":"text","x":3372,"y":6916,"w":159,"h":90,"rotation":0,"z":1007,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">The wind blows along the coast. The water goes \u003cspan style=\"font-weight:700;color:#C9531A\">90° to its right\u003c/span>: offshore. The only place to replace it is \u003cspan style=\"font-weight:700;color:#00809A\">from below\u003c/span>.\u003c/div>","textStyle":{"fontSize":9.6,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_235","enterEffect":"fade","onExit":"leave","exitAt":"fr_239","exitEffect":"fade"}},{"id":"txt_240","type":"text","x":3372,"y":7006,"w":159,"h":90,"rotation":0,"z":1008,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">Same recipe: Somali and Oman coasts in the monsoon, \u003cspan style=\"font-weight:700;color:#1C252D\">Peru\u003c/span>, \u003cspan style=\"font-weight:700;color:#1C252D\">California\u003c/span>. Cold, rich water: the world’s great fisheries.\u003c/div>","textStyle":{"fontSize":9.6,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_239","enterEffect":"fade","onExit":"leave","exitAt":"fr_239","exitEffect":"fade"}},{"id":"txt_242","type":"text","x":22072.5,"y":6978.75,"w":1840,"h":575,"rotation":0,"z":1009,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">No coast here. \u003cspan style=\"font-weight:700;color:#4A55A2\">So why does cold water come up?\u003c/span>\u003c/span>\u003c/div>","textStyle":{"fontSize":97.75,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_241","enterEffect":"fade","onExit":"leave","exitAt":"fr_241","exitEffect":"fade"}},{"id":"img_244","type":"svg","x":22640,"y":7790,"w":720,"h":420,"rotation":0,"z":710,"content":"assets/up_eq.svg","lifecycle":{"enterAt":"fr_243","enterEffect":"fade","onExit":"leave","exitAt":"fr_247","exitEffect":"fade"}},{"id":"txt_245","type":"text","x":23072,"y":7883,"w":159,"h":27,"rotation":0,"z":1010,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"font-weight:700;color:#00809A\">Equatorial upwelling\u003c/span>\u003c/div>","textStyle":{"fontSize":14.4,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_243","enterEffect":"fade","onExit":"leave","exitAt":"fr_247","exitEffect":"fade"}},{"id":"txt_246","type":"text","x":23072,"y":7916,"w":159,"h":102,"rotation":0,"z":1011,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">Coriolis changes sign at the equator. Under the trades, water goes \u003cspan style=\"font-weight:700;color:#C9531A\">away from it\u003c/span> on both sides, so cold water rises. The puzzle closes: the ocean gains heat where it’s cold because \u003cspan style=\"font-weight:700;color:#00809A\">cold water keeps arriving\u003c/span>.\u003c/div>","textStyle":{"fontSize":9.6,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_243","enterEffect":"fade","onExit":"leave","exitAt":"fr_247","exitEffect":"fade"}},{"id":"txt_248","type":"text","x":23072,"y":8024,"w":159,"h":84,"rotation":0,"z":1012,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">Happening now: \u003cspan style=\"font-weight:700;color:#C9531A\">a strong El Niño.\u003c/span> Weakened trades, weakened upwelling, and parts of the eastern Pacific more than 4 °C warmer than normal.\u003c/div>","textStyle":{"fontSize":9.6,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_247","enterEffect":"fade","onExit":"leave","exitAt":"fr_247","exitEffect":"fade"}},{"id":"img_250","type":"svg","x":60025,"y":38625,"w":12500,"h":10750,"rotation":0,"z":534,"content":"assets/hill.svg","lifecycle":{"enterAt":"fr_249","enterEffect":"fade","onExit":"leave","exitAt":"fr_249","exitEffect":"fade"}},{"id":"txt_251","type":"text","x":72900,"y":39125,"w":6625,"h":1125,"rotation":0,"z":1013,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Hills of water\u003c/div>","textStyle":{"fontSize":600,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_249","enterEffect":"fade","onExit":"leave","exitAt":"fr_249","exitEffect":"fade"}},{"id":"txt_252","type":"text","x":72900,"y":40500,"w":6625,"h":3000,"rotation":0,"z":1014,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">Under the trades water goes poleward; under the westerlies, equatorward. Where they meet, it \u003cspan style=\"font-weight:700;color:#C9531A\">piles up\u003c/span>.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_249","enterEffect":"fade","onExit":"leave","exitAt":"fr_249","exitEffect":"fade"}},{"id":"txt_253","type":"text","x":72900,"y":43625,"w":6625,"h":3000,"rotation":0,"z":1015,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.32;\">The hill’s pressure drives flow, but Earth’s turning bends it: as for Suhas’s winds, the water runs \u003cspan style=\"font-weight:700;color:#00809A\">around the hill\u003c/span>.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_249","enterEffect":"fade","onExit":"leave","exitAt":"fr_249","exitEffect":"fade"}},{"id":"img_255","type":"svg","x":0,"y":0,"w":36000,"h":16000,"rotation":0,"z":308,"content":"assets/f_ssh.svg","lifecycle":{"enterAt":"fr_254","enterEffect":"fade","onExit":"leave","exitAt":"fr_268","exitEffect":"fade"}},{"id":"img_256","type":"svg","x":0,"y":16600,"w":13587.75,"h":2200,"rotation":0,"z":535,"content":"assets/k_ssh.svg","lifecycle":{"enterAt":"fr_254","enterEffect":"fade","onExit":"leave","exitAt":"fr_254","exitEffect":"fade"}},{"id":"txt_257","type":"text","x":0,"y":-2850,"w":36000,"h":2600,"rotation":0,"z":1016,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">The hills are real: about \u003cspan style=\"font-weight:700;color:#C9531A\">1 m\u003c/span> high, thousands of km across\u003c/div>","textStyle":{"fontSize":1050,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_254","enterEffect":"fade","onExit":"leave","exitAt":"fr_259","exitEffect":"fade"}},{"id":"txt_258","type":"text","x":0,"y":-1500,"w":36000,"h":1400,"rotation":0,"z":1017,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Ocean reanalysis, 2011\u003c/div>","textStyle":{"fontSize":620,"fontWeight":400,"color":"#5A6670","align":"left"},"lifecycle":{"enterAt":"fr_254","enterEffect":"fade","onExit":"leave","exitAt":"fr_259","exitEffect":"fade"}},{"id":"img_260","type":"svg","x":0,"y":0,"w":36000,"h":16000,"rotation":0,"z":536,"content":"assets/f_cur.svg","lifecycle":{"enterAt":"fr_259","enterEffect":"fade","onExit":"leave","exitAt":"fr_259","exitEffect":"fade"}},{"id":"img_261","type":"svg","x":0,"y":0,"w":36000,"h":16000,"rotation":0,"z":537,"content":"assets/f_cur.svg","lifecycle":{"enterAt":"fr_268","enterEffect":"fade","onExit":"leave","exitAt":"fr_268","exitEffect":"fade"}},{"id":"img_262","type":"svg","x":0,"y":16600,"w":15888.89,"h":2200,"rotation":0,"z":538,"content":"assets/k_cur.svg","lifecycle":{"enterAt":"fr_259","enterEffect":"fade","onExit":"leave","exitAt":"fr_259","exitEffect":"fade"}},{"id":"img_263","type":"svg","x":0,"y":0,"w":36000,"h":16000,"rotation":0,"z":539,"content":"assets/f_cur_zoom.svg","lifecycle":{"enterAt":"fr_264","enterEffect":"fade","onExit":"leave","exitAt":"fr_266","exitEffect":"fade"}},{"id":"txt_265","type":"text","x":25442.5,"y":3273.75,"w":1472.5,"h":522.5,"rotation":0,"z":1018,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">The fast flow hugs the \u003cspan style=\"font-weight:700;color:#C9531A\">west\u003c/span> side of the hill: the \u003cspan style=\"font-weight:700;color:#4A55A2\">Gulf Stream\u003c/span>.\u003c/span>\u003c/div>","textStyle":{"fontSize":80.75,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_264","enterEffect":"fade","onExit":"leave","exitAt":"fr_264","exitEffect":"fade"}},{"id":"txt_267","type":"text","x":12927.5,"y":3673.75,"w":1401.25,"h":522.5,"rotation":0,"z":1019,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">Same in the Pacific: the \u003cspan style=\"font-weight:700;color:#4A55A2\">Kuroshio\u003c/span>. The \u003cspan style=\"font-weight:700;color:#C9531A\">west\u003c/span> side again.\u003c/span>\u003c/div>","textStyle":{"fontSize":80.75,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_266","enterEffect":"fade","onExit":"leave","exitAt":"fr_266","exitEffect":"fade"}},{"id":"txt_269","type":"text","x":14500,"y":15100,"w":19000,"h":1000,"rotation":0,"z":1020,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"background:rgba(255,255,255,.86);border-radius:.25em;padding:.04em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone\">Antarctic Circumpolar Current: no coast in the way\u003c/span>\u003c/div>","textStyle":{"fontSize":620,"fontWeight":700,"color":"#4A55A2","align":"left"},"lifecycle":{"enterAt":"fr_268","enterEffect":"fade","onExit":"leave","exitAt":"fr_268","exitEffect":"fade"}},{"id":"txt_270","type":"text","x":0,"y":-2850,"w":36000,"h":2600,"rotation":0,"z":1021,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Where does the wind’s momentum \u003cspan style=\"font-weight:700;color:#4A55A2\">finally go?\u003c/span>\u003c/div>","textStyle":{"fontSize":1050,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_268","enterEffect":"fade","onExit":"leave","exitAt":"fr_268","exitEffect":"fade"}},{"id":"txt_271","type":"text","x":0,"y":-1500,"w":36000,"h":1400,"rotation":0,"z":1022,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Into coasts and the sea floor. And the current with no coast is where deep water comes back up: \u003cspan style=\"font-weight:700;color:#4A55A2\">next week\u003c/span>\u003c/div>","textStyle":{"fontSize":620,"fontWeight":400,"color":"#5A6670","align":"left"},"lifecycle":{"enterAt":"fr_268","enterEffect":"fade","onExit":"leave","exitAt":"fr_268","exitEffect":"fade"}}],"frames":[{"id":"fr_4","title":"Week 2: Where does it go?","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"cut","notes":"LECTURE A · HOW MUCH OF THE SURFACE FEELS THE WEATHER? (50 min). Beat 1 (≈2 min, Cut). The cliffhanger, as we left it.\n- The ocean takes ~126 W/m² (global-mean equivalent), about half of all the sunlight Earth absorbs (✓ CERES EBAF).\n- Today: down, and into storage. How much storage the weather \"sees\" depends on how heat gets below the surface: by conduction on land, by stirring in the ocean.\n- A student's question about the habitable-zone diagram is answered in the notes; the orbits are now on that slide (Joy's call: 1 min here or notes only)."},{"id":"fr_10","title":"Arabian Sea","x":2800,"y":5700,"w":3200,"h":1800,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 2 (≈2 min with the column, Smooth). Follow the sunlight down at one point off the Indian coast: 65°E, 15°N."},{"id":"fr_14","title":"How deep does sunlight go?","x":4260,"y":6365,"w":480,"h":270,"rotation":0,"duration":"auto","easing":"slowDrift","notes":"Into the point (Slow drift).\n- Sunlight enters the water by colour. Each band fades with depth; the white tick is where 1% of that colour is left.\n- Red is gone within ~10 m; blue reaches 100-200 m in clear open-ocean water (Stewart §6.10, Figs 6.17-6.18; attenuation values approximate, after Morel & Maritorena 2001)."},{"id":"fr_18","title":"Most of it in the top metres","x":4260,"y":6365,"w":480,"h":270,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: all colours together (and the infrared, which is gone in centimetres): more than half of the sunlight is absorbed in the top metre, and only ~5% is left at 50 m (Paulson & Simpson 1977, clearest water type). The ocean is heated from the top."},{"id":"fr_20","title":"Four terms","x":16400,"y":7100,"w":3200,"h":1800,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 3 (≈5 min, Smooth). The surface budget.\n- Sunlight in; infrared, conduction (sensible heat) and evaporation (latent heat) out. Evaporation is the biggest loss (Stewart §5.2; Hartmann §4.2).\n- Arrow widths: tropical-ocean zonal means (CERES for sunlight and infrared; evaporation + conduction as the residual against the reanalysis's net heating, split roughly 9:1)."},{"id":"fr_23","title":"Surface budget by latitude","x":2266.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":"auto","easing":"smooth","notes":"The strip: the same four terms as zonal means over the ocean (redraws Stewart Fig 5.7 / Hartmann Fig 4.18 from our data). Reveal one by one.\n- Sunlight ~222 W/m² near the equator; net infrared ~48; evaporation + conduction ~145 (residual); net ~+29."},{"id":"fr_29","title":"Infrared out","x":2266.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: next term."},{"id":"fr_31","title":"Evaporation out","x":2266.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: next term."},{"id":"fr_33","title":"Net into the ocean","x":2266.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: next term."},{"id":"fr_35","title":"Wind times difference","x":2266.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: fluxes go roughly as wind × difference (sea-air temperature, or how dry the air is), so they depend on the atmosphere's circulation (Stewart §5.7).\n- So every gust, dry spell or cloud is a kick to the surface budget. This is how the weather talks to the surface: WEATHER = A FLUCTUATING F."},{"id":"fr_38","title":"How deep does the kick reach?","x":1600,"y":4212.5,"w":6000,"h":3375,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 4 (≈1 min, Smooth). The question of the lecture. When the weather kicks the surface, how deep does the kick reach? That depth is the surface's effective heat capacity C.\n- Delhi and the Arabian Sea: not far apart, under much the same sun. Two surfaces, two ways for heat to get below the top."},{"id":"fr_44","title":"Land: heat has to conduct","x":5480,"y":5005,"w":480,"h":270,"rotation":0,"duration":"auto","easing":"slowDrift","notes":"Beat 5 (≈9 min, Slow drift). Under Delhi. Land has no way to stir itself, so heat can only conduct down through the soil.\n- Fourier's law: the heat flux q runs down the temperature gradient, with conductivity k (Hartmann §4.3, eq. 4.6)."},{"id":"fr_48","title":"Heat in, heat stored","x":5480,"y":5005,"w":480,"h":270,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: conservation. Whatever flows in and doesn't flow out warms the soil (Hartmann eq. 4.7). ρc is the heat capacity per m³."},{"id":"fr_50","title":"The heat equation","x":5480,"y":5005,"w":480,"h":270,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: put them together: the heat equation, with diffusivity κ = k/ρc. Soil κ ≈ 0.3-1 × 10⁻⁶ m²/s depending on water content (Hartmann §4.3; moist-soil ρc ≈ 2 × 10⁶ J m⁻³ K⁻¹, his Table 4.1 gives 1.9 × 10⁶ for minerals, 4.2 × 10⁶ for water)."},{"id":"fr_52","title":"A day in the soil","x":5480,"y":5005,"w":480,"h":270,"rotation":0,"duration":"auto","easing":"cut","notes":"Solve it for a periodic surface swing (Cut). T′ = A e^(−z/d) cos(ωt − z/d): it fades with depth and lags, and d = √(2κ/ω).\n- Diurnal: d = 9 / 12 / 17 cm for κ = 0.3 / 0.5 / 1 × 10⁻⁶ m²/s (✓). Below about three d, the day isn't felt.\n- Curves are the formula at κ = 5 × 10⁻⁷, ±10 K at the surface (typical of a clear day, not a measurement).\n- Hartmann's (4.10) leaves out the 2, so he gets ~10 cm and ~1.5 m. Same physics; his depth is ours ÷ √2."},{"id":"fr_58","title":"A year in the soil","x":5480,"y":5005,"w":480,"h":270,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the year. d = 1.7 / 2.2 / 3.2 m (✓). √365 ≈ 19: nineteen times deeper, because the period is 365 times longer. Slower forcing reaches deeper, as the square root of the period. Curves: κ = 5 × 10⁻⁷, ±15 K."},{"id":"fr_61","title":"Land is a thin slab","x":5480,"y":5005,"w":480,"h":270,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: as a slab. A half-space holding this swing stores what a slab of C = ρc·d/√2 would (compare the surface flux each needs). So:\n- A year's swing: 0.6 / 0.8 / 1.1 m of water (✓): about a metre.\n- A day's: 3 / 4 / 6 cm of water (✓).\n- So land isn't a fixed slab (its C grows with the timescale), but it is always a thin one.\n- Callbacks: Argha's 20 cm of rock; the Moon's day-night contrast from week 1, which is what conduction alone gets you."},{"id":"fr_64","title":"If water only conducted","x":4260,"y":6365,"w":480,"h":270,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 6 (≈9 min, Smooth; back to the Arabian Sea). The hook. Water has a big ρc, so is that why the ocean is so sluggish?\n- Molecular κ ≈ 1.4 × 10⁻⁷ m²/s, smaller than soil's. A day would reach 6 cm, a year 1.2 m (✓): shallower than soil.\n- As a slab that is 0.8 m of water, against soil's 0.6-1.1 m. So water's big ρc only makes up for its short reach: still water would be no better than soil."},{"id":"fr_68","title":"The mixed layer","x":4260,"y":6365,"w":480,"h":270,"rotation":0,"duration":"auto","easing":"smooth","notes":"What actually happens (Smooth). Wind stirs, waves break, and cooling at night and in winter makes surface water sink.\n- A typical profile: a mixed layer, a thermocline, deep water (schematic after Stewart Fig 6.8).\n- Eddy diffusivity is 10⁴-10⁶ × molecular (Stewart Ch. 8), so the layer is well mixed to its base, and its depth is set by stirring against stratification."},{"id":"fr_73","title":"Conduction against stirring","x":4260,"y":6365,"w":480,"h":270,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the bar. Conduction only, in water: 1.2 m. Soil: 1.7-3.2 m. Stirred: tens to hundreds of metres: ~20-62 m in the Arabian Sea, ~300 m in the March North Atlantic (✓ ocean reanalysis). That's where the ocean's inertia comes from."},{"id":"fr_75","title":"The monsoon stirs it","x":4260,"y":6365,"w":480,"h":270,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the reanalysis's mixed-layer depth by month, Arabian Sea box (60-70°E, 10-20°N): ~20 m in April, ~62 m in July (✓). The monsoon winds stir it deeper (Hartmann §7.3). So the slab isn't fixed here either: weather sets how much of the sea it can lean on."},{"id":"fr_78","title":"From the Arabian Sea to Bermuda","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"Across to Bermuda (Smooth out to the map; the Arabian Sea dot is where we were). Is it the monsoon, or does this happen elsewhere?"},{"id":"fr_85","title":"Bermuda","x":25500,"y":3887.5,"w":3600,"h":2025,"rotation":0,"duration":"auto","easing":"smooth","notes":"Zoom in to the Bermuda point (Smooth): 64°W, 32°N, in the western North Atlantic."},{"id":"fr_87","title":"Near Bermuda","x":27340,"y":4695,"w":480,"h":270,"rotation":0,"duration":"auto","easing":"slowDrift","notes":"Into the point (Slow drift).\n- Near Bermuda: winter cooling and storms stir the mixed layer to ~91 m (January); summer sun leaves a layer ~6 m thick (July) (✓ ocean reanalysis). Stewart Fig 6.7 shows the same growth and decay in the BATS temperature profiles."},{"id":"fr_92","title":"The world's mixed layer","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"slowDrift","notes":"Back out to the map (Slow drift out, Cut between holds).\n- Ocean-reanalysis mixed-layer depth, March 2011. Deepest in the North Atlantic winter: ~304 m averaged over 45-65°N, 60-10°W, and over 1 km in places (✓). Median over the ocean ~44 m (✓)."},{"id":"fr_98","title":"September","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: September. The Southern Ocean winter: ~171 m averaged over 45-60°S (✓)."},{"id":"fr_101","title":"Below the stirring","x":4260,"y":6365,"w":480,"h":270,"rotation":0,"duration":"auto","easing":"slowDrift","notes":"Back into the column (Slow drift): what about below the mixed layer? The stratified thermocline resists stirring. Eddy diffusivity there is K ~10⁻⁵-10⁻⁴ m²/s (~10⁻⁵ from the tracer release of Ledwell et al. 1993; larger near rough bottoms).\n- With the same d = √(2K/ω): 1 yr → 10 / 32 m; 10 yr → 32 / 100 m; 100 yr → 100 / 317 m (✓).\n- Purple bars: the reach from the base of the mixed layer, at K = 10⁻⁴ m²/s."},{"id":"fr_106","title":"No water has gone anywhere","x":4260,"y":6365,"w":480,"h":270,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: Joy's point. So far no water has moved sideways. The ocean already changes climate through vertical movement alone: mixing up and down sets its active thermal inertia."},{"id":"fr_108","title":"Take away the rest","x":4260,"y":6365,"w":480,"h":270,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 7 (≈6 min, Smooth). For the fast climate (seasons to a few years), take away everything below the mixed layer: a ~50 m slab of water gets it roughly right. That slab is what Argha's C dT/dt model needs, with C for 50 m of water.\n- Write it for departures from the mean: C dT′/dt = F′(t) − λT′. The same equation for land, with land's thin C."},{"id":"fr_112","title":"Heat capacity","x":400,"y":16598.75,"w":15400,"h":8662.5,"rotation":0,"duration":"auto","easing":"smooth","notes":"Heat capacity per m², as metres of water: land about a metre (a year's swing, 0.6-1.1 m); the whole atmosphere ≈ 2.4 m; the mixed layer 50 m; the full ocean 4,000 m."},{"id":"fr_115","title":"Timescales","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"The ruler. With Argha's Planck feedback (λ = 3.8 W m⁻² K⁻¹), τ = C/λ: 1 m of water ~12 days; air ~1 month; 50 m ~1.7 years; 4,000 m ~140 years (✓; longer in practice, since mixing to depth is slow). Hartmann §4.3.\n- If they try the tutorial's numbers: the app uses a net feedback of 2.09 W m⁻² K⁻¹ and a 75 m layer, so its mixed layer takes ~5 years, and its land box carries the air above it (2.4 m of water, ~2 months)."},{"id":"fr_120","title":"Seasons","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"The observational test (Smooth). If the slabs are right, the same seasonal sun should swing land far more than sea.\n- Seasonal range of surface temperature (warmest minus coldest month), from CERES upwelling longwave (σT⁴, emissivity 1), 2010-2020 climatology.\n- Yakutsk ~57 K; Almaty ~35 K; Delhi ~23 K; Pune ~9 K; Mumbai ~5 K; Arabian Sea ~5 K; Equatorial Pacific ~2 K (✓)."},{"id":"fr_139","title":"Same weather, two slabs","x":-4000,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 8 (≈8 min, Smooth). Same weather, two slabs. These are the tutorial app's own runs (presets 1 and 2, same weather number), so what they see in the tutorial is what you show now.\n- Land follows the weather: monthly temperatures spread ±1.2 K. The mixed layer adds up the kicks and wanders: ±0.3 K, and slowly.\n- Monthly means of the weather are shown; the daily weather is several times larger (30 W/m² spread)."},{"id":"fr_144","title":"Power by timescale","x":-4000,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the same runs sorted by timescale (average of 8 weather numbers). This is the tutorial's Spectrum view. Triangles mark the bend of each curve, period 2πτ with τ = C/b and the app's b = 2.09: land ~1 year (τ ~2 months), mixed layer ~30 years (τ ~5 years). A swing of period P has ω = 2π/P, so it feels the slab when ωτ ≈ 1. The app's Spectrum view marks period = τ itself, so its markers sit a factor of 2π left of the bends.\n- Fast: slab by slab, the mixed layer has 190× less power than land at 6 months to 2 years, 490× at 2-6 months, heading for (C_ocean/C_land)² ≈ 992.\n- The app's Spectrum panel plots whole-planet temperature, which is 30% land there, so students will read about 100× (65-123×). It also divides power by period, so its curves slope down at the slow end where these stay flat."},{"id":"fr_151","title":"The slow swings don't change","x":-4000,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the punchline. Slow power is unchanged: mixed layer / land = 0.98 at 100-1,000 years (✓). At long timescales F′ is balanced by λT′ alone, so C drops out. Depth sets the timescale, not the size of the slow swings. This is Hasselmann's point: slow climate variability from weather noise with no slow cause."},{"id":"fr_153","title":"Add the deep ocean","x":-4000,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: + deep ocean. A second, slower corner, off this axis (τ ~190 years in the app, C_deep/γ, so a period ~1,200 years), and extra damping at centennial scales: slow power falls to 0.65 of land's (✓). A leak to a big reservoir acts like a larger λ on those timescales. So deep water calms the slowest swings a little. It doesn't add to them."},{"id":"fr_156","title":"Earth's imbalance today","x":-4000,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 9 (≈2 min, Smooth). Earth's imbalance now, and why it matters that the ocean is so big.\n- CERES: ~+1.0 W/m² (2010-2020, ✓). More than 91% of the excess heat goes into the ocean (WMO State of the Global Climate 2025); the imbalance has more than doubled since 1976-1995 (Forster et al. 2026).\n- The satellite number is pinned to ocean thermometers: EBAF is adjusted to in-situ heat storage (Loeb et al. 2018).\n- Inertia is why warming lags: most of the extra heat goes where it barely shows at the surface."},{"id":"fr_161","title":"But it gains heat where it's cold","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 10 (≈2 min, Smooth). Hand-off. The ocean doesn't only store heat. The reanalysis's annual-mean net heat flux into the ocean (2011): orange, the ocean gains; teal, it loses. A slab that only stored heat would net zero everywhere over a year. This one gains along the equator and on the Somali coast, where it's cold, and loses over the Gulf Stream. So the water must move: next lecture.\n- Tutorial: Daisyworld with an Ocean, steps 1-3."},{"id":"fr_166","title":"Where the ocean gains and loses heat","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"cut","notes":"LECTURE B · THE PONDEROUS OCEAN: WIND CLOSES THE MOMENTUM LEDGER (50 min). Beat 1 (≈5 min, Cut). The reanalysis's annual-mean net heat flux into the ocean, 2011. Orange: the ocean gains; teal: it loses. Last time we stored heat; a slab that only stores would net zero over a year. This map doesn't."},{"id":"fr_171","title":"Gulf Stream","x":25300,"y":3131.25,"w":3800,"h":2137.5,"rotation":0,"duration":"auto","easing":"snappy","notes":"The puzzle (Snappy between regions).\n- Gulf Stream: big loss. Warm water carried north meets cold, dry winter air. At 38°N the winter loss is paid for by heat stored in summer and heat the current brings (Hartmann Fig 4.16)."},{"id":"fr_173","title":"Cold tongue","x":21900,"y":6806.25,"w":4600,"h":2587.5,"rotation":0,"duration":"auto","easing":"snappy","notes":"- Eastern equatorial Pacific cold tongue: gains heat. Cold water comes up here from below."},{"id":"fr_175","title":"Somali coast","x":1800,"y":5687.5,"w":3600,"h":2025,"rotation":0,"duration":"auto","easing":"snappy","notes":"- Somali and Arabian coasts: gain heat. The summer monsoon winds pull cold water up along the coast (Hartmann Fig 7.9)."},{"id":"fr_177","title":"So the water moves","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"slowDrift","notes":"Back to the map (Slow drift). It gains heat where it's cold and loses it where warm water has been carried. So the water moves. Why it comes up in those places is today's question; we come back to it."},{"id":"fr_179","title":"Who carries the heat","x":7566.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 2 (≈5 min, Smooth). The strip, as in week 1: net radiation, and the energy it says must cross each latitude.\n- Total ~5.8 PW at 35°N (✓). Observational estimates put the ocean's share near 2 PW around 20°N, dominant in the deep tropics; the atmosphere dominates poleward of ~30° (Stewart Fig 5.11; Trenberth & Caron 2001)."},{"id":"fr_187","title":"Ocean versus atmosphere","x":7566.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the reanalysis's own surface fluxes imply ~1.2 PW at 14°N (✓, dashed), below the ~2 PW observational estimate (diamond). How sure are we? Different lines of evidence still disagree."},{"id":"fr_189","title":"The atmosphere's share","x":7566.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the atmosphere carries the rest (total minus ocean)."},{"id":"fr_191","title":"Mass times contrast","x":7566.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: accountant's version: transport = mass moved × energy contrast (Czaja & Marshall 2006). Air moves far more mass; water carries far more heat per kilogram per degree."},{"id":"fr_194","title":"Gulf Stream sum","x":19700,"y":143.75,"w":13000,"h":7312.5,"rotation":0,"duration":"auto","easing":"smooth","notes":"On North America, beside the Gulf Stream: 100 km × 600 m × 0.5 m/s ≈ 30 Sv (1 Sv = 10⁶ m³/s). Gulf Stream plus Kuroshio, with a ~6 °C contrast, gives ~1.6 PW (Hartmann §7.8)."},{"id":"fr_197","title":"Who pays for it?","x":53516.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 3 (≈4 min, Smooth). Recall week 1: trades and westerlies trade momentum with the surface. Trades take eastward momentum from it, westerlies give it back. We drew that as \"the ground\". Over 70% of that ground is water."},{"id":"fr_203","title":"The wind's push on the ocean","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"Wind stress on the ocean, 2011 annual mean (ocean reanalysis). Trades push west, westerlies push east; the Southern Ocean takes the strongest push."},{"id":"fr_208","title":"Wind stress by latitude","x":2266.67,"y":-3100,"w":42133.33,"h":23700,"rotation":0,"duration":"auto","easing":"smooth","notes":"The strip, with the same latitudes: zonal-mean eastward wind stress. Westward in the trades, eastward in the westerlies, largest around 50°S. The ocean's side of the momentum ledger."},{"id":"fr_213","title":"Air against water","x":17300,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 4 (≈6 min, Smooth). The same push, on something ~850 times denser. Currents ~0.1 m/s (surface median in the 2011 reanalysis 0.06 m/s; its annual mean peaks at 1.3 m/s; boundary currents ~1-2 m/s) against winds ~10 m/s.\n- Bars are log scales. Heat carried = ρc × speed, per m² of cross-section per degree: ~34× more in a 0.1 m/s current than a 10 m/s wind. That's the mass × contrast line again. (Heat per m³ per degree: ~3,400×.)"},{"id":"fr_216","title":"How fast does it get going?","x":17300,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the sum. τ/(ρH): 0.1 N/m² over 50 m is ~2 × 10⁻⁶ m/s² (✓). Unopposed it would reach wind speed in about 60 days, and 0.1 m/s in half a day. It never reaches wind speed. Something stops it first, and that's rotation."},{"id":"fr_220","title":"Nansen's ice","x":38600,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 5 (≈8 min, Smooth). Fridtjof Nansen noticed on the Fram (1893-96) that Arctic ice drifted 20-40° to the right of the wind. Ekman worked out why in 1905 (Stewart Ch. 9). Builds on Suhas's Coriolis: moving things on a turning Earth veer right in the north, left in the south."},{"id":"fr_225","title":"Wind, Coriolis, and the water between","x":38600,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the force balance on the whole stirred layer, in the steady state. Two forces on it: the wind's stress along the wind, and Coriolis at 90° to the motion. They can cancel only if the motion is 90° to the right of the wind. So the net transport is at right angles to the wind (NH). No spiral algebra. The surface water goes at an angle; averaged over the layer, it's 90°."},{"id":"fr_230","title":"How much water?","x":38600,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the size. Transport per metre of width: τ/(ρf). With τ = 0.1 N/m² and f = 10⁻⁴ s⁻¹: ~1.0 m²/s (✓). Over a 50 m layer that's ~2 cm/s. Small, but over a whole basin it adds up, and where it diverges or converges water has to go up or down."},{"id":"fr_232","title":"Back to the Somali coast","x":1800,"y":5687.5,"w":3600,"h":2025,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 6 (≈8 min, Smooth). Back to the puzzle. Now put a coast in the way."},{"id":"fr_235","title":"Coastal upwelling","x":3060,"y":6865,"w":480,"h":270,"rotation":0,"duration":"auto","easing":"slowDrift","notes":"Into the section (Slow drift). The summer monsoon blows along the Somali coast, with the land on its left. Ekman transport is to the right: offshore. Water can't come out of the coast, so it comes from below: cold and nutrient-rich. Section looking along the wind; schematic."},{"id":"fr_239","title":"Other coasts","x":3060,"y":6865,"w":480,"h":270,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the same recipe elsewhere. Somali and Oman coasts in the summer monsoon. Peru (southern hemisphere, wind blowing north: transport to the left, offshore). California (wind blowing south: to the right, offshore). These are the world's great fisheries, and it's the reason the Arabian Sea has a cold, productive west side in July. That's the tutorial's question."},{"id":"fr_241","title":"Back to the cold tongue","x":21900,"y":6806.25,"w":4600,"h":2587.5,"rotation":0,"duration":"auto","easing":"smooth","notes":"Back to the Pacific (Smooth). The cold tongue has no coast. Why does water come up in mid-ocean?"},{"id":"fr_243","title":"Equatorial upwelling","x":22760,"y":7865,"w":480,"h":270,"rotation":0,"duration":"auto","easing":"slowDrift","notes":"Into the section (Slow drift). The trades blow west along the equator. Right of the wind in the north, left of it in the south: the water diverges, so it rises. f changes sign at the equator, which is all this needs. Section looking west; schematic. This closes the puzzle from the start of the lecture."},{"id":"fr_247","title":"This year's El Niño","x":22760,"y":7865,"w":480,"h":270,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the live hook. CPC El Niño Advisory, 8 Oct 2026 (check for the November update, due ~12 Nov): Niño-3.4 +2.1 °C, Niño-3 +3.0 °C, Niño-1+2 +3.9 °C, parts of the eastern equatorial Pacific above +4 °C, subsurface above +10 °C at depth; strong to very strong event likely through JFM 2027 (>83%). Weakened trades, weakened upwelling, warmer tongue. Full story later in the module."},{"id":"fr_249","title":"Hills of water","x":59900,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 7 (≈8 min, Smooth). Upwelling happens where Ekman transport diverges. Where it converges, water piles up. Under the trades it goes poleward; under the westerlies, equatorward. They meet near 30°. If this beat runs long, it spills into the notes and next lecture's opening, not extra class time.\n- A hill of water has pressure gradients, and on a turning Earth flow runs along them, not down them: geostrophic, as for Suhas's wind. High on the right of the flow in the north."},{"id":"fr_254","title":"Sea-surface height","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"The real hills. Ocean reanalysis, 2011 mean, global mean removed. The subtropical gyres stand about 0.9 m above the subpolar ocean (N Pacific 0.93, N Atlantic 0.94, S Pacific 1.05 m, box means, ✓)."},{"id":"fr_259","title":"Water flows around the hills","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the surface currents, reanalysis 2011 mean, 3° box means. Gyres: clockwise in the north, anticlockwise in the south, around the hills. In the Southern Ocean there's no land to stop them: the flow goes all the way round."},{"id":"fr_264","title":"West side, Atlantic","x":25300,"y":3131.25,"w":3800,"h":2137.5,"rotation":0,"duration":"auto","easing":"smooth","notes":"Zoom to the Gulf Stream (Smooth). Look which side the fast flow is on: west. Qualitative only: the reason is the change of Coriolis with latitude, in the notes (Stommel 1948; Stewart Ch. 11)."},{"id":"fr_266","title":"West side, Pacific","x":10600,"y":3531.25,"w":3800,"h":2137.5,"rotation":0,"duration":"auto","easing":"snappy","notes":"And the Pacific: the Kuroshio (Snappy). Same side. Agulhas off southern Africa, too."},{"id":"fr_268","title":"Where does the momentum go?","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 8 (≈2 min, Smooth). Close the ledger.\n- Where does the wind's momentum finally go? Friction with coasts and the sea floor. In most oceans continents hold up the flow. In the Southern Ocean no continent blocks the way round at Drake Passage's latitudes, so the Antarctic Circumpolar Current runs all the way round, and the momentum gets to the sea floor over undersea ridges.\n- Teaser: the ACC is also where deep water comes back up. Next week: salt, density and the overturning."}],"settings":{"defaultEasing":"smooth","defaultDuration":"auto"}};</script>
<script>
(function(){
  var DATA = window.__PRES__;
  var frames = DATA.frames, elements = DATA.elements.slice().sort(function(a,b){return a.z-b.z;});
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var world = document.getElementById('world');
  var progress = document.getElementById('progress');
  var index = 0, overview = false, raf = null;

  // ---- build element DOM ----
  var nodes = {};
  elements.forEach(function(el){
    var d = document.createElement('div');
    d.style.position='absolute'; d.style.left=el.x+'px'; d.style.top=el.y+'px';
    d.style.width=el.w+'px'; d.style.height=el.h+'px';
    var inner = document.createElement('div');
    inner.style.width='100%'; inner.style.height='100%';
    inner.style.transform='rotate('+el.rotation+'deg)';
    if(el.type==='text'){
      inner.innerHTML = el.content;
      var ts = el.textStyle||{};
      inner.style.fontSize=(ts.fontSize||32)+'px'; inner.style.fontWeight=(ts.fontWeight||400);
      inner.style.color=ts.color||'#000'; inner.style.textAlign=ts.align||'left';
      inner.style.display='flex'; inner.style.flexDirection='column'; inner.style.justifyContent='center';
    } else {
      var img=document.createElement('img'); img.src=el.content;
      img.style.width='100%'; img.style.height='100%'; img.style.display='block'; img.draggable=false;
      inner.appendChild(img);
    }
    d.appendChild(inner); world.appendChild(d); nodes[el.id]=d; d.style.display='none';
  });

  function vp(){ return {width: window.innerWidth, height: window.innerHeight}; }
  function frameToCam(f, v){ return {cx:f.x+f.w/2, cy:f.y+f.h/2, scale:Math.min(v.width/f.w, v.height/f.h), rotation:f.rotation}; }
  function applyCam(c){
    var v=vp();
    world.style.transform='translate('+(v.width/2)+'px,'+(v.height/2)+'px) rotate('+(-c.rotation)+'deg) scale('+c.scale+') translate('+(-c.cx)+'px,'+(-c.cy)+'px)';
  }

  // ---- van Wijk smooth zoom/pan ----
  function path(from,to,v,rho){
    rho=rho||1.4; var w0=v.width/from.scale, w1=v.width/to.scale;
    var dx=to.cx-from.cx, dy=to.cy-from.cy, u1=Math.hypot(dx,dy), rho2=rho*rho;
    var dRot=((to.rotation-from.rotation+540)%360)-180;
    if(u1<1e-6){ var S=Math.abs(Math.log(w1/w0))/rho||1e-6; return {S:S, at:function(t){var w=w0*Math.pow(w1/w0,t);return{cx:from.cx,cy:from.cy,scale:v.width/w,rotation:from.rotation+dRot*t};}};}
    var b0=(w1*w1-w0*w0+rho2*rho2*u1*u1)/(2*w0*rho2*u1);
    var b1=(w1*w1-w0*w0-rho2*rho2*u1*u1)/(2*w1*rho2*u1);
    var r0=Math.log(-b0+Math.sqrt(b0*b0+1)), r1=Math.log(-b1+Math.sqrt(b1*b1+1));
    var S=(r1-r0)/rho, ch0=Math.cosh(r0);
    return {S:Math.abs(S)||1e-6, at:function(t){var r=r0+rho*t*S; var u=(w0/(rho2*u1))*(ch0*Math.tanh(r)-Math.sinh(r0)); var w=w0*ch0/Math.cosh(r); return{cx:from.cx+dx*u,cy:from.cy+dy*u,scale:v.width/w,rotation:from.rotation+dRot*t};}};
  }
  // Proper CSS cubic-bezier easing: solve x(t)=time via Newton, then return y(t).
  // (Matches the editor's Motion easing so playback feels identical to the app.)
  function cubicBezier(x1,y1,x2,y2){
    var A=function(a,b){return 1-3*b+3*a;}, B=function(a,b){return 3*b-6*a;}, C=function(a){return 3*a;};
    var calc=function(t,a,b){return ((A(a,b)*t+B(a,b))*t+C(a))*t;};
    var slope=function(t,a,b){return 3*A(a,b)*t*t+2*B(a,b)*t+C(a);};
    return function(x){ if(x<=0)return 0; if(x>=1)return 1; var t=x;
      for(var i=0;i<6;i++){ var s=slope(t,x1,x2); if(s===0) break; t-=(calc(t,x1,x2)-x)/s; }
      return calc(t,y1,y2); };
  }
  var EASE={smooth:{e:cubicBezier(.4,0,.2,1),k:1},snappy:{e:cubicBezier(.2,.8,.2,1),k:.6},slowDrift:{e:cubicBezier(.33,0,.2,1),k:1.6},cut:{e:null,k:0}};

  var curCam = frames[0]?frameToCam(frames[0],vp()):{cx:0,cy:0,scale:1,rotation:0};
  function animateTo(target, easing, duration){
    if(raf) cancelAnimationFrame(raf);
    var v=vp(), p=path(curCam,target,v);
    var prof=EASE[easing]||EASE.smooth;
    var durMs = duration==='auto' ? Math.max(350,Math.min(2600,700*(0.4+p.S))) : duration;
    durMs *= prof.k||1;
    // will-change only while moving: left on, Chrome keeps the first raster scale and deep zooms blur.
    if(reduced||easing==='cut'||durMs<=0){ curCam=target; applyCam(target); world.style.willChange='auto'; return; }
    world.style.willChange='transform';
    var t0=performance.now();
    (function step(now){
      var t=Math.min(1,(now-t0)/durMs); var et=prof.e?prof.e(t):t;
      var c=p.at(et); applyCam(c);
      if(t<1){ raf=requestAnimationFrame(step); } else { curCam=target; world.style.willChange='auto'; }
    })(t0);
  }

  // ---- visibility (mirrors visibility.ts) ----
  function idxOf(id){ for(var i=0;i<frames.length;i++) if(frames[i].id===id) return i; return -1; }
  function visAt(el,i){
    var lc=el.lifecycle||{}; var enter = lc.enterAt? idxOf(lc.enterAt):0;
    if(i<enter) return false;
    var leave=Infinity;
    if(lc.onExit==='leave'){ var ref=lc.exitAt||lc.enterAt; var li=ref?idxOf(ref):enter; leave=li>=0?li:enter; }
    return i<=leave;
  }
  function render(i){
    elements.forEach(function(el){
      var on=visAt(el,i), node=nodes[el.id], wasOn=node.style.display!=='none';
      if(on&&!wasOn){ node.style.display=''; entrance(el,node); }
      else if(!on&&wasOn){ exit(el,node); }
    });
  }
  function entrance(el,node){
    if(reduced) return; var lc=el.lifecycle||{}; if(idxOf(lc.enterAt)!==index) return;
    var eff=lc.enterEffect;
    if(eff==='fade'){ node.animate([{opacity:0},{opacity:1}],{duration:500,easing:'ease-out'}); }
    else if(eff==='slide'){ var o=offset(lc.enterDirection); node.animate([{opacity:0,transform:'translate('+o.x+'px,'+o.y+'px)'},{opacity:1,transform:'none'}],{duration:500,easing:'ease-out'}); }
    else if(eff==='pulse'){ node.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:600}); }
  }
  function exit(el,node){
    var lc=el.lifecycle||{};
    if(reduced||lc.onExit!=='leave'||lc.exitEffect==='none'){ node.style.display='none'; return; }
    var o=lc.exitEffect==='slide'?offset(lc.enterDirection):{x:0,y:0};
    var a=node.animate([{opacity:1},{opacity:0,transform:'translate('+o.x+'px,'+o.y+'px)'}],{duration:400,easing:'ease-in'});
    a.onfinish=function(){ node.style.display='none'; };
  }
  function offset(dir){ var d=80; return dir==='right'?{x:d,y:0}:dir==='up'?{x:0,y:-d}:dir==='down'?{x:0,y:d}:{x:-d,y:0}; }

  // ---- deep links (mirrors deepLink.ts): #title-slug or #number ----
  function slugOf(t){ return String(t||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  var taken={}, hashes=frames.map(function(f,i){ var s=slugOf(f.title); if(!s||/^\d+$/.test(s)||taken[s]) return String(i+1); taken[s]=1; return s; });
  function frameFromHash(hash){
    var h=hash.replace(/^#/,''); try{ h=decodeURIComponent(h); }catch(e){ return -1; } h=h.toLowerCase();
    if(/^\d+$/.test(h)){ var n=Number(h); return n>=1&&n<=hashes.length?n-1:-1; }
    return h?hashes.indexOf(h):-1;
  }
  function setHash(i){ try{ history.replaceState(null,'','#'+hashes[i]); }catch(e){} }

  function go(i){
    i=Math.max(0,Math.min(frames.length-1,i)); var f=frames[i]; if(!f) return;
    overview=false; index=i; render(i); setHash(i);
    animateTo(frameToCam(f,vp()), f.easing, f.duration);
    if(progress) progress.style.width=((i+1)/frames.length*100)+'%';
  }
  function bounds(){
    if(!elements.length) return {x:-640,y:-360,w:1280,h:720,rotation:0};
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    elements.forEach(function(e){x0=Math.min(x0,e.x);y0=Math.min(y0,e.y);x1=Math.max(x1,e.x+e.w);y1=Math.max(y1,e.y+e.h);});
    var px=(x1-x0)*0.1, py=(y1-y0)*0.1; return {x:x0-px,y:y0-py,w:(x1-x0)+2*px,h:(y1-y0)+2*py,rotation:0};
  }
  function toggleOverview(){ if(overview){ go(index); } else { overview=true; animateTo(frameToCam(bounds(),vp()),'smooth','auto'); } }

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); overview?go(index):go(index+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); overview?go(index):go(index-1); }
    else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(frames.length-1); }
    else if(e.key==='o'||e.key==='O'){ toggleOverview(); }
  });
  stage.addEventListener('click',function(){ overview?go(index):go(index+1); });
  window.addEventListener('resize',function(){ applyCam(curCam); });
  window.addEventListener('hashchange',function(){ var i=frameFromHash(location.hash); if(i>=0&&(i!==index||overview)) go(i); });

  if(frames.length){
    index=Math.max(0,frameFromHash(location.hash)); curCam=frameToCam(frames[index],vp());
    render(index); applyCam(curCam); if(progress) progress.style.width=((index+1)/frames.length*100)+'%';
  }
})();</script>
</body>
