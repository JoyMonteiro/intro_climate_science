eft"},"lifecycle":{"enterAt":"fr_100","enterEffect":"fade","onExit":"leave","exitAt":"fr_108","exitEffect":"fade"}},{"id":"txt_104","type":"text","x":60650,"y":55875,"w":18500,"h":1125,"rotation":0,"z":951,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">How would we \u003cspan style=\"font-weight:700;color:#4A55A2\">know in time\u003c/span>?\u003c/div>","textStyle":{"fontSize":600,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_100","enterEffect":"fade","onExit":"leave","exitAt":"fr_108","exitEffect":"fade"}},{"id":"txt_106","type":"text","x":60650,"y":57625,"w":18500,"h":1500,"rotation":0,"z":952,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"font-weight:700;color:#4A55A2\">IPCC, 2021:\u003c/span> very likely to \u003cspan style=\"font-weight:700;color:#00809A\">weaken\u003c/span> this century; medium confidence of \u003cspan style=\"font-weight:700;color:#4A55A2\">no abrupt collapse before 2100\u003c/span>.\u003c/div>","textStyle":{"fontSize":450,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_105","enterEffect":"fade","onExit":"leave","exitAt":"fr_108","exitEffect":"fade"}},{"id":"txt_107","type":"text","x":60650,"y":59250,"w":18500,"h":1500,"rotation":0,"z":953,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">If it did collapse: the tropical rain belt shifts south, and the \u003cspan style=\"font-weight:700;color:#C9531A\">African and Asian monsoons weaken\u003c/span>.\u003c/div>","textStyle":{"fontSize":450,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_105","enterEffect":"fade","onExit":"leave","exitAt":"fr_108","exitEffect":"fade"}},{"id":"txt_109","type":"text","x":60650,"y":61125,"w":18500,"h":1000,"rotation":0,"z":954,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"font-weight:700;color:#4A55A2\">Next week:\u003c/span> the ocean remembers, and the ocean is changing.\u003c/div>","textStyle":{"fontSize":425,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_108","enterEffect":"fade","onExit":"leave","exitAt":"fr_108","exitEffect":"fade"}}],"frames":[{"id":"fr_3","title":"Yesterday's question","x":-4000,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"cut","notes":"O6 · THE OVERTURNING: THE SLOW OCEAN, AND CAN IT SWITCH? (Fri 13 Nov, 50 min). Opening (≈1 min, Cut). Where yesterday stopped: the Pacific along 165°W (WOCE salinity, as in O5). The fresh intermediate water from the south is there, and so is the bottom water from Antarctica, but there is no salty tongue from the north: the North Pacific makes no deep water. Ask for one guess before moving on; the answer comes in a few minutes."},{"id":"fr_8","title":"The mass ledger","x":17300,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈1 min, Smooth.) The third ledger this week. Momentum (Wednesday), salt (yesterday), and now mass: heavy water sinks, but sea level isn't falling, so the same amount has to come back up somewhere. Today: where it sinks, where and how it comes up, how long the round trip takes, and whether it can stop."},{"id":"fr_11","title":"Where water sinks","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 1 (≈4 min here, Smooth). The data scientist's hat. Yesterday's map of surface density (WOCE annual mean; navy denser than 27.4). Tracers (oxygen, CFCs, radiocarbon) show that deep water forms today only at high latitudes in the North Atlantic and in the Southern Ocean (Hartmann p. 224; Stewart p. 211: \"Bottom water is produced only in these two regions\").\n- North Atlantic: the Gulf Stream carries warm, salty water north into the Norwegian and Greenland Seas, where very cold air cools it until it is dense enough to sink (Hartmann p. 224). The Labrador Sea also makes deep water (Stewart Fig 13.1 names it).\n- Around Antarctica, especially the Weddell and Ross Seas: brine from sea ice, yesterday's slide (Hartmann pp. 224-225).\n- Convection happens in patches a few km across; the sinking that matters for the mass budget is spread over larger areas (Stewart p. 219). Don't go further than that."},{"id":"fr_21","title":"How much","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: how much. Hartmann p. 230: deep-water formation averages 1.5-2 × 10¹⁰ kg/s in the North Atlantic, about 15-20 Sv, and about 1 × 10¹⁰ kg/s (≈ 10 Sv) around Antarctica. A sverdrup (Sv) is a million cubic metres a second; the ACC on Wednesday was ~125 Sv, and the Gulf Stream off Florida about 30 Sv (Hartmann pp. 225, 229).\n- Don't repeat Hartmann's \"more than a factor of ten smaller than the western boundary currents\" (p. 230): his own boundary-current figure is ~60 Sv, so his numbers give a factor of 3-4. Say \"smaller than the Gulf Stream, but it fills the whole deep ocean\"."},{"id":"fr_25","title":"Why not the North Pacific?","x":38600,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 2 (≈4 min, Smooth). The physicist's hat. Yesterday's T-S diagram, redrawn for cold water (TEOS-10, potential density at the surface). Stewart p. 215: at high latitudes the water in every ocean gets cold enough to freeze, so every ocean makes ~−2 °C water at the surface; only the saltiest sinks. Stewart p. 211: the North Pacific forms cold, dense water, \"but it is not salty enough to sink to the bottom\"."},{"id":"fr_30","title":"The two surfaces","x":38600,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the two surfaces, WOCE annual means. North Atlantic 50-65°N, 40-10°W: S 35.1, 10.3 °C. North Pacific 45-55°N, 160°E-140°W: S 32.8, 8.4 °C (✓). The Pacific surface is 2.3 g/kg fresher."},{"id":"fr_33","title":"Cool it to freezing","x":38600,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: cool each to freezing at its own salinity. North Pacific: σ 26.4 at -1.8 °C, against σ 27.7 for the water at 2,000 m beneath it: still lighter, so it can't sink far, however cold it gets. North Atlantic: it matches the water at 2,000 m below it (σ 27.8) once cooled below ~4 °C, well before freezing (✓, our sums from WOCE and TEOS-10).\n- The bold line is the North Atlantic's water at 2,000 m (σ 27.8); the North Pacific's is a little lighter (27.7), and its surface misses both by more than 1 kg/m³."},{"id":"fr_36","title":"Why so fresh?","x":38600,"y":25375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: and why is the North Pacific so fresh? Yesterday's ledger: the trade winds carry fresh water from the Atlantic over Central America into the Pacific (Stewart pp. 78-81). Surface means 30°S-60°N: Atlantic 35.6, Pacific 34.6 (O5 ✓). The atmosphere's fresh-water export is what lets the Atlantic overturn. Hartmann Fig 7.16 shows the same thing in oxygen: high oxygen reaches great depths in the North Atlantic, and the North Pacific shows \"no evidence of downwelling\" (p. 222)."},{"id":"fr_38","title":"Wednesday's map","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 3 (≈1 min here, Smooth). Back to Wednesday's Ekman pumping map (2011 wind stress). The Southern Ocean belt, 50-62°S, is pulled up ~25 m a year (box mean ✓). Ask: what comes up there? The answer is the deep water from the North Atlantic."},{"id":"fr_45","title":"Coming back up","x":17300,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈7 min, Smooth.) Yesterday's Atlantic section along 30°W (WOCE salinity, same colours), now with lines of equal density: the four Hartmann draws in Fig 7.17 (σ 27.2, 27.4, 27.6, 27.8, potential density at the surface). Below the mixed layer mixing is weak, so deep water moves almost along surfaces of constant density (Hartmann p. 225). Point at the white lines: flat and deep in the north and the tropics; south of about 45°S they tilt up and reach the surface."},{"id":"fr_51","title":"Up the slope","x":17300,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the deep water from the North Atlantic goes south at 2-3 km (the salty tongue from yesterday) and rises along the sloping surfaces (drawn along σ 27.8) \"in the vicinity of 60°S\" (Hartmann p. 222), where the isopycnals reach the mixed layer (Hartmann p. 225, after Marshall & Speer 2012). The arrows are our drawing on our section, after Hartmann's Fig 7.17a."},{"id":"fr_54","title":"Wednesday's wind","x":17300,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: what pulls it up. The westerlies blow east (out of the page). South of the equator Ekman transport is to the left of the wind: north. Poleward of the jet more water leaves than arrives, so water comes up from below; equatorward of it, it is pushed down (Hartmann pp. 225-227). This is the teal belt on Wednesday's map. The same wind physics drives the slow ocean's return: that is the tie between O4 and O6.\n- If asked about eddies: they matter a lot here and partly cancel the wind's overturning (Hartmann pp. 227, 231). One sentence."},{"id":"fr_57","title":"The round trip","x":17300,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the rest of the loop. Some of the risen water is made denser again by cold and brine near Antarctica and sinks as bottom water, which spreads north along the floor. Some goes north near the surface and sinks again at ~1 km as the fresh intermediate water from yesterday (Hartmann p. 222). Hartmann p. 225: \"The Southern Ocean is thus a key region for both forming bottom water and bringing deep water back to the surface.\""},{"id":"fr_60","title":"How slow?","x":38600,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 4 (≈5 min, Smooth). Week 2's ruler: τ = C/λ, with ~140 years for 4,000 m of water, if it were all mixed at once. It isn't: the deep water is replaced only as fast as it forms and returns. Hartmann p. 225: the time to replace the deep ocean is \"on the order of 1000 years\", the turnover time. Stewart p. 222: 1,000 years from the North Atlantic to the North Pacific means a mean flow of about 1 mm/s.\n- This is the slow brake on warming from the O3 notes, and why the Southern Ocean warms more slowly than the rest of the globe: water rising there hasn't been at the surface for centuries (Hartmann p. 227)."},{"id":"fr_66","title":"The oldest water","x":38600,"y":38375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: where is the oldest water? Not at the bottom near Antarctica, but at middle depths in the North Pacific, the farthest from both places where deep water forms (Hartmann p. 225). The oldest water isn't at the bottom, so deep water must slowly rise elsewhere, as the mass budget requires (same page). It also matches the oxygen: the deep North Pacific has 10-15% oxygen saturation where the North Atlantic has ~85% (Hartmann p. 222)."},{"id":"fr_68","title":"Measuring it","x":22500,"y":1625,"w":12000,"h":6750,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 5 (≈1 min here, Smooth). The data scientist's hat. Since April 2004 a line of moorings across the Atlantic at 26.5°N, with cable measurements of the Florida Current and satellite winds for the Ekman part, has measured the whole overturning: the RAPID-MOCHA-WBTS array (UK, US and Florida). Dataset v2024.1a, rapid.ac.uk."},{"id":"fr_74","title":"Twenty years of it","x":-4000,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈5 min, Smooth.) The overturning at 26.5°N, northward transport in the upper ocean (moc_mar_hc10: 10-day low-pass), 2004-04-07 to 2024-03-22. Mean 17.0 Sv (✓; the plan said ~17). The 10-day values run from -4 to 32 Sv; yearly means (2005-2023) from 14.9 (2009) to 19.1 Sv (2006).\n- A straight line through the record falls ~0.9 Sv per decade (our fit, no significance test; ⚠ not in a course reading). Don't present it as a trend; it's the setup for the question.\n- Cite: RAPID AMOC observing project, NOC, NERC, NSF and NOAA, rapid.ac.uk, doi 10.5285/48d0bf43-0598-ceb2-e063-7086abc062f1."},{"id":"fr_79","title":"Twenty years, a thousand-year memory","x":-4000,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the question to leave on the screen. Twenty years of record, for a system with a 1,000-year memory and big swings from weather. What can it tell us? Not much yet about a long-term trend; a lot about how the overturning works, and a baseline. Stewart p. 222 makes the same point about direct current measurements of the deep flow."},{"id":"fr_81","title":"Two boxes","x":17300,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 6 (≈3 min, Smooth). Can be drawn on the board instead. Stommel's two-box idea (Stommel 1961; ⚠ the original isn't a course reading; Stewart pp. 215-218 gives the behaviour). A warm, salty box and a cold, fresher box. Dense water sinks in the cold box and returns at depth; the surface flow carries salty water north."},{"id":"fr_86","title":"The salt feedback","x":17300,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the feedback. Add fresh water in the north (rain, rivers, melting ice). The northern box gets lighter, the flow weakens, it carries less salt north, the north gets fresher still, and the flow weakens further. A positive feedback, the same kind as Argha's ice-albedo feedback."},{"id":"fr_89","title":"Two stable states","x":38600,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈5 min, Smooth.) The steady states of the simplest two-box model, as fresh water is added in the north (our calculation, dimensionless). On the upper branch the overturning runs; on the lower it is weak or reversed; the dashed middle is unstable. Both exist for the same forcing: two stable states. Same structure as Argha's snowball multiple equilibria (Stewart Fig 13.3 is the same idea, drawn in T and S)."},{"id":"fr_94","title":"Hysteresis","x":38600,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: walk the path. 1: freshen slowly along the top; the flow weakens a little. 2: past the edge there's no \"on\" state left, and it drops. 3: take the fresh water away again: it stays off. 4: only when the north is saltier than where it started does it come back on. Stewart p. 218 (after Rahmstorf 1995): \"Surface waters must become saltier than average for the first state to return.\" That is hysteresis: where you are depends on how you got there."},{"id":"fr_97","title":"Has it happened?","x":38600,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: how sensitive, and has it happened? Stewart p. 215: in Rahmstorf's (1995) model, ±0.1 Sv of extra fresh water into the North Atlantic switched a 14 Sv circulation on or off. The ice-core record shows abrupt changes many times in the last ice age: ~11,500 years ago Greenland warmed by ~8 °C in 40 years (Stewart p. 216, after Alley 2000). Heinrich events: surges of icebergs whose melt water is thought to have shut down deep-water formation, chilling the North Atlantic (Stewart pp. 216-218, Fig 13.2). The causes are still argued over (Stewart p. 218)."},{"id":"fr_100","title":"Could it switch off?","x":59900,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 7 (≈7 min, Smooth). Pair-and-share: 3 minutes in pairs, then hear three answers. No right answer; reward reasoning about evidence. Prompts if they stall: which way does warming push the fresh-water ledger (more rain at high latitudes, melting Greenland)? Who lives near the rain belts? What would RAPID show, and how long would we need to watch?"},{"id":"fr_105","title":"What the IPCC says","x":59900,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the assessed answer, after they've argued. IPCC AR6 WGI SPM C.3.4 (2021): the AMOC \"is very likely to weaken over the 21st century for all emissions scenarios\"; high confidence in the decline, low confidence in its size; \"medium confidence that there will not be an abrupt collapse before 2100\". If it did collapse: \"a southward shift in the tropical rain belt, weakening of the African and Asian monsoons and strengthening of Southern Hemisphere monsoons, and drying in Europe\" (✓ against the SPM, 12 Nov). For whom: the Asian monsoon is us.\n- Several recent papers argue tipping could come earlier; none has been read for the course, so don't cite them (WEEK3_PLAN decision 5)."},{"id":"fr_108","title":"Next week","x":59900,"y":51375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: close. The mass ledger: two places sink, the Southern Ocean's wind brings it back up, the round trip takes ~1,000 years, and on a salt ledger it may have more than one stable state. Next week (O7, the last lecture of the module): the ocean remembers, and the ocean is changing."}],"settings":{"defaultEasing":"smooth","defaultDuration":"auto"}};</script>
<script>
(function(){
  var DATA = window.__PRES__;
  var frames = DATA.frames, elements = DATA.elements.slice().sort(function(a,b){return a.z-b.z;});
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var world = document.getElementById('world');
  var progress = document.getElementById('progress');
  var index = 0, overview = false, raf = null;

  // ---- build element DOM ----
  var nodes = {};
  elements.forEach(function(el){
    var d = document.createElement('div');
    d.style.position='absolute'; d.style.left=el.x+'px'; d.style.top=el.y+'px';
    d.style.width=el.w+'px'; d.style.height=el.h+'px';
    var inner = document.createElement('div');
    inner.style.width='100%'; inner.style.height='100%';
    inner.style.transform='rotate('+el.rotation+'deg)';
    if(el.type==='text'){
      inner.innerHTML = el.content;
      var ts = el.textStyle||{};
      inner.style.fontSize=(ts.fontSize||32)+'px'; inner.style.fontWeight=(ts.fontWeight||400);
      inner.style.color=ts.color||'#000'; inner.style.textAlign=ts.align||'left';
      inner.style.display='flex'; inner.style.flexDirection='column'; inner.style.justifyContent='center';
    } else {
      var img=document.createElement('img'); img.src=el.content;
      img.style.width='100%'; img.style.height='100%'; img.style.display='block'; img.draggable=false;
      inner.appendChild(img);
    }
    d.appendChild(inner); world.appendChild(d); nodes[el.id]=d; d.style.display='none';
  });

  function vp(){ return {width: window.innerWidth, height: window.innerHeight}; }
  function frameToCam(f, v){ return {cx:f.x+f.w/2, cy:f.y+f.h/2, scale:Math.min(v.width/f.w, v.height/f.h), rotation:f.rotation}; }
  function applyCam(c){
    var v=vp();
    world.style.transform='translate('+(v.width/2)+'px,'+(v.height/2)+'px) rotate('+(-c.rotation)+'deg) scale('+c.scale+') translate('+(-c.cx)+'px,'+(-c.cy)+'px)';
  }

  // ---- van Wijk smooth zoom/pan ----
  function path(from,to,v,rho){
    rho=rho||1.4; var w0=v.width/from.scale, w1=v.width/to.scale;
    var dx=to.cx-from.cx, dy=to.cy-from.cy, u1=Math.hypot(dx,dy), rho2=rho*rho;
    var dRot=((to.rotation-from.rotation+540)%360)-180;
    if(u1<1e-6){ var S=Math.abs(Math.log(w1/w0))/rho||1e-6; return {S:S, at:function(t){var w=w0*Math.pow(w1/w0,t);return{cx:from.cx,cy:from.cy,scale:v.width/w,rotation:from.rotation+dRot*t};}};}
    var b0=(w1*w1-w0*w0+rho2*rho2*u1*u1)/(2*w0*rho2*u1);
    var b1=(w1*w1-w0*w0-rho2*rho2*u1*u1)/(2*w1*rho2*u1);
    var r0=Math.log(-b0+Math.sqrt(b0*b0+1)), r1=Math.log(-b1+Math.sqrt(b1*b1+1));
    var S=(r1-r0)/rho, ch0=Math.cosh(r0);
    return {S:Math.abs(S)||1e-6, at:function(t){var r=r0+rho*t*S; var u=(w0/(rho2*u1))*(ch0*Math.tanh(r)-Math.sinh(r0)); var w=w0*ch0/Math.cosh(r); return{cx:from.cx+dx*u,cy:from.cy+dy*u,scale:v.width/w,rotation:from.rotation+dRot*t};}};
  }
  // Proper CSS cubic-bezier easing: solve x(t)=time via Newton, then return y(t).
  // (Matches the editor's Motion easing so playback feels identical to the app.)
  function cubicBezier(x1,y1,x2,y2){
    var A=function(a,b){return 1-3*b+3*a;}, B=function(a,b){return 3*b-6*a;}, C=function(a){return 3*a;};
    var calc=function(t,a,b){return ((A(a,b)*t+B(a,b))*t+C(a))*t;};
    var slope=function(t,a,b){return 3*A(a,b)*t*t+2*B(a,b)*t+C(a);};
    return function(x){ if(x<=0)return 0; if(x>=1)return 1; var t=x;
      for(var i=0;i<6;i++){ var s=slope(t,x1,x2); if(s===0) break; t-=(calc(t,x1,x2)-x)/s; }
      return calc(t,y1,y2); };
  }
  var EASE={smooth:{e:cubicBezier(.4,0,.2,1),k:1},snappy:{e:cubicBezier(.2,.8,.2,1),k:.6},slowDrift:{e:cubicBezier(.33,0,.2,1),k:1.6},cut:{e:null,k:0}};

  var curCam = frames[0]?frameToCam(frames[0],vp()):{cx:0,cy:0,scale:1,rotation:0};
  function animateTo(target, easing, duration){
    if(raf) cancelAnimationFrame(raf);
    var v=vp(), p=path(curCam,target,v);
    var prof=EASE[easing]||EASE.smooth;
    var durMs = duration==='auto' ? Math.max(350,Math.min(2600,700*(0.4+p.S))) : duration;
    durMs *= prof.k||1;
    // will-change only while moving: left on, Chrome keeps the first raster scale and deep zooms blur.
    if(reduced||easing==='cut'||durMs<=0){ curCam=target; applyCam(target); world.style.willChange='auto'; return; }
    world.style.willChange='transform';
    var t0=performance.now();
    (function step(now){
      var t=Math.min(1,(now-t0)/durMs); var et=prof.e?prof.e(t):t;
      var c=p.at(et); applyCam(c);
      if(t<1){ raf=requestAnimationFrame(step); } else { curCam=target; world.style.willChange='auto'; }
    })(t0);
  }

  // ---- visibility (mirrors visibility.ts) ----
  function idxOf(id){ for(var i=0;i<frames.length;i++) if(frames[i].id===id) return i; return -1; }
  function visAt(el,i){
    var lc=el.lifecycle||{}; var enter = lc.enterAt? idxOf(lc.enterAt):0;
    if(i<enter) return false;
    var leave=Infinity;
    if(lc.onExit==='leave'){ var ref=lc.exitAt||lc.enterAt; var li=ref?idxOf(ref):enter; leave=li>=0?li:enter; }
    return i<=leave;
  }
  function render(i){
    elements.forEach(function(el){
      var on=visAt(el,i), node=nodes[el.id], wasOn=node.style.display!=='none';
      if(on&&!wasOn){ node.style.display=''; entrance(el,node); }
      else if(!on&&wasOn){ exit(el,node); }
    });
  }
  function entrance(el,node){
    if(reduced) return; var lc=el.lifecycle||{}; if(idxOf(lc.enterAt)!==index) return;
    var eff=lc.enterEffect;
    if(eff==='fade'){ node.animate([{opacity:0},{opacity:1}],{duration:500,easing:'ease-out'}); }
    else if(eff==='slide'){ var o=offset(lc.enterDirection); node.animate([{opacity:0,transform:'translate('+o.x+'px,'+o.y+'px)'},{opacity:1,transform:'none'}],{duration:500,easing:'ease-out'}); }
    else if(eff==='pulse'){ node.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:600}); }
  }
  function exit(el,node){
    var lc=el.lifecycle||{};
    if(reduced||lc.onExit!=='leave'||lc.exitEffect==='none'){ node.style.display='none'; return; }
    var o=lc.exitEffect==='slide'?offset(lc.enterDirection):{x:0,y:0};
    var a=node.animate([{opacity:1},{opacity:0,transform:'translate('+o.x+'px,'+o.y+'px)'}],{duration:400,easing:'ease-in'});
    a.onfinish=function(){ node.style.display='none'; };
  }
  function offset(dir){ var d=80; return dir==='right'?{x:d,y:0}:dir==='up'?{x:0,y:-d}:dir==='down'?{x:0,y:d}:{x:-d,y:0}; }

  // ---- deep links (mirrors deepLink.ts): #title-slug or #number ----
  function slugOf(t){ return String(t||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  var taken={}, hashes=frames.map(function(f,i){ var s=slugOf(f.title); if(!s||/^\d+$/.test(s)||taken[s]) return String(i+1); taken[s]=1; return s; });
  function frameFromHash(hash){
    var h=hash.replace(/^#/,''); try{ h=decodeURIComponent(h); }catch(e){ return -1; } h=h.toLowerCase();
    if(/^\d+$/.test(h)){ var n=Number(h); return n>=1&&n<=hashes.length?n-1:-1; }
    return h?hashes.indexOf(h):-1;
  }
  function setHash(i){ try{ history.replaceState(null,'','#'+hashes[i]); }catch(e){} }

  function go(i){
    i=Math.max(0,Math.min(frames.length-1,i)); var f=frames[i]; if(!f) return;
    overview=false; index=i; render(i); setHash(i);
    animateTo(frameToCam(f,vp()), f.easing, f.duration);
    if(progress) progress.style.width=((i+1)/frames.length*100)+'%';
  }
  function bounds(){
    if(!elements.length) return {x:-640,y:-360,w:1280,h:720,rotation:0};
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    elements.forEach(function(e){x0=Math.min(x0,e.x);y0=Math.min(y0,e.y);x1=Math.max(x1,e.x+e.w);y1=Math.max(y1,e.y+e.h);});
    var px=(x1-x0)*0.1, py=(y1-y0)*0.1; return {x:x0-px,y:y0-py,w:(x1-x0)+2*px,h:(y1-y0)+2*py,rotation:0};
  }
  function toggleOverview(){ if(overview){ go(index); } else { overview=true; animateTo(frameToCam(bounds(),vp()),'smooth','auto'); } }

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); overview?go(index):go(index+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); overview?go(index):go(index-1); }
    else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(frames.length-1); }
    else if(e.key==='o'||e.key==='O'){ toggleOverview(); }
  });
  stage.addEventListener('click',function(){ overview?go(index):go(index+1); });
  window.addEventListener('resize',function(){ applyCam(curCam); });
  window.addEventListener('hashchange',function(){ var i=frameFromHash(location.hash); if(i>=0&&(i!==index||overview)) go(i); });

  if(frames.length){
