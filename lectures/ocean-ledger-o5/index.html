s/sec_atl_names.svg","lifecycle":{"enterAt":"fr_112","enterEffect":"fade","onExit":"leave","exitAt":"fr_112","exitEffect":"fade"}},{"id":"txt_114","type":"text","x":18050,"y":91875,"w":18500,"h":1250,"rotation":0,"z":964,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Three \u003cspan style=\"font-weight:700;color:#4A55A2\">water masses\u003c/span>, named for where they were last at the surface.\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_112","enterEffect":"fade","onExit":"leave","exitAt":"fr_112","exitEffect":"fade"}},{"id":"txt_116","type":"text","x":39350,"y":90750,"w":12500,"h":1000,"rotation":0,"z":965,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">The Pacific, pole to pole\u003c/div>","textStyle":{"fontSize":575,"fontWeight":700,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_115","enterEffect":"fade","onExit":"leave","exitAt":"fr_120","exitEffect":"fade"}},{"id":"img_117","type":"svg","x":52100,"y":90875,"w":5750,"h":862.5,"rotation":0,"z":521,"content":"assets/k_sec.svg","lifecycle":{"enterAt":"fr_115","enterEffect":"fade","onExit":"leave","exitAt":"fr_120","exitEffect":"fade"}},{"id":"img_118","type":"svg","x":39350,"y":93250,"w":17159.42,"h":8000,"rotation":0,"z":522,"content":"assets/sec_pac.svg","lifecycle":{"enterAt":"fr_115","enterEffect":"fade","onExit":"leave","exitAt":"fr_120","exitEffect":"fade"}},{"id":"txt_119","type":"text","x":39350,"y":91875,"w":18500,"h":1250,"rotation":0,"z":966,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">\u003cspan style=\"font-weight:700;color:#C9531A\">No salty tongue from the north.\u003c/span> Why not?\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_115","enterEffect":"fade","onExit":"leave","exitAt":"fr_115","exitEffect":"fade"}},{"id":"txt_121","type":"text","x":39350,"y":91875,"w":18500,"h":1250,"rotation":0,"z":967,"content":"\u003cdiv style=\"flex:1 1 auto;line-height:1.3;\">Remember: the Atlantic is \u003cspan style=\"font-weight:700;color:#C9531A\">saltier\u003c/span>. \u003cspan style=\"font-weight:700;color:#4A55A2\">Tomorrow: where water sinks, and how it comes back up.\u003c/span>\u003c/div>","textStyle":{"fontSize":400,"fontWeight":400,"color":"#1C252D","align":"left"},"lifecycle":{"enterAt":"fr_120","enterEffect":"fade","onExit":"leave","exitAt":"fr_120","exitEffect":"fade"}}],"frames":[{"id":"fr_3","title":"From momentum to salt","x":-4000,"y":64375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"O5 · THE SALT LEDGER: WHAT MAKES SEAWATER HEAVY (Thu 12 Nov, 50 min). Opening (≈2 min, Smooth from wherever the deck is).\n- Where Wednesday stopped: momentum is mass × velocity. For a cubic metre of seawater the mass is its density, and density needs heat and salt. We've done heat; today, salt.\n- And the hook from the ACC: under the current with no coast, deep water comes up. Why was it down there? By the end of today we can read where it came from.\n- The three hats again, for a third budget. Labels in the corner of later slides say which hat we have on."},{"id":"fr_6","title":"The salt ledger","x":17300,"y":64375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 1 (≈3 min here, Smooth). The accountant's hat.\n- Salinity: grams of dissolved salt in a kilogram of seawater. The ocean's mean is about 34.7 (Hartmann p. 196; Stewart p. 80; WOCE ✓ 34.72). Hartmann writes ‰ and Stewart uses the practical salinity scale with no unit; \"g/kg\" is close enough for us.\n- Salt stays: evaporation and freezing take water and leave the salt; rain, rivers and melting ice add water (Stewart p. 78). Over the timescales here no salt is added or removed (rivers bring dissolved salt in only over millions of years).\n- The accountant's sum (ours): a 50 m mixed layer at S = 35 that loses 1 m of fresh water a year (E − P ≈ 2.7 mm/day, like the subtropics) gets saltier by 35 × 1/50 = 0.7 g/kg a year. It doesn't keep rising, so currents and mixing must carry salt away as fast as evaporation concentrates it. That's the ledger balancing."},{"id":"fr_13","title":"Salty and fresh","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈3 min, Smooth.) The data scientist's hat. Surface salinity, WOCE climatology (the T2 data set). Saltiest in the subtropics, about 20-30° (N Atlantic 20-30°N, 50-30°W: 37.2); freshest under the tropical rain band (E Pacific 5-10°N: 33.8) and at high latitudes, where rain, rivers and melting ice freshen the surface (Stewart p. 78, Fig 6.4). Box means, ✓."},{"id":"fr_23","title":"Evaporation minus rain","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: E − P, 2010-2020 mean: OAFlux v3 evaporation (Yu, Jin & Weller 2008, WHOI OA-2008-01; ⚠ citation to confirm on oaflux.whoi.edu) minus GPCP v2.3 precipitation (Adler et al. 2003, 2018). Same pattern as the salinity (Stewart Figs 6.4-6.5).\n- Box means (mm/day, ✓): N Atlantic subtropics +2.8, S Pacific subtropics +3.3, E Pacific rain band −3.9, W Pacific warm pool −3.6.\n- Why the subtropics: the dry, sinking branch of Suhas's Hadley cell. Why the rain band: its rising branch."},{"id":"fr_30","title":"The Atlantic exports fresh water","x":20700,"y":3425,"w":12000,"h":6750,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 2 (≈4 min, Smooth). Water evaporated from the Atlantic doesn't all come back as rain on the land that drains into the Atlantic. Some is carried by the trade winds across Central America into the Pacific: about 0.32 Sv, \"approximately equal to the flow in the Amazon River\" (Stewart pp. 78-81 and Fig 6.6, after Broecker 1997). The arrow is a schematic.\n- Our check with OAFlux − GPCP, 30°S-60°N: Atlantic +1.1 mm/day, Pacific +0.2 (✓, basin masks are rough)."},{"id":"fr_36","title":"So the Atlantic is saltier","x":20700,"y":3425,"w":12000,"h":6750,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: salinity in the same view. Surface means 30°S-60°N (WOCE): Atlantic 35.6, Pacific 34.6 (✓). Broecker: without an exchange of salty Atlantic water for fresher Pacific water, the whole Atlantic would get saltier by about 1 g per litre per millennium (Stewart p. 79). KEEP THIS ON THE BOARD: tomorrow needs it."},{"id":"fr_43","title":"Close to home","x":3400,"y":5506.25,"w":4600,"h":2587.5,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 3 (≈4 min, Smooth). Same latitude, same monsoon. Surface salinity, 10-20°N (WOCE, ✓): Arabian Sea (60-70°E) 36.2, Bay of Bengal (83-93°E) 32.9.\n- Arabian Sea: dry winds off Arabia and Africa, few rivers, and salty outflows from the Red Sea and the Persian Gulf (⚠ not in a course reading; general knowledge).\n- Bay of Bengal: monsoon rain and the Ganga-Brahmaputra and Irrawaddy (⚠ same)."},{"id":"fr_51","title":"Rain, rivers, deserts","x":3400,"y":5506.25,"w":4600,"h":2587.5,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: E − P in the same view (2010-2020, ✓): Arabian Sea +2.5 mm/day, Bay of Bengal −1.1. Rain alone doesn't make the Bay that fresh: the rivers do much of it. Stewart's ledger has rivers in it too (E − P plus river input, p. 78)."},{"id":"fr_57","title":"A freshwater lid","x":38600,"y":64375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈2 min, Smooth.) The physicist's hat. WOCE annual-mean profiles, box means over 10-20°N. The Bay's surface is ~3 g/kg fresher and so lighter: σ 20.7 against 23.4 at the surface (σ = density − 1000 kg/m³, defined here; ✓). Fresh water floats on salty water, and light water on heavy is hard to stir (O3: the stratification that stops the wind's stirring). So the Bay's surface layer stays thin and warm.\n- Aside if asked (⚠ not in a course reading): this lid is one reason the Bay's cyclones find warm water all the way down to the bottom of the lid."},{"id":"fr_63","title":"Heavy water","x":59900,"y":64375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 4 (≈8 min, Smooth). ρ(T, S, p): density depends on temperature, salinity and pressure. This is a T-S diagram at surface pressure (potential density, so the squeeze of depth is taken out): Hartmann Fig 7.1's idea, redrawn with TEOS-10 (gsw). No equation of state on screen.\n- σ = ρ − 1000 kg/m³: seawater is always within a few percent of 1000 kg/m³, so oceanographers quote only the difference (Stewart eq. 6.7; Hartmann p. 199).\n- Read it: down (colder) or right (saltier) is denser. Hartmann p. 196: salt and temperature matter about equally for density differences in the ocean."},{"id":"fr_69","title":"Warm water","x":59900,"y":64375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: warm water (25 °C, S = 35, TEOS-10 ✓). ρα = 0.30 kg/m³ per K; ρβ = 0.74 per g/kg. So +1 kg/m³ is cooling by 3.3 K or adding 1.4 g/kg: one g/kg is worth ~2.4 K. Ocean temperatures span 30 K and surface salinities only a few g/kg, so in warm water temperature does most of the work."},{"id":"fr_72","title":"Cold water","x":59900,"y":64375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: near freezing (0 °C): ρα = 0.054 kg/m³ per K, about 5.6× weaker than at 25 °C; ρβ = 0.80 per g/kg, about the same. +1 kg/m³ would need 18 K of cooling (impossible: the water freezes first) or 1.2 g/kg. The lines on the diagram stand almost upright at the bottom: in cold water, salt decides."},{"id":"fr_75","title":"No 4 degree maximum","x":59900,"y":64375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: fresh water is densest at 4 °C, which is why lakes freeze from the top and keep 4 °C water at the bottom. Seawater saltier than 24.7 has no such maximum: it keeps getting denser all the way down to freezing (Hartmann p. 197), at -1.92 °C for S = 35 (TEOS-10 ✓). So the coldest seawater is also the densest."},{"id":"fr_78","title":"Sea ice leaves its salt behind","x":-4000,"y":77375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈2 min, Smooth.) Brine rejection. When sea ice forms, salt is pushed out of the ice crystals as brine, which makes the water under the ice saltier and denser. Around Antarctica, especially the Weddell Sea, cold offshore winds push the ice away and new ice keeps forming in the open water (polynyas): the source of Antarctic Bottom Water (Hartmann pp. 224-225)."},{"id":"fr_84","title":"Why sinking is rare","x":17300,"y":77375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 5 (≈3 min, Smooth). Hartmann p. 225: 75% of the ocean has potential density above 27.4, but only 4% of the surface water is that dense. Our check from WOCE (annual means, TEOS-10): 78% of the volume; 1.4% of the surface in the annual mean. Hartmann's 4% includes winter, when the dense patches are biggest.\n- So deep water forms in only a few places, at a few times. Everywhere else the ocean is light water on heavy: the stratification that stopped the wind's stirring in O3."},{"id":"fr_90","title":"Where the surface is heavy","x":-1644.44,"y":-3100,"w":39288.89,"h":22100,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈1 min, Smooth.) Surface potential density, WOCE annual mean. Navy: denser than 27.4. Only a few patches, at high latitudes, and these are annual means: in winter they grow. These are tomorrow's places."},{"id":"fr_96","title":"Fingerprints","x":38600,"y":77375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 6 (≈4 min, Smooth; if short of time, merge into the section). Below the mixed layer, temperature and salinity change only by slow mixing, so water keeps the T and S it had when it last touched the surface (Stewart §13.4, p. 223; Hartmann p. 221). A T-S diagram tells you where water came from.\n- One WOCE profile, 30°S 25°W (1° box). The kinks: a salinity minimum at ~900 m, a deep salinity maximum at ~3,000 m, and the coldest water at the bottom (4,750 m). Three sources mixing (Stewart Fig 13.9 is the same idea for the South Atlantic). Don't name them yet: the section does that."},{"id":"fr_103","title":"Read the section","x":17300,"y":90375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"Beat 7 (≈8 min, Smooth): the activity. Salinity along 30°W, from Antarctica to Greenland (WOCE; Hartmann Fig 7.17b uses the same line; Stewart Fig 13.10 the western basins). South on the left. The depth scale changes at 1,000 m.\n- Pairs, 3 minutes, then hear three answers. Don't name the water masses until they've argued."},{"id":"fr_108","title":"Three tongues","x":17300,"y":90375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the reading. A salty tongue at 2-3 km, from the far North Atlantic, spreading south. A fresh tongue at ~1 km, from about 50°S near the Antarctic Polar Front, spreading north. Under both, the coldest, densest water, from around Antarctica (Stewart pp. 225-226, Fig 13.10). Stewart: the real flow is slow drift plus mixing along surfaces of equal density, not literally along the arrows (p. 227)."},{"id":"fr_112","title":"Their names","x":17300,"y":90375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the names (Stewart Table 13.1, pp. 225-226; Hartmann p. 222). North Atlantic Deep Water (NADW), salty, southward at 2-3 km. Antarctic Intermediate Water (AAIW; Stewart writes AIW), fresh, northward at ~1 km. Antarctic Bottom Water (AABW), formed in the Weddell Sea and other seas around Antarctica by cold and brine, on the bottom. The salty Mediterranean water is the orange blob near 35°N, 1 km: not asked about."},{"id":"fr_115","title":"The Pacific","x":38600,"y":90375,"w":20000,"h":11250,"rotation":0,"duration":"auto","easing":"smooth","notes":"(≈2 min, Smooth.) Same colours, along 165°W (Hartmann Fig 7.17c's line). The fresh intermediate water is there, and so is the bottom water from Antarctica. There is no salty tongue from the north: the North Pacific makes no deep water. Why not? Leave it as the question for tomorrow."},{"id":"fr_120","title":"Tomorrow","x":38600,"y":90375,"w":20000,"h":11250,"rotation":0,"duration":0,"easing":"cut","notes":"Hold: the hook for O6 (Fri 13 Nov). The North Pacific surface is too fresh to sink, however cold it gets: and we saw why at the start, the Atlantic exports fresh water to the Pacific. Tomorrow: where water sinks, how it comes back up (the Southern Ocean, and Wednesday's Ekman), how long the round trip takes, and whether it can switch off."}],"settings":{"defaultEasing":"smooth","defaultDuration":"auto"}};</script>
<script>
(function(){
  var DATA = window.__PRES__;
  var frames = DATA.frames, elements = DATA.elements.slice().sort(function(a,b){return a.z-b.z;});
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var world = document.getElementById('world');
  var progress = document.getElementById('progress');
  var index = 0, overview = false, raf = null;

  // ---- build element DOM ----
  var nodes = {};
  elements.forEach(function(el){
    var d = document.createElement('div');
    d.style.position='absolute'; d.style.left=el.x+'px'; d.style.top=el.y+'px';
    d.style.width=el.w+'px'; d.style.height=el.h+'px';
    var inner = document.createElement('div');
    inner.style.width='100%'; inner.style.height='100%';
    inner.style.transform='rotate('+el.rotation+'deg)';
    if(el.type==='text'){
      inner.innerHTML = el.content;
      var ts = el.textStyle||{};
      inner.style.fontSize=(ts.fontSize||32)+'px'; inner.style.fontWeight=(ts.fontWeight||400);
      inner.style.color=ts.color||'#000'; inner.style.textAlign=ts.align||'left';
      inner.style.display='flex'; inner.style.flexDirection='column'; inner.style.justifyContent='center';
    } else {
      var img=document.createElement('img'); img.src=el.content;
      img.style.width='100%'; img.style.height='100%'; img.style.display='block'; img.draggable=false;
      inner.appendChild(img);
    }
    d.appendChild(inner); world.appendChild(d); nodes[el.id]=d; d.style.display='none';
  });

  function vp(){ return {width: window.innerWidth, height: window.innerHeight}; }
  function frameToCam(f, v){ return {cx:f.x+f.w/2, cy:f.y+f.h/2, scale:Math.min(v.width/f.w, v.height/f.h), rotation:f.rotation}; }
  function applyCam(c){
    var v=vp();
    world.style.transform='translate('+(v.width/2)+'px,'+(v.height/2)+'px) rotate('+(-c.rotation)+'deg) scale('+c.scale+') translate('+(-c.cx)+'px,'+(-c.cy)+'px)';
  }

  // ---- van Wijk smooth zoom/pan ----
  function path(from,to,v,rho){
    rho=rho||1.4; var w0=v.width/from.scale, w1=v.width/to.scale;
    var dx=to.cx-from.cx, dy=to.cy-from.cy, u1=Math.hypot(dx,dy), rho2=rho*rho;
    var dRot=((to.rotation-from.rotation+540)%360)-180;
    if(u1<1e-6){ var S=Math.abs(Math.log(w1/w0))/rho||1e-6; return {S:S, at:function(t){var w=w0*Math.pow(w1/w0,t);return{cx:from.cx,cy:from.cy,scale:v.width/w,rotation:from.rotation+dRot*t};}};}
    var b0=(w1*w1-w0*w0+rho2*rho2*u1*u1)/(2*w0*rho2*u1);
    var b1=(w1*w1-w0*w0-rho2*rho2*u1*u1)/(2*w1*rho2*u1);
    var r0=Math.log(-b0+Math.sqrt(b0*b0+1)), r1=Math.log(-b1+Math.sqrt(b1*b1+1));
    var S=(r1-r0)/rho, ch0=Math.cosh(r0);
    return {S:Math.abs(S)||1e-6, at:function(t){var r=r0+rho*t*S; var u=(w0/(rho2*u1))*(ch0*Math.tanh(r)-Math.sinh(r0)); var w=w0*ch0/Math.cosh(r); return{cx:from.cx+dx*u,cy:from.cy+dy*u,scale:v.width/w,rotation:from.rotation+dRot*t};}};
  }
  // Proper CSS cubic-bezier easing: solve x(t)=time via Newton, then return y(t).
  // (Matches the editor's Motion easing so playback feels identical to the app.)
  function cubicBezier(x1,y1,x2,y2){
    var A=function(a,b){return 1-3*b+3*a;}, B=function(a,b){return 3*b-6*a;}, C=function(a){return 3*a;};
    var calc=function(t,a,b){return ((A(a,b)*t+B(a,b))*t+C(a))*t;};
    var slope=function(t,a,b){return 3*A(a,b)*t*t+2*B(a,b)*t+C(a);};
    return function(x){ if(x<=0)return 0; if(x>=1)return 1; var t=x;
      for(var i=0;i<6;i++){ var s=slope(t,x1,x2); if(s===0) break; t-=(calc(t,x1,x2)-x)/s; }
      return calc(t,y1,y2); };
  }
  var EASE={smooth:{e:cubicBezier(.4,0,.2,1),k:1},snappy:{e:cubicBezier(.2,.8,.2,1),k:.6},slowDrift:{e:cubicBezier(.33,0,.2,1),k:1.6},cut:{e:null,k:0}};

  var curCam = frames[0]?frameToCam(frames[0],vp()):{cx:0,cy:0,scale:1,rotation:0};
  function animateTo(target, easing, duration){
    if(raf) cancelAnimationFrame(raf);
    var v=vp(), p=path(curCam,target,v);
    var prof=EASE[easing]||EASE.smooth;
    var durMs = duration==='auto' ? Math.max(350,Math.min(2600,700*(0.4+p.S))) : duration;
    durMs *= prof.k||1;
    // will-change only while moving: left on, Chrome keeps the first raster scale and deep zooms blur.
    if(reduced||easing==='cut'||durMs<=0){ curCam=target; applyCam(target); world.style.willChange='auto'; return; }
    world.style.willChange='transform';
    var t0=performance.now();
    (function step(now){
      var t=Math.min(1,(now-t0)/durMs); var et=prof.e?prof.e(t):t;
      var c=p.at(et); applyCam(c);
      if(t<1){ raf=requestAnimationFrame(step); } else { curCam=target; world.style.willChange='auto'; }
    })(t0);
  }

  // ---- visibility (mirrors visibility.ts) ----
  function idxOf(id){ for(var i=0;i<frames.length;i++) if(frames[i].id===id) return i; return -1; }
  function visAt(el,i){
    var lc=el.lifecycle||{}; var enter = lc.enterAt? idxOf(lc.enterAt):0;
    if(i<enter) return false;
    var leave=Infinity;
    if(lc.onExit==='leave'){ var ref=lc.exitAt||lc.enterAt; var li=ref?idxOf(ref):enter; leave=li>=0?li:enter; }
    return i<=leave;
  }
  function render(i){
    elements.forEach(function(el){
      var on=visAt(el,i), node=nodes[el.id], wasOn=node.style.display!=='none';
      if(on&&!wasOn){ node.style.display=''; entrance(el,node); }
      else if(!on&&wasOn){ exit(el,node); }
    });
  }
  function entrance(el,node){
    if(reduced) return; var lc=el.lifecycle||{}; if(idxOf(lc.enterAt)!==index) return;
    var eff=lc.enterEffect;
    if(eff==='fade'){ node.animate([{opacity:0},{opacity:1}],{duration:500,easing:'ease-out'}); }
    else if(eff==='slide'){ var o=offset(lc.enterDirection); node.animate([{opacity:0,transform:'translate('+o.x+'px,'+o.y+'px)'},{opacity:1,transform:'none'}],{duration:500,easing:'ease-out'}); }
    else if(eff==='pulse'){ node.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:600}); }
  }
  function exit(el,node){
    var lc=el.lifecycle||{};
    if(reduced||lc.onExit!=='leave'||lc.exitEffect==='none'){ node.style.display='none'; return; }
    var o=lc.exitEffect==='slide'?offset(lc.enterDirection):{x:0,y:0};
    var a=node.animate([{opacity:1},{opacity:0,transform:'translate('+o.x+'px,'+o.y+'px)'}],{duration:400,easing:'ease-in'});
    a.onfinish=function(){ node.style.display='none'; };
  }
  function offset(dir){ var d=80; return dir==='right'?{x:d,y:0}:dir==='up'?{x:0,y:-d}:dir==='down'?{x:0,y:d}:{x:-d,y:0}; }

  // ---- deep links (mirrors deepLink.ts): #title-slug or #number ----
  function slugOf(t){ return String(t||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  var taken={}, hashes=frames.map(function(f,i){ var s=slugOf(f.title); if(!s||/^\d+$/.test(s)||taken[s]) return String(i+1); taken[s]=1; return s; });
  function frameFromHash(hash){
    var h=hash.replace(/^#/,''); try{ h=decodeURIComponent(h); }catch(e){ return -1; } h=h.toLowerCase();
    if(/^\d+$/.test(h)){ var n=Number(h); return n>=1&&n<=hashes.length?n-1:-1; }
    return h?hashes.indexOf(h):-1;
  }
  function setHash(i){ try{ history.replaceState(null,'','#'+hashes[i]); }catch(e){} }

  function go(i){
    i=Math.max(0,Math.min(frames.length-1,i)); var f=frames[i]; if(!f) return;
    overview=false; index=i; render(i); setHash(i);
    animateTo(frameToCam(f,vp()), f.easing, f.duration);
    if(progress) progress.style.width=((i+1)/frames.length*100)+'%';
  }
  function bounds(){
    if(!elements.length) return {x:-640,y:-360,w:1280,h:720,rotation:0};
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    elements.forEach(function(e){x0=Math.min(x0,e.x);y0=Math.min(y0,e.y);x1=Math.max(x1,e.x+e.w);y1=Math.max(y1,e.y+e.h);});
    var px=(x1-x0)*0.1, py=(y1-y0)*0.1; return {x:x0-px,y:y0-py,w:(x1-x0)+2*px,h:(y1-y0)+2*py,rotation:0};
  }
  function toggleOverview(){ if(overview){ go(index); } else { overview=true; animateTo(frameToCam(bounds(),vp()),'smooth','auto'); } }

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); overview?go(index):go(index+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); overview?go(index):go(index-1); }
    else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(frames.length-1); }
    else if(e.key==='o'||e.key==='O'){ toggleOverview(); }
  });
  stage.addEventListener('click',function(){ overview?go(index):go(index+1); });
  window.addEventListener('resize',function(){ applyCam(curCam); });
  window.addEventListener('hashchange',function(){ var i=frameFromHash(location.hash); if(i>=0&&(i!==index||overview)) go(i); });

  if(frames.length){
    index=Math.max(0,frameFromHash(location.hash)); curCam=frameToCam(frames[index],vp());
    render(index); applyCam(curCam); if(progress) progress.style.width=((index+1)/frames.length*100)+'%';
  }
})();</script>
</body>
